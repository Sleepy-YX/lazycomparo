  <!-- Pinned. This stays synchronous on purpose: the Play CDN is a JIT that
       styles the document as it parses, and the config block below would throw

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // neutral charcoal ramp — true grays; warmth comes only from the ember CTAs

              950: '#0a0a0b',
              900: '#111113',
              850: '#161618',
              800: '#1d1d20',

              500: '#4b4b53',

          },

  <!-- Exact versions, not floating ranges. Unpinned, @babel/standalone had
       already rolled this site onto Babel 8 without a single commit here —
       a live site should not be able to change under you like that. -->
  <script defer crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

       than everything else on the page combined — and as a blocking <head>
       script it made the browser download and parse a compiler before it was

  <style>

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; background: #28282c; border-radius: 999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      height: 18px; width: 18px; margin-top: -6px;

</head>
<body class="dark">
  <div id="root"></div>

  <script id="app-source" type="text/plain">
    const { useState, useMemo, useEffect } = React;

    /* ---------------- Icons (inline SVG, Lucide-style) ---------------- */
    const Icon = ({ children, className = 'w-4 h-4', ...rest }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
           className={className} {...rest}>{children}</svg>
    );
    const Camera = (p) => <Icon {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Icon>;
    const Battery = (p) => <Icon {...p}><rect x="1" y="6" width="18" height="12" rx="2" ry="2"/><line x1="23" y1="13" x2="23" y2="11"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="10" y1="10" x2="10" y2="14"/><line x1="14" y1="10" x2="14" y2="14"/></Icon>;
    const Cpu = (p) => <Icon {...p}><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></Icon>;
    const Monitor = (p) => <Icon {...p}><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></Icon>;
    const Package = (p) => <Icon {...p}><path d="M16.5 9.4l-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Icon>;
    const Sparkles = (p) => <Icon {...p}><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></Icon>;
    const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
    const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const RefreshCw = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></Icon>;
    const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
    const TrendingDown = (p) => <Icon {...p}><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></Icon>;
    const Tag = (p) => <Icon {...p}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></Icon>;
    const DollarSign = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
    const Award = (p) => <Icon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></Icon>;
    const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Icon>;
    const Layers = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
    const Star = (p) => <Icon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>;
    const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
    /* The brand mark — same geometry as /favicon.svg and the landing page's
       inline header logo. Deliberately NOT an <Icon>: it carries its own brand
       fills instead of currentColor strokes, and it must not drift from the
       favicon, so change all three together. */
    const BrandMark = ({ className = 'w-8 h-8' }) => (
      <svg viewBox="0 0 64 64" className={className} aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#d9482b" />
        <g fill="#f6f1e7">
          <rect x="14" y="17" width="36" height="7.5" rx="3.75" />
          <rect x="14" y="28.25" width="26" height="7.5" rx="3.75" opacity=".62" />
          <rect x="14" y="39.5" width="16" height="7.5" rx="3.75" opacity=".38" />
        </g>
      </svg>
    );

    /* ---------------- Phone catalog ---------------- */
    // The catalog lives in phones.json and is fetched by the bootstrap at the
    // bottom of this file, so adding a phone means editing data, not markup --
    // and the Phase 2 move to a Supabase table becomes a swap of the loader
    // rather than a rewrite.
    //
    // Per phone: normalized 0-100 spec scores drive the algorithm, while
    // displayInfo holds the human-readable values for the comparison matrix.
    const PHONES = window.__LC_PHONES;

    /* ---------------- Scoring Algorithm ---------------- */
    /*
     * scorePhone(phone, priorities, currentPhone)
     *   priorities = { camera, battery, performance, display } each 0-100.
     *   Returns { raw, adjusted, penalty, contributions }.
     *
     * raw score        = weighted average of the four normalized spec scores
     * ecosystem penalty:
     *     0  if same ecosystem (e.g. Samsung -> Samsung)
     *     5  if same family, different brand (Samsung -> Pixel)
     *    15  if crossing iOS <-> Android (bigger friction: iMessage/AirDrop/DeX loss)
     * adjusted score   = raw - penalty
     * contributions[i] = weight_i * spec_i / totalWeight (used to explain "why this phone")
     */
    function scorePhone(phone, priorities, currentPhone) {
      const keys = ['camera', 'battery', 'performance', 'display'];
      const totalWeight = keys.reduce((s, k) => s + priorities[k], 0);
      if (totalWeight === 0) return { raw: 0, adjusted: 0, penalty: 0, contributions: {} };

      let raw = 0;
      const contributions = {};
      keys.forEach((k) => {
        const c = (priorities[k] * phone.specs[k]) / totalWeight;
        contributions[k] = c;
        raw += c;
      });

      let penalty = 0;
      if (currentPhone && currentPhone.id !== phone.id) {
        if (currentPhone.ecosystem === phone.ecosystem) penalty = 0;
        else if (currentPhone.ecosystemFamily === phone.ecosystemFamily) penalty = 5;
        else penalty = 15;
      }

      return {
        raw: Math.round(raw * 10) / 10,
        adjusted: Math.round((raw - penalty) * 10) / 10,
        penalty,
        contributions,
      };
    }

    function ecosystemDelta(currentPhone, candidate) {
      // What does the user lose / gain if they switch?
      if (!currentPhone || currentPhone.id === candidate.id) return { lost: [], gained: [] };
      const cur = new Set(currentPhone.ecosystemFeatures);
      const cand = new Set(candidate.ecosystemFeatures);
      const lost = [...cur].filter((f) => !cand.has(f));
      const gained = [...cand].filter((f) => !cur.has(f));
      return { lost, gained };
    }

    function topPrioritiesForPhone(phone, priorities, contributions) {
      // Rank the four dimensions by contribution and take the top two.
      return Object.entries(contributions)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 2)
        .map(([k]) => k);
    }

    function verdictFor(currentScore, topScore) {
      const diff = topScore - currentScore;
      if (diff >= 8) return { label: 'Worth upgrading', tone: 'good',
        text: `Top recommendation scores +${diff.toFixed(1)} vs your current phone — a meaningful jump on your priorities.` };
      if (diff >= 3) return { label: 'Marginal upgrade', tone: 'meh',
        text: `Only +${diff.toFixed(1)} over your current phone. Worth it if you\'ll keep it 3+ years, otherwise wait.` };
      return { label: 'Wait a generation', tone: 'bad',
        text: `Your current phone still scores within ${Math.abs(diff).toFixed(1)} of the top pick for your priorities. Save the money.` };
    }

    /* ---------------- Resale & Depreciation ---------------- */
    const CURRENT_YEAR = 2026;
    // Depreciation is modelled as a constant annual rate (CAGR-style) from launchPrice to
    // today's street price, not a straight-line average — phones lose value fastest in year 1.
    function ageYears(phone) { return Math.max(1, CURRENT_YEAR - phone.year); }
    function retainedFraction(phone) { return phone.price / phone.launchPrice; }
    function annualDepreciationRate(phone) {
      const age = ageYears(phone);
      const retained = retainedFraction(phone);
      if (phone.year >= CURRENT_YEAR) return 0;
      return Math.round((1 - Math.pow(retained, 1 / age)) * 1000) / 10; // % per year, 1dp
    }

    function brandDepreciationStats() {
      const byBrand = {};
      PHONES.forEach((p) => {
        if (p.year >= CURRENT_YEAR) return; // exclude just-launched phones, no data yet
        if (!byBrand[p.brand]) byBrand[p.brand] = { total: 0, count: 0, accent: p.accent };
        byBrand[p.brand].total += annualDepreciationRate(p);
        byBrand[p.brand].count += 1;
      });
      return Object.entries(byBrand)
        .map(([brand, { total, count, accent }]) => ({ brand, avgRate: Math.round((total / count) * 10) / 10, accent }))
        .sort((a, b) => a.avgRate - b.avgRate);
    }

    /* ---------------- Price tracking & deal heat ----------------
       The games site gets its prices from a live feed (Steam + IsThereAnyDeal)
       because those APIs exist and are free. THERE IS NO EQUIVALENT FOR PHONES:
       no keyless public API publishes Singapore street prices, so nothing here
       is fetched at runtime and nothing here claims to be. These are the
       catalog's own tracked prices, and the UI says so rather than dressing
       static numbers up as live ones — the same reason mobile's footer stopped
       calling its catalogue "mock data for demo".

       When a real feed arrives (Phase 2), it lands in phoneDeal() and nothing
       above it has to change.

       Heat is the SAME four-step scale as the games app, the landing ticker
       and /how-we-rank — a badge has to mean the same thing on every site.
       Thresholds live here and in landing/how-we-rank.html; move both or the
       page stops being the authority it claims to be. */
    const CATALOG_REVIEWED = 'August 2026';

    // How far the street price has fallen from launch, in whole percent.
    function priceDrop(p) {
      if (!p.launchPrice || p.launchPrice <= 0) return 0;
      return Math.max(0, Math.round((1 - p.price / p.launchPrice) * 100));
    }

    /* The phone analogue of the games site's all-time-low check. A phone that
       is simply old has fallen a long way and that is not a deal — it is
       arithmetic. What IS a deal is falling further than its own brand
       normally falls by this age, which the catalog can answer because
       brandDepreciationStats() already measures exactly that curve.
       Same doctrine as games, where an all-time low outranks the raw
       percentage: the notable thing is the price beating expectation. */
    const UNDER_CURVE_MARGIN = 10;   // percent below predicted, before it counts
    let _brandRates = null;
    function brandRate(brandName) {
      if (!_brandRates) {
        _brandRates = {};
        brandDepreciationStats().forEach(b => { _brandRates[b.brand] = b.avgRate; });
      }
      return _brandRates[brandName];
    }
    function expectedPrice(p) {
      const rate = brandRate(p.brand);
      if (rate == null || p.year >= CURRENT_YEAR) return null;
      return p.launchPrice * Math.pow(1 - rate / 100, ageYears(p));
    }
    function underCurve(p) {
      const exp = expectedPrice(p);
      if (!exp) return false;
      return p.price <= exp * (1 - UNDER_CURVE_MARGIN / 100);
    }

    function dealHeat(p) {
      if (underCurve(p)) return 'hot';
      const d = priceDrop(p);
      if (d >= 45) return 'hot';
      if (d >= 25) return 'warm';
      if (d > 0) return 'mild';
      return 'none';
    }

    /* Class strings are spelled out in full on purpose — Tailwind's JIT scans
       source text, so a name built by concatenation is a name it never emits.
       Same table, same colours, same meanings as games/index.html. */
    const HEAT = {
      hot: {
        badge: 'bg-ember/25 text-orange-200 ring-ember/60',
        ring: 'ring-ember/50',
        glow: 'shadow-[0_0_16px_-3px_rgba(217,72,43,.85)]',
      },
      warm: { badge: 'bg-amber-500/20 text-amber-200 ring-amber-500/40', ring: 'ring-amber-500/30', glow: '' },
      mild: { badge: 'bg-emerald-500/20 text-emerald-300 ring-emerald-500/30', ring: 'ring-emerald-500/25', glow: '' },
      none: { badge: 'bg-ink-700 text-zinc-300 ring-ink-600', ring: 'ring-ink-700', glow: '' },
    };

    /* ---------------- Small UI primitives ---------------- */
    const cx = (...xs) => xs.filter(Boolean).join(' ');

    const StatBar = ({ value, max = 100, color = '#7c5cff', label, sub, showValue = true }) => {
      const pct = Math.max(0, Math.min(100, (value / max) * 100));
      return (
        <div>
          <div className="flex items-baseline justify-between text-xs mb-1">
            <span className="text-zinc-400">{label}</span>
            {showValue && <span className="text-zinc-200 font-medium">{sub ?? value}</span>}
          </div>
          <div className="h-2 rounded-full bg-ink-800 overflow-hidden">
            <div className="h-full rounded-full transition-all duration-500"
                 style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${color}80, ${color})` }} />
          </div>
        </div>
      );
    };

    const Pill = ({ children, tone = 'default' }) => {
      const tones = {
        default: 'bg-ink-700 text-zinc-300 ring-ink-600',
        good:    'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        meh:     'bg-amber-500/15 text-amber-300 ring-amber-500/30',
        bad:     'bg-rose-500/15 text-rose-300 ring-rose-500/30',
        accent:  'bg-accent/15 text-accent-soft ring-accent/40',
        // deal-heat tones, same names and colours as the games app's Pill
        hot:     'bg-ember/25 text-orange-200 ring-ember/60',
        warm:    'bg-amber-500/20 text-amber-200 ring-amber-500/40',
      };
      return <span className={cx('inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ring-1', tones[tone])}>{children}</span>;
    };

    const Card = ({ className = '', children, onClick }) => (
      <div onClick={onClick}
           className={cx('bg-ink-850 ring-1 ring-ink-700 rounded-2xl', onClick && 'cursor-pointer hover:ring-accent/50 transition', className)}>
        {children}
      </div>
    );

    const SectionTitle = ({ eyebrow, title, subtitle, icon: I }) => (
      <div className="mb-6">
        {eyebrow && <div className="text-[11px] uppercase tracking-widest text-accent-soft/80 mb-2 flex items-center gap-2">
          {I && <I className="w-3.5 h-3.5" />}{eyebrow}
        </div>}
        <h2 className="font-serif text-3xl md:text-4xl font-medium text-zinc-50">{title}</h2>
        {subtitle && <p className="text-zinc-400 mt-1 max-w-2xl">{subtitle}</p>}
      </div>
    );

    /* ---------------- Device artwork ----------------
       The games site gets card art free from Valve's CDN, keyed off an AppID
       it already stores. Phones have no such thing: press renders are
       copyrighted, and hotlinking a manufacturer's marketing image is neither
       free nor ours to do. So the art is drawn, from data the catalog already
       has.

       Drawn from the BACK, which is the counter-intuitive but correct call:
       every modern phone is the same black rectangle from the front, and the
       camera island is the only part of the silhouette that identifies a
       device across a grid of fifty. A Pixel's bar, an Ultra's four bare
       lenses, an iPhone Pro's square triangle and a Find X's disc are all
       recognisable at thumbnail size in a way "6.7 inch black slab" is not.

       No <filter> anywhere in here. Browse renders fifty of these at once and
       an feGaussianBlur per card is the one thing that would make that scroll
       badly; every soft edge is a gradient stop instead. */
    function cameraStyle(p) {
      const m = p.model.toLowerCase();
      switch (p.brand) {
        case 'Apple':
          if (/\bse\b/.test(m)) return 'appleSingle';
          return /pro|max/.test(m) ? 'appleTriple' : 'appleDuo';
        case 'Samsung':
          if (/z flip|z fold/.test(m)) return 'flip';
          if (/ultra/.test(m)) return 'stack4';
          if (/galaxy a/.test(m)) return 'stack3';
          return 'stack3';
        case 'Google':   return 'bar';
        case 'Nothing':  return 'nothing';
        case 'OnePlus':  return /nord/.test(m) ? 'squircle' : 'disc';
        case 'Oppo':     return /find/.test(m) ? 'disc' : 'squircle';
        case 'Xiaomi':   return /ultra/.test(m) ? 'disc' : 'squircle';
        case 'vivo':     return 'disc';
        case 'Honor':    return 'disc';
        default:         return 'squircle';
      }
    }

    // Device body is drawn in a local 0,0 -> 72,150 space, so every camera
    // island below can be positioned in the same coordinates.
    const CameraIsland = ({ style, glass, lens, rim }) => {
      const eye = (cxp, cyp, r) => (
        <g key={`${cxp}-${cyp}`}>
          <circle cx={cxp} cy={cyp} r={r} fill={rim} />
          <circle cx={cxp} cy={cyp} r={r * 0.72} fill={lens} />
          <circle cx={cxp - r * 0.22} cy={cyp - r * 0.24} r={r * 0.24} fill="#ffffff" opacity="0.5" />
        </g>
      );
      switch (style) {
        case 'appleTriple':
          return (<g>
            <rect x="7" y="8" width="30" height="30" rx="9" fill={glass} />
            {eye(15.5, 16.5, 5)}{eye(28.5, 16.5, 5)}{eye(15.5, 29.5, 5)}
            <circle cx="29" cy="30" r="2.2" fill="#f4d58d" />
          </g>);
        case 'appleDuo':
          return (<g>
            <rect x="7" y="8" width="25" height="25" rx="8" fill={glass} />
            {eye(15, 15.5, 5)}{eye(24, 25, 5)}
          </g>);
        case 'appleSingle':
          return (<g>
            <rect x="7" y="8" width="17" height="17" rx="6" fill={glass} />
            {eye(15.5, 16.5, 5)}
          </g>);
        case 'stack3':   // Galaxy S / A: bare lenses straight out of the shell
          return (<g>{eye(13, 13, 4.6)}{eye(13, 24, 4.6)}{eye(13, 35, 4.2)}</g>);
        case 'stack4':   // Ultra: four, the top pair fattest
          return (<g>{eye(13, 12, 5.2)}{eye(13, 24, 5.2)}{eye(13, 35, 4)}{eye(13, 44, 4)}
            <rect x="21" y="9" width="5" height="9" rx="2.5" fill="#f4d58d" opacity=".85" /></g>);
        case 'bar':      // Pixel: the visor, running the full width of the back
          // Drawn from -6 because this group is inset by 6 from the body edge,
          // and the visor is the one island that is genuinely flush with it.
          return (<g>
            <rect x="-6" y="12" width="72" height="17" rx="8.5" fill={glass} />
            {eye(16, 20.5, 5.4)}{eye(30, 20.5, 5.4)}
            <rect x="41" y="17" width="9" height="7" rx="3.5" fill={lens} opacity=".8" />
          </g>);
        case 'disc':     // OnePlus / Oppo Find / vivo / Honor: the big circle
          return (<g>
            <circle cx="36" cy="26" r="21" fill={glass} />
            <circle cx="36" cy="26" r="21" fill="none" stroke={rim} strokeWidth="1.4" />
            {eye(28, 19, 6.4)}{eye(44, 19, 6.4)}{eye(28, 34, 6.4)}
            <circle cx="44" cy="34" r="3" fill="#f4d58d" />
          </g>);
        case 'squircle':
          return (<g>
            <rect x="7" y="9" width="34" height="34" rx="11" fill={glass} />
            {eye(17, 19, 6.2)}{eye(31.5, 19, 5)}{eye(17, 33, 5)}
            <circle cx="32" cy="33" r="2.4" fill="#f4d58d" />
          </g>);
        case 'nothing':  // the transparent back is the whole product
          return (<g>
            <rect x="6" y="8" width="60" height="52" rx="10" fill={glass} opacity=".55" />
            <circle cx="46" cy="34" r="15" fill="none" stroke={rim} strokeWidth="1.2" opacity=".8" />
            <rect x="14" y="18" width="18" height="10" rx="3" fill={rim} opacity=".5" />
            {eye(17, 44, 6)}{eye(33, 44, 6)}
          </g>);
        case 'flip':     // clamshell: cover screen beside a two-lens column
          return (<g>
            <rect x="6" y="8" width="60" height="30" rx="8" fill={glass} />
            {eye(15, 17, 5.4)}{eye(15, 29, 5.4)}
            <rect x="27" y="12" width="33" height="22" rx="4" fill="#0d0d10" />
            <rect x="31" y="18" width="16" height="3" rx="1.5" fill={lens} opacity=".9" />
            <rect x="31" y="24" width="11" height="3" rx="1.5" fill={rim} opacity=".7" />
          </g>);
        default:
          return null;
      }
    };

    /* Shared by the full card art and the compact chip. `id` is a prefix, not
       the phone id, because a Compare view can show the same phone as both a
       chip and a card at once and duplicate gradient ids would cross-wire
       them — SVG ids are document-global, not per-<svg>. */
    const DeviceDefs = ({ id, a }) => (
      <defs>
              <linearGradient id={`bg-${id}`} x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor={a} stopOpacity="0.30" />
                <stop offset="55%" stopColor={a} stopOpacity="0.07" />
                <stop offset="100%" stopColor="#0a0a0b" stopOpacity="0.9" />
              </linearGradient>
              {/* stands in for the soft key light a product shot would have,
                  without costing a blur filter */}
              <radialGradient id={`halo-${id}`} cx="50%" cy="45%" r="55%">
                <stop offset="0%" stopColor={a} stopOpacity="0.42" />
                <stop offset="100%" stopColor={a} stopOpacity="0" />
              </radialGradient>
              <linearGradient id={`body-${id}`} x1="0" y1="0" x2="1" y2="0.35">
                <stop offset="0%" stopColor="#3a3a42" />
                <stop offset="26%" stopColor="#1a1a1f" />
                <stop offset="74%" stopColor="#141418" />
                <stop offset="100%" stopColor="#2e2e36" />
              </linearGradient>
              {/* the anodised rail: bright chamfer, dark web, bright chamfer */}
              <linearGradient id={`rail-${id}`} x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stopColor={a} stopOpacity="0.95" />
                <stop offset="45%" stopColor={a} stopOpacity="0.35" />
                <stop offset="100%" stopColor={a} stopOpacity="0.85" />
              </linearGradient>
              <linearGradient id={`glass-${id}`} x1="0" y1="0" x2="0.6" y2="1">
                <stop offset="0%" stopColor="#2b2b33" />
                <stop offset="100%" stopColor="#0f0f13" />
              </linearGradient>
              {/* One shade lighter than the back panel it sits on, so the
                  camera island keeps a silhouette instead of disappearing
                  into black-on-black. */}
              <linearGradient id={`island-${id}`} x1="0" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stopColor="#3c3c46" />
                <stop offset="100%" stopColor="#191920" />
              </linearGradient>
              {/* Screen: the phone is off, but a dark panel still catches the
                  room. This is where the card gets most of its colour. */}
              <linearGradient id={`screen-${id}`} x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0%" stopColor={a} stopOpacity="0.30" />
                <stop offset="42%" stopColor="#101014" />
                <stop offset="100%" stopColor="#08080a" />
              </linearGradient>
              <linearGradient id={`floor-${id}`} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={a} stopOpacity="0.18" />
                <stop offset="100%" stopColor={a} stopOpacity="0" />
              </linearGradient>
      </defs>
    );

    /* The hero half of the artwork, in its own 0,0 -> 72,150 space so the
       caller decides where it sits and how big it is. */
    const DeviceBack = ({ id, a, style, folds }) => (
      <g>
        <ellipse cx="40" cy="153" rx="46" ry="8" fill="#000000" opacity="0.55" />
        <rect x="0" y="0" width="72" height="150" rx="14" fill={`url(#body-${id})`} />
        <rect x="0" y="0" width="72" height="150" rx="14" fill="none"
              stroke={`url(#rail-${id})`} strokeWidth="2" />
        {/* glass back panel, inset from the rail like a real one */}
        <rect x="3" y="3" width="66" height="144" rx="11" fill={`url(#glass-${id})`} />
        {folds && (
          <g>
            <rect x="3" y="72" width="66" height="2" fill="#000000" opacity="0.55" />
            <rect x="3" y="74" width="66" height="1" fill={a} opacity="0.25" />
          </g>
        )}
        <g transform="translate(6 6)">
          <CameraIsland style={style} glass={`url(#island-${id})`} lens="#0b0b0f" rim="#5a5a68" />
        </g>
        {/* specular sweep across the back — one low-opacity polygon does what
            a blur filter would, at fifty cards a screen */}
        <polygon points="8,150 34,3 52,3 26,150" fill="#ffffff" opacity="0.05" />
      </g>
    );

    /* Compact chip for the Compare and Advisor rows — back view only, the
       same slot the games app fills with Steam's 231x87 capsule. */
    const PhoneThumb = ({ phone, className = '' }) => {
      const id = `t${phone.id}`;
      const style = cameraStyle(phone);
      return (
        <div className={cx('relative rounded-lg overflow-hidden shrink-0', className)}
             style={{ background: `${phone.accent}18`, border: `1px solid ${phone.accent}55` }}>
          <svg viewBox="-8 -6 88 168" className="w-full h-full" role="img"
               aria-label={`${phone.brand} ${phone.model}`} preserveAspectRatio="xMidYMid meet">
            <DeviceDefs id={id} a={phone.accent} />
            <DeviceBack id={id} a={phone.accent} style={style} folds={style === 'flip'} />
          </svg>
        </div>
      );
    };

    const PhoneArt = ({ phone, selected, className = '' }) => {
      const a = phone.accent;
      const id = phone.id;
      const style = cameraStyle(phone);
      const folds = style === 'flip';
      return (
        <div className={cx('relative aspect-[460/215] overflow-hidden bg-ink-900', className)}>
          <svg viewBox="0 0 460 215" className="w-full h-full" role="img"
               aria-label={`${phone.brand} ${phone.model}`} preserveAspectRatio="xMidYMid slice">
            <DeviceDefs id={id} a={a} />

            <rect width="460" height="215" fill={`url(#bg-${id})`} />
            <ellipse cx="310" cy="96" rx="165" ry="110" fill={`url(#halo-${id})`} />

            {/* Brand set large and nearly invisible, with the devices standing
                in front of it — the editorial layering that stops a wide dark
                tile reading as empty. Sized so the longest brand in the
                catalog still clears the left edge. */}
            <text x="20" y="150" fontSize="44" fontWeight="800" letterSpacing="-1.5"
                  fill={a} fillOpacity="0.13" style={{ fontFamily: 'Inter, system-ui, sans-serif' }}>
              {phone.brand.toUpperCase()}
            </text>

            {/* FRONT view, behind and left. Every phone is the same black
                rectangle from the front, which is exactly why it belongs
                BEHIND: it carries the screen (and so the colour), while the
                back carries the identity. */}
            <g transform="translate(232 42) rotate(6 32 66)" opacity="0.96">
              <ellipse cx="34" cy="136" rx="38" ry="6" fill="#000000" opacity="0.45" />
              <rect x="0" y="0" width="64" height="133" rx="13" fill={`url(#body-${id})`} />
              <rect x="0" y="0" width="64" height="133" rx="13" fill="none"
                    stroke={`url(#rail-${id})`} strokeWidth="1.8" />
              <rect x="3" y="3" width="58" height="127" rx="10.5" fill={`url(#screen-${id})`} />
              {phone.brand === 'Apple'
                ? <rect x="23" y="8" width="18" height="6" rx="3" fill="#08080a" />
                : <circle cx="32" cy="11" r="3" fill="#08080a" />}
              {/* the advisor's own shape, at a size where it reads as UI and
                  not as an attempt at legible text */}
              <rect x="10" y="24" width="30" height="5" rx="2.5" fill="#ffffff" opacity=".28" />
              <rect x="10" y="38" width="44" height="18" rx="5" fill="#34d399" opacity=".30" />
              {[64, 76, 88, 100].map(y => (
                <g key={y}>
                  <rect x="10" y={y} width="44" height="5" rx="2.5" fill="#ffffff" opacity=".10" />
                  <rect x="10" y={y} width={14 + (y % 7) * 4} height="5" rx="2.5" fill={a} opacity=".55" />
                </g>
              ))}
              <rect x="10" y="114" width="44" height="9" rx="4.5" fill="#d9482b" opacity=".85" />
            </g>

            {/* BACK view, in front and right — the hero, and the only part of
                the silhouette that says which phone this is. */}
            <g transform="translate(330 30) rotate(-7 36 75)">
              <DeviceBack id={id} a={a} style={style} folds={folds} />
            </g>

            <rect y="176" width="460" height="39" fill={`url(#floor-${id})`} />
          </svg>

          {/* Feather the art into the card body so the brand line never sits
              against a hard horizontal edge. */}
          <div className="absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-ink-850 to-transparent pointer-events-none" />
          {selected && (
            <div className="absolute top-2 right-2 w-6 h-6 rounded-full bg-accent flex items-center justify-center shadow-lg shadow-black/50">
              <Check className="w-3.5 h-3.5 text-ink-950" />
            </div>
          )}
        </div>
      );
    };

    /* ---------------- Price tag ----------------
       Reads as one unit: what you pay now, what it cost new, and how far it
       has fallen, with the drop badge carrying the deal-heat colour. Matching
       the games app's PriceTag, because a visitor crossing between the two
       sites should not have to relearn what a coloured percentage means. */
    const PriceTag = ({ phone, size = 'sm' }) => {
      const drop = priceDrop(phone);
      const heat = dealHeat(phone);
      return (
        <span className="inline-flex items-baseline gap-1.5 whitespace-nowrap">
          <span className={cx('font-semibold tabular-nums text-zinc-100', size === 'lg' ? 'text-lg' : 'text-sm')}>
            S${phone.price}
          </span>
          {drop > 0 && (
            <>
              <span className="text-[11px] text-zinc-500 line-through tabular-nums">S${phone.launchPrice}</span>
              <span className={cx('text-[10px] px-1.5 py-0.5 rounded-full ring-1 font-semibold tabular-nums', HEAT[heat].badge)}>
                −{drop}%
              </span>
            </>
          )}
        </span>
      );
    };

    /* ---------------- Phone card (used in Browse + Compare picker) ---------------- */
    const PhoneCard = ({ phone, selected, onClick, disabled, showPrice = true }) => {
      const heat = dealHeat(phone);
      const beatsCurve = underCurve(phone);
      const modelLabel = phone.model.replace(new RegExp(`^${phone.brand}\\s+`, 'i'), '');
      return (
      // Deal heat also warms the card edge — scanning fifty cards, the good
      // prices should be findable without reading a single number.
      <Card className={cx('relative animate-fade-in overflow-hidden',
                          disabled && 'opacity-40 pointer-events-none',
                          selected ? 'ring-2 ring-accent'
                                   : heat === 'hot' ? cx('ring-1', HEAT.hot.ring, HEAT.hot.glow)
                                   : heat === 'warm' ? cx('ring-1', HEAT.warm.ring) : null)}
            onClick={onClick}>
        <PhoneArt phone={phone} selected={selected} />
        <div className="p-4 pt-3">
          <div className="min-w-0">
            <div className="text-xs text-zinc-400 truncate">{phone.brand} · {phone.year}</div>
            <div className="text-zinc-100 font-semibold truncate" title={phone.model}>{modelLabel}</div>
            <div className="flex items-center gap-2 mt-1 flex-wrap">
              <Pill>{phone.tier}</Pill>
              {showPrice && <PriceTag phone={phone} />}
            </div>
          </div>
          <div className="mt-3">
            <StatBar label="Sentiment" value={phone.sentimentScore} sub={`${phone.sentimentScore}%`} color={phone.accent} />
          </div>
          <div className="mt-2.5 flex items-center gap-1.5 flex-wrap">
            <Pill>{phone.displayInfo.chipset}</Pill>
            <Pill>{phone.displayInfo.refreshRate}</Pill>
            {beatsCurve && (
              <Pill tone="hot"><TrendingDown className="w-3 h-3" /> below {phone.brand}'s curve</Pill>
            )}
          </div>
        </div>
      </Card>
      );
    };

    /* ---------------- Browse view ---------------- */
    const BrowseView = ({ shortlist, onToggle }) => {
      const [query, setQuery] = useState('');
      const [brand, setBrand] = useState('All');
      const [tier, setTier] = useState('All');
      const [sort, setSort] = useState('sentiment');
      const [dealsOnly, setDealsOnly] = useState(false);

      const brands = ['All', ...Array.from(new Set(PHONES.map(p => p.brand)))];
      const tiers = ['All', ...Array.from(new Set(PHONES.map(p => p.tier)))];
      // How many are actually beating their brand's curve right now. If that
      // is zero the toggle would empty the grid, so it disables itself.
      const dealCount = useMemo(() => PHONES.filter(p => dealHeat(p) === 'hot').length, []);
      const filtered = brand !== 'All' || tier !== 'All' || query.trim() !== '' || dealsOnly;

      const list = useMemo(() => {
        let out = PHONES.filter(p =>
          (brand === 'All' || p.brand === brand) &&
          (tier === 'All' || p.tier === tier) &&
          (!dealsOnly || dealHeat(p) === 'hot') &&
          (query.trim() === '' || (p.brand + ' ' + p.model).toLowerCase().includes(query.toLowerCase()))
        );
        if (sort === 'sentiment') out = out.sort((a,b)=>b.sentimentScore-a.sentimentScore);
        if (sort === 'price-asc') out = out.sort((a,b)=>a.price-b.price);
        if (sort === 'price-desc') out = out.sort((a,b)=>b.price-a.price);
        if (sort === 'year') out = out.sort((a,b)=>b.year-a.year);
        if (sort === 'drop') out = out.sort((a,b)=>priceDrop(b)-priceDrop(a));
        return out;
      }, [query, brand, tier, sort, dealsOnly]);

      const clear = () => { setQuery(''); setBrand('All'); setTier('All'); setDealsOnly(false); };

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Catalog" icon={Layers}
            title="Browse phones"
            subtitle={`${PHONES.length} devices across ${brands.length-1} brands, budget to flagship-plus, from 2021 to 2026. Tap a card to add it to your comparison shortlist.`} />

          <Card className="p-3 mb-3">
            <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto] gap-2">
              <div className="relative">
                <Search className="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2" />
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search brand or model..."
                  className="w-full bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-500" />
              </div>
              <Selector value={brand} onChange={setBrand} options={brands} label="Brand" />
              <Selector value={tier} onChange={setTier} options={tiers} label="Tier" />
              <Selector value={sort} onChange={setSort}
                options={['sentiment','price-asc','price-desc','drop','year']}
                labels={{sentiment:'Top sentiment', 'price-asc':'Price ↑','price-desc':'Price ↓', drop:'Biggest price drop', year:'Newest'}}
                label="Sort" />
            </div>
            <div className="mt-3 flex items-center gap-3 flex-wrap">
              <button type="button" onClick={() => dealCount && setDealsOnly(v => !v)} disabled={!dealCount}
                aria-pressed={dealsOnly}
                className={cx('inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full ring-1 transition',
                              !dealCount ? 'bg-ink-800 text-zinc-600 ring-ink-700 cursor-not-allowed'
                                         : dealsOnly ? 'bg-ember/25 text-orange-200 ring-ember/60'
                                                     : 'bg-ink-800 text-zinc-300 ring-ink-600 hover:ring-ember/50')}>
                <Tag className="w-3 h-3" /> Best value now ({dealCount})
              </button>
              <span className="text-xs text-zinc-500">{list.length} of {PHONES.length} shown</span>
              {filtered && (
                <button type="button" onClick={clear}
                        className="text-xs text-zinc-400 hover:text-accent-soft transition inline-flex items-center gap-1">
                  <X className="w-3 h-3" /> Clear filters
                </button>
              )}
            </div>
          </Card>

          {/* Provenance, stated where the prices are, not buried in a footer.
              These are tracked catalog prices, not a live feed — see the note
              on dealHeat() for why there isn't one. */}
          <div className="mb-6 flex items-start gap-2 text-xs text-zinc-500">
            <Info className="w-3.5 h-3.5 shrink-0 mt-0.5" />
            <span>
              Prices are typical Singapore street prices tracked in our catalog, last reviewed {CATALOG_REVIEWED} —
              not a live retailer feed. The drop percentage is against launch RRP.{' '}
              <a href="https://lazycomparo.com/how-we-rank" className="underline decoration-dotted hover:text-accent-soft">How we rank</a>.
            </span>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {list.map(p => (
              <PhoneCard key={p.id} phone={p} selected={shortlist.includes(p.id)} onClick={() => onToggle(p.id)} />
            ))}
            {list.length === 0 && (
              <div className="col-span-full text-center text-zinc-500 py-12">No phones match your filters.</div>
            )}
          </div>
        </div>
      );
    };

    const Selector = ({ value, onChange, options, labels, label }) => (
      <div className="relative">
        <label className="absolute -top-2 left-2 px-1 text-[10px] uppercase tracking-wider text-zinc-500 bg-ink-850">{label}</label>
        <select value={value} onChange={e=>onChange(e.target.value)}
                className="bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-3 pr-8 py-2 text-sm text-zinc-100 appearance-none">
          {options.map(o => <option key={o} value={o}>{labels?.[o] ?? o}</option>)}
        </select>
        <ChevronDown className="w-4 h-4 text-zinc-500 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
      </div>
    );

    /* ---------------- Compare view ---------------- */
    const CompareView = ({ shortlist, setShortlist, onGoBrowse }) => {
      const picked = shortlist.map(id => PHONES.find(p => p.id === id)).filter(Boolean);
      const canAddMore = picked.length < 3;

      if (picked.length < 2) {
        return (
          <div className="animate-fade-in">
            <SectionTitle eyebrow="Compare" icon={Layers}
              title="Side-by-side spec matrix"
              subtitle="Pick 2 or 3 phones from the catalog to compare specs, sentiment, and pros/cons." />
            <Card className="p-8 text-center">
              <div className="text-zinc-400 mb-4">You have {picked.length} phone{picked.length === 1 ? '' : 's'} selected. Add {2 - picked.length} more to start comparing.</div>
              <button onClick={onGoBrowse}
                className="inline-flex items-center gap-2 bg-ember hover:bg-ember-soft text-white font-semibold rounded-lg px-4 py-2 transition">
                Browse phones <ArrowRight className="w-4 h-4" />
              </button>
            </Card>
          </div>
        );
      }

      const specRows = [
        { key: 'sentimentScore', label: 'Sentiment', get: (p) => `${p.sentimentScore}%`, cmp: (a,b) => a.sentimentScore - b.sentimentScore, icon: Star },
        { key: 'price', label: 'Price', get: (p) => `S$${p.price}`, cmp: (a,b) => b.price - a.price, icon: DollarSign }, // lower price wins
        { key: 'year', label: 'Released', get: (p) => p.year, cmp: (a,b) => a.year - b.year },
        { key: 'chipset', label: 'Chipset', get: (p) => p.displayInfo.chipset, cmp: (a,b) => a.specs.performance - b.specs.performance, icon: Cpu },
        { key: 'display', label: 'Display', get: (p) => `${p.displayInfo.display} · ${p.displayInfo.refreshRate}`, cmp: (a,b) => a.specs.display - b.specs.display, icon: Monitor },
        { key: 'camera', label: 'Camera', get: (p) => p.displayInfo.cameraMP, cmp: (a,b) => a.specs.camera - b.specs.camera, icon: Camera },
        { key: 'battery', label: 'Battery', get: (p) => p.displayInfo.batteryMah, cmp: (a,b) => a.specs.battery - b.specs.battery, icon: Battery },
        { key: 'ram', label: 'RAM / Storage', get: (p) => `${p.displayInfo.ram} · ${p.displayInfo.storage}` },
        { key: 'ecosystem', label: 'Ecosystem', get: (p) => p.ecosystem, icon: Package },
      ];

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Compare" icon={Layers}
            title="Side-by-side comparison"
            subtitle="Green rows highlight the winner on each dimension." />

          {/* Phone chips row */}
          <div className={cx('grid gap-3 mb-6', picked.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3')}>
            {picked.map(p => (
              <Card key={p.id} className="p-4 relative">

    /* ---------------- Advisor view ---------------- */
    const PRIORITY_LABELS = { camera: 'Camera', battery: 'Battery life', performance: 'Performance', display: 'Display' };

    const DEFAULT_PRIORITIES = { camera: 70, battery: 70, performance: 50, display: 50 };

    // Static persona guide — the algorithm above scores specs, but ecosystem fit is

    const PERSONA_ADVICE = [
      { persona: 'Deep in iMessage/FaceTime with family and friends already on iPhone', recommend: 'Stay on iOS', tone: 'default',

    const PersonaGuide = () => (

    const AdvisorView = () => {

      const results = useMemo(() => {
        const currentScore = scorePhone(currentPhone, priorities, null);
        // Score every phone within budget (or slightly above), exclude the current phone from ranking
        const candidates = PHONES

            const topPri = topPrioritiesForPhone(p, priorities, s.contributions);

                <div>
                  <div className="font-serif text-zinc-100 font-medium leading-tight">LazyComparo</div>
                  <div className="text-[10px] uppercase tracking-widest text-zinc-500 leading-tight">Phone advisor</div>

              <nav className="ml-4 flex bg-ink-900 rounded-lg p-1 ring-1 ring-ink-800 overflow-x-auto min-w-0">

                            tab === id ? 'bg-ink-700 text-zinc-100' : 'text-zinc-400 hover:text-zinc-200')}>
                    <I className="w-4 h-4" /> {label}
                    {id === 'compare' && shortlist.length > 0 && (

              <div className="ml-auto hidden md:flex items-center gap-2 text-xs text-zinc-500">

          <main className="relative max-w-7xl mx-auto px-4 md:px-6 py-8">
            {tab === 'browse' &&
              <BrowseView shortlist={shortlist} onToggle={toggleShortlist} />}
            {tab === 'compare' &&
              <CompareView shortlist={shortlist} setShortlist={setShortlist} onGoBrowse={() => setTab('browse')} />}
            {tab === 'advisor' &&
              <AdvisorView />}
            {tab === 'resale' &&
              <ResaleView />}

          <footer className="relative border-t border-ink-800 mt-16">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-6 text-xs text-zinc-500 flex flex-wrap items-center justify-between gap-2">
              {/* "mock data for demo" was both inaccurate and self-defeating on a
                  live site — the catalogue is hand-compiled editorial data, which
                  is a real thing worth saying plainly. */}
              <div className="max-w-3xl">
                LazyComparo · we do the boring comparison work · specs and S$ street prices are editorial estimates compiled for the Singapore market, not live retail quotes — check the retailer before you buy.

              </div>
              {/* Trust pages live on the apex domain, so these are absolute. */}
              <nav className="flex flex-wrap items-center gap-x-3 gap-y-1" aria-label="About LazyComparo">
                <a className="hover:text-zinc-300 underline" href="https://lazycomparo.com/how-we-rank">How we rank</a>
                <a className="hover:text-zinc-300 underline" href="https://lazycomparo.com/about">About</a>

              </nav>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    /* ---------------- Boot ----------------
       Load the catalog, compile the app, run it.

       The compiler is NOT loaded up front. @babel/standalone is 2.4 MB — larger
       than everything else on this page put together — and it used to sit in
       <head> as a blocking script, so the browser fetched and parsed a whole
       compiler before it was allowed to paint anything. It is now requested
       after first paint, and only when the cache below misses: the transform
       output is kept in localStorage under a hash of the app source, so a
       returning visitor never downloads Babel at all. A second hash, of the
       compiled output, catches corrupted storage.

       Every failure path — cache miss, private mode, quota, corrupt entry,
       unpkg down — falls back to fetch-and-compile, i.e. the old behaviour.

       phones.json is fetched rather than inlined, which costs one round trip
       before first paint and means the page MUST be served over http -- opening
       index.html from the filesystem trips CORS. Use .claude\serve.ps1 locally.
       The catalog fetch and the compile are kicked off together, not in
       sequence: neither needs the other, and on a cold cache the 2.4 MB
       download dominates a small JSON file completely. */
    (function () {
      var CACHE_KEY = 'lc-mobile-compiled';
      var BABEL_URL = 'https://unpkg.com/@babel/standalone@8.0.4/babel.min.js';
      var root = document.getElementById('root');
      var src = document.getElementById('app-source').textContent;

      // FNV-1a, 32-bit. Not cryptographic and doesn't need to be — it only has
      // to notice that the source changed.
      function hash(s) {
        var h = 0x811c9dc5;
        for (var i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = (h * 0x01000193) >>> 0;
        }
        return h.toString(16);
      }
      var srcHash = hash(src);

      function readCache() {
        try {
          var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
          if (o && o.s === srcHash && typeof o.c === 'string' && hash(o.c) === o.h) return o.c;
        } catch (e) { /* private mode / corrupt entry — just compile again */ }
        return null;
      }

      function writeCache(code) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ s: srcHash, h: hash(code), c: code }));
        } catch (e) { /* over quota: site still works, next visit is just slower */ }
      }

      function fail(headline, detail) {
        console.error('App bootstrap failed:', detail);
        root.innerHTML =
          '<div style="max-width:640px;margin:12vh auto;padding:0 24px;' +
          'font-family:Inter,system-ui,sans-serif;color:#e7e7ea;">' +
          '<h1 style="font-size:20px;margin:0 0 8px;">' + headline + '</h1>' +
          '<pre style="color:#f87171;white-space:pre-wrap;font-size:13px;' +
          'line-height:1.5;margin:0;">' + String(detail && detail.stack || detail) +
          '</pre></div>';
      }

      // Resolves to the compiled JS, from cache when possible.
      function compiled() {
        var hit = readCache();
        if (hit) return Promise.resolve(hit);

        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = BABEL_URL;
          s.onerror = function () { reject(new Error('Could not load the compiler from ' + BABEL_URL)); };
          s.onload = function () {
            try {
              // runtime: 'classic' is pinned because the automatic runtime emits
              // `import` statements, which fail silently in a non-module script.
              var code = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
              writeCache(code);
              resolve(code);
            } catch (e) { reject(e); }
          };
          document.head.appendChild(s);
        });
      }

      var catalog = fetch('phones.json')
        .then(function (res) {
          if (!res.ok) throw new Error('phones.json -> HTTP ' + res.status);
          return res.json();
        })
        .then(function (phones) {
          if (!Array.isArray(phones) || phones.length === 0) {
            throw new Error('phones.json did not contain a non-empty array');
          }
          return phones;
        })
        .catch(function (e) {
          throw new Error('CATALOG:' + e + '\n\nphones.json must be served alongside ' +
            'index.html over http. If you opened this file directly from disk, run ' +
            '.claude\\serve.ps1 and use http://localhost:5173 instead.');
        });

      // React/ReactDOM are deferred, so wait for them before evaluating the app.
      var ready = new Promise(function (resolve) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', resolve);
        } else {
          resolve();
        }
      });

      Promise.all([catalog, compiled(), ready])
        .then(function (r) {
          window.__LC_PHONES = r[0];
          // A throw from here is a real app bug, not a bad cache — the hashes
          // already proved the code matches this file — so it is reported, not
          // retried, or the app could mount twice.
          try { (0, eval)(r[1]); }
          catch (e) { fail('The app failed to start.', e); }
        })
        .catch(function (e) {
          var msg = String(e && e.message || e);
          if (msg.indexOf('CATALOG:') === 0) {
            fail("Couldn't load the phone catalog.", msg.slice(8));
          } else {
            fail('The app failed to start.', e);
          }
        });
    })();
  </script>
</body>
</html>
