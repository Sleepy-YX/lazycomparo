<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LazyComparo">
  <!-- The comparison stamp: a hanko-red tile holding a sorted ranking, the pick
       on top at full strength. Brand colours only (ember #d9482b on paper
       #f6f1e7) so the mark reads the same on the light landing page and on the
       dark app shells. Keep this file, games/favicon.svg and mobile/favicon.svg
       identical - three different logos is what this replaced. -->
  <rect width="64" height="64" rx="15" fill="#d9482b"/>
  <g fill="#f6f1e7">
    <rect x="14" y="17" width="36" height="7.5" rx="3.75"/>
    <rect x="14" y="28.25" width="26" height="7.5" rx="3.75" opacity=".62"/>
    <rect x="14" y="39.5" width="16" height="7.5" rx="3.75" opacity=".38"/>
  </g>
</svg>
