                      <button onClick={() => onRemove(g.id)}
                              aria-label={`Remove ${g.title} from the comparison`}
                              title={`Remove ${g.title}`}
                              className="absolute -top-1.5 -right-1.5 p-0.5 rounded-full bg-ink-900 ring-1 ring-ink-700 text-zinc-400 hover:text-rose-400 transition">
                        <X className="w-3 h-3" />
                      </button>
                    </div>
                  ))}
                </div>
                <span className="shrink-0 text-[11px] text-zinc-500 tabular-nums">{picked.length}/{max}</span>
              </div>

              <div className="flex items-center gap-2 shrink-0">
                <button onClick={onClear}
                        className="text-xs text-zinc-500 hover:text-zinc-300 transition px-2 py-2 shrink-0">
                  Clear
                </button>
                {/* Disabled at one pick rather than hidden: the label is what
                    tells you what is missing, so removing it removes the
                    instruction too. */}
                <button onClick={onCompare} disabled={!ready}
                        className={cx('flex-1 md:flex-none inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold transition whitespace-nowrap',
                          ready ? 'bg-ember hover:bg-ember-soft text-white'
                                : 'bg-ink-800 text-zinc-500 cursor-not-allowed')}>
                  {ready ? `Compare ${picked.length} games` : 'Pick 1 more to compare'}
                  {ready && <ArrowRight className="w-4 h-4" />}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    /* ---------------- Browse view ---------------- */
    const BrowseView = ({ shortlist, onToggle, initialQuery = '' }) => {
      const { games: GAMES } = useGames();
      const featuredVideo = useFeaturedVideo();
      const [query, setQuery] = useState(initialQuery);
      const [genre, setGenre] = useState('All');
      const [coop, setCoop] = useState('All');
      const [sort, setSort] = useState('year');
      const [saleOnly, setSaleOnly] = useState(false);

      const genres = bucketOptions(GAMES);
      // How many are discounted right now — 0 until the live Steam feed lands,
      // which is also when the toggle would filter everything out, so it's
      // disabled until there's something to show.
      const saleCount = GAMES.filter(g => g.discount > 0).length;

      const list = useMemo(() => {
        let out = GAMES.filter(g =>
          (genre === 'All' || genreBucket(g) === genre) &&
          (coop === 'All' || (coop === 'Co-op' ? g.maxPlayers > 1 : g.maxPlayers === 1)) &&
          (!saleOnly || g.discount > 0) &&
          (query.trim() === '' || (g.studio + ' ' + g.title + ' ' + g.genre).toLowerCase().includes(query.toLowerCase()))
        );
        if (sort === 'rating') out = out.sort((a,b)=>b.displayInfo.rating-a.displayInfo.rating);
        if (sort === 'price-asc') out = out.sort((a,b)=>a.price-b.price);
        if (sort === 'price-desc') out = out.sort((a,b)=>b.price-a.price);
        if (sort === 'year') out = out.sort((a,b)=>b.year-a.year);
        if (sort === 'value') out = out.sort((a,b)=>dollarsPerHour(a)-dollarsPerHour(b));
        if (sort === 'discount') out = out.sort((a,b)=>(b.discount||0)-(a.discount||0));
        return out;
      }, [GAMES, query, genre, coop, sort, saleOnly]);

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Catalog" icon={Layers}
            title="Browse games"
            subtitle={`${GAMES.length} PC games, newest first. Steam prices and ratings are live from the Singapore store — with Epic and GOG prices on the store badges when the cross-store feed is up.`} />

          {/* The old "tap a card to add it" instruction lived inside the
              subtitle above, which is `hidden sm:block` — so on a phone the
              only explanation of how selection worked was not rendered at all.
              Every card now carries a labelled Compare button, so the grid
              explains itself; this is just the first nudge, and it retires the
              moment there is something in the shortlist, because from then on
              the compare bar is saying something more useful. */}
          {shortlist.length === 0 && (
            <div className="mb-4 flex items-center gap-2 text-xs text-zinc-400">
              <Plus className="w-3.5 h-3.5 text-accent-soft shrink-0" />
              <span>Add 2 or 3 games with <span className="text-zinc-200 font-medium">Compare</span> to see them side by side.</span>
            </div>
          )}

          <Card className="p-3 mb-4">
            <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto_auto] gap-2">
              <div className="relative">
                <Search className="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2" />
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search title, studio or genre..."
                  className="w-full bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-500" />
              </div>
              <Selector value={genre} onChange={setGenre} options={genres} label="Genre" />
              <Selector value={coop} onChange={setCoop} options={['All','Co-op','Singleplayer']} label="Mode" />
              <Selector value={sort} onChange={setSort}
                options={['year','rating','discount','price-asc','price-desc','value']}
                labels={{year:'Newest', rating:'Top rated', discount:'On sale', 'price-asc':'Price ↑','price-desc':'Price ↓', value:'Best $/hour'}}
                label="Sort" />
              {/* Filter, not a sort — "show me only what's discounted right now". */}
              <button type="button" onClick={() => setSaleOnly(v => !v)}
                      disabled={saleCount === 0}
                      aria-pressed={saleOnly}
                      title={saleCount === 0 ? 'Waiting for live Steam prices' : `${saleCount} of ${GAMES.length} games are discounted right now`}
                      className={cx('rounded-lg px-3 py-2 text-sm inline-flex items-center gap-1.5 ring-1 transition whitespace-nowrap',
                        saleCount === 0 && 'opacity-40 cursor-not-allowed',
                        saleOnly
                          ? 'bg-emerald-500/20 text-emerald-200 ring-emerald-500/50'
                          : 'bg-ink-900 text-zinc-400 ring-ink-700 hover:text-zinc-200')}>
                <Tag className="w-3.5 h-3.5" />
                On sale
                {saleCount > 0 && <span className={cx('text-[10px] rounded-full px-1.5 leading-4 font-semibold',
                                                      saleOnly ? 'bg-emerald-400 text-ink-950' : 'bg-ink-700 text-zinc-300')}>{saleCount}</span>}
              </button>
            </div>
          </Card>

          {/* Below the filters, above the grid: the product stays the first
              thing you can act on, and the video is the first thing you see
              before the catalog itself. Renders nothing when unconfigured. */}
          <FeaturedVideo video={featuredVideo} />

          <div className="mb-4 flex items-center justify-between gap-3 text-xs text-zinc-500">
            <span>Showing {list.length} of {GAMES.length} games</span>
            {(genre !== 'All' || coop !== 'All' || saleOnly || query.trim() !== '') && (
              <button onClick={() => { setGenre('All'); setCoop('All'); setSaleOnly(false); setQuery(''); }}
                      className="inline-flex items-center gap-1 hover:text-zinc-300 transition">
                <X className="w-3 h-3" /> Clear filters
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {list.map(g => (
              <GameCard key={g.id} game={g} selected={shortlist.includes(g.id)}
                        full={shortlist.length >= MAX_COMPARE && !shortlist.includes(g.id)}
                        onClick={() => onToggle(g.id)} />
            ))}
            {list.length === 0 && (
              <div className="col-span-full text-center text-zinc-500 py-12">No games match your filters.</div>
            )}
          </div>
        </div>
      );
    };

    /* ---------------- Compare view ---------------- */
    /* ---------------- Compare: verdict machinery ----------------
       The landing page promises "verdict first, specs second"; this is the
       verdict. It is computed from the SAME rows the table renders, so the
       banner and the little award icons can never disagree with each other —
       one source of truth, exactly like the landing page's stopProgress().

       Weights say which rows actually decide a purchase. Release year and
       Early Access are context, not merit: at weight 0 a 2024 game can't
       out-argue a cheaper, better-reviewed 2019 one just for being new. */
    const ROW_WEIGHT = {
      rating: 2, value: 2, price: 1.5, cheapest: 1, hours: 1,
      combat: 0.5, story: 0.5, replay: 0.5,
      year: 0, stores: 0, alltimelow: 0, players: 0, earlyAccess: 0,
    };
    const SPEC_CAVEAT = {
      combat: 'deeper combat',
      story: 'a stronger story',
      coop: 'proper co-op',
      replay: 'more replay value',
    };

    function buildVerdict(picked, rows, deals) {
      const score = {}, wins = {};
      picked.forEach(g => { score[g.id] = 0; wins[g.id] = 0; });

      let counted = 0, totalWeight = 0;
      rows.forEach(row => {
        const w = ROW_WEIGHT[row.key] || 0;
        if (!row.cmp || !w) return;
        counted++; totalWeight += w;
        const sorted = [...picked].sort(row.cmp);        // worst → best
        const best = sorted[sorted.length - 1];
        // a dead heat shouldn't hand anyone the row
        if (row.cmp(sorted[sorted.length - 2], best) === 0) return;
        score[best.id] += w;
        wins[best.id] += 1;
      });

      const ranked = [...picked].sort((a, b) =>
        (score[b.id] - score[a.id]) || (b.displayInfo.rating - a.displayInfo.rating));
      const top = ranked[0], next = ranked[1];
      const margin = totalWeight ? (score[top.id] - score[next.id]) / totalWeight : 0;

      // Reasons are concrete deltas against the runner-up, never adjectives.
      const reasons = [];
      if (atHistoryLow(deals, top)) reasons.push('it is at its all-time low right now');
      const dTop = dollarsPerHour(top), dNext = dollarsPerHour(next);
      if (dTop < dNext) reasons.push(`S$${dTop.toFixed(2)} an hour against S$${dNext.toFixed(2)}`);
      const rd = top.displayInfo.rating - next.displayInfo.rating;
      if (rd >= 3) reasons.push(`${rd} points better reviewed on Steam`);
      const pd = Math.round((next.price - top.price) * 100) / 100;
      const hourRatio = next.displayInfo.hoursToBeat
        ? top.displayInfo.hoursToBeat / next.displayInfo.hoursToBeat : 1;
      if (pd >= 3) reasons.push(`S$${pd.toFixed(2)} cheaper`);
      else if (pd <= -3 && hourRatio >= 1.3) reasons.push(`S$${Math.abs(pd).toFixed(2)} more for ${hourRatio.toFixed(1)}× the playtime`);
      const hd = top.displayInfo.hoursToBeat - next.displayInfo.hoursToBeat;
      if (hd >= 5 && reasons.length < 3) reasons.push(`${hd} more hours in it`);

      // The honest counterweight: where the runner-up genuinely wins.
      let caveat = null, gapNeeded = 12;
      Object.keys(SPEC_CAVEAT).forEach(k => {
        const gap = (next.specs[k] || 0) - (top.specs[k] || 0);
        if (gap > gapNeeded) { gapNeeded = gap; caveat = SPEC_CAVEAT[k]; }
      });

      return {
        top, next, wins, counted,
        close: margin < 0.12,
        reasons: reasons.slice(0, 3),
        caveat,
      };
    }

    /* $/hour is the whole thesis of this site, so in the matrix it gets a
       shape rather than being the smallest number on the row. Shorter bar =
       cheaper fun; the best of the picked games is the only one in colour. */
    const ValueBar = ({ v, max, best }) => {
      const pct = Math.max(8, Math.min(100, (v / (max || 1)) * 100));
      const isBest = v <= best + 0.001;
      return (
        <span className="block w-full min-w-[92px]">
          <span className={cx('block text-sm font-semibold tabular-nums', isBest ? 'text-emerald-300' : 'text-zinc-200')}>
            S${v.toFixed(2)}<span className="text-[10px] font-normal text-zinc-500"> /hr</span>
          </span>
          <span className="mt-1 block h-1.5 rounded-full bg-ink-800 overflow-hidden">
            <span className={cx('block h-full rounded-full transition-all duration-500', isBest ? 'bg-emerald-400' : 'bg-zinc-600')}
                  style={{ width: pct + '%' }} />
          </span>
        </span>
      );
    };

    const CompareView = ({ shortlist, setShortlist, onGoBrowse }) => {
      const { games: GAMES } = useGames();
      const { deals } = useDealsCtx();
      const picked = shortlist.map(id => GAMES.find(g => g.id === id)).filter(Boolean);
      const canAddMore = picked.length < MAX_COMPARE;
      // Filtered against the live catalog so a renamed or dropped sample game
      // yields a shorter demo, never an empty column.
      const sampleIds = SAMPLE_COMPARE.filter(id => GAMES.some(g => g.id === id));
      const [copied, setCopied] = useState(false);
      // declared above the "fewer than 2 games" early return — hooks can't
      // live behind a conditional
      const [diffOnly, setDiffOnly] = useState(false);

      // Shareable link that re-opens Compare with this exact shortlist —
      // parseHash() understands the #compare=<ids> format on load.
      const copyShareLink = () => {
        const url = location.origin + location.pathname + '#compare=' + picked.map(g => g.id).join(',');
        copyText(url, () => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
      };

      // Cheapest store listing for a game (live deals data only).
      const minStore = (g) => {
        const priced = gameStores(g, deals).filter(s => typeof s.price === 'number');
        if (!priced.length) return null;
        return priced.reduce((a, b) => (b.price < a.price ? b : a));
      };

      if (picked.length < 2) {
        return (
          <div className="animate-fade-in">
            <SectionTitle eyebrow="Compare" icon={Layers}
              title="Side-by-side game matrix"
              subtitle="Pick 2 or 3 games from the catalog to compare price, rating, hours-to-beat, and co-op support." />
            <Card className="p-8 text-center">
              <div className="text-zinc-400 mb-4">
                {picked.length === 0
                  ? 'Nothing selected yet. Pick two or three games in the catalog and they will show up here.'
                  : 'One game selected. Add one more to start comparing.'}
              </div>
              <div className="flex flex-wrap items-center justify-center gap-2">
                <button onClick={onGoBrowse}
                  className="inline-flex items-center gap-2 bg-ember hover:bg-ember-soft text-white font-semibold rounded-lg px-4 py-2 transition">
                  Browse games <ArrowRight className="w-4 h-4" />
                </button>
                {/* Replaces the old pre-seeded shortlist: same instant demo of
                    what this view does, but the visitor asks for it, so it
                    never sits in their shortlist uninvited. Hidden once they
                    have picks of their own — offering to overwrite them would
                    be the same mistake in a different place. */}
                {picked.length === 0 && sampleIds.length >= 2 && (
                  <button onClick={() => setShortlist(sampleIds)}
                    className="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm ring-1 ring-ink-700 bg-ink-900 text-zinc-300 hover:text-zinc-100 hover:ring-ink-600 transition">
                    <Sparkles className="w-4 h-4" /> See a sample comparison
                  </button>
                )}
              </div>
            </Card>
          </div>
        );
      }

      // `raw` + `tol` exist for the "only differences" filter: raw gives the
      // comparable value behind a cell that renders as JSX, tol is how close
      // two games have to be before the row is noise rather than a difference
      // (a 96% and a 95% rating is not a reason to pick one over the other).
      const dphs = picked.map(dollarsPerHour);
      const maxDph = Math.max(...dphs), bestDph = Math.min(...dphs);

      const specRows = [
        { key: 'rating', label: 'Steam rating', get: (g) => `${g.displayInfo.rating}%`, raw: (g) => g.displayInfo.rating, tol: 2, cmp: (a,b) => a.displayInfo.rating - b.displayInfo.rating, icon: Star },
        { key: 'price', label: 'Price on Steam', get: (g) => <PriceTag g={g} />, raw: (g) => g.price, tol: 0.5, cmp: (a,b) => b.price - a.price, icon: DollarSign }, // lower price wins
        { key: 'stores', label: 'Available on', get: (g) => <StoreBadges game={g} />, raw: (g) => gameStores(g, deals).map(s => s.store).sort().join('/'), icon: Store },
        // Cross-store rows only make sense once live deals data has landed.
        ...(deals ? [
          { key: 'cheapest', label: 'Cheapest store', icon: Tag,
            get: (g) => { const m = minStore(g); return m ? `${m.store} · ${fmtStorePrice(m.price, m.currency, m.approx)}` : '—'; },
            raw: (g) => { const m = minStore(g); return m ? `${m.store} ${m.price.toFixed(2)}` : '—'; },
            cmp: (a, b) => { const pa = minStore(a), pb = minStore(b); return (pb ? pb.price : Infinity) - (pa ? pa.price : Infinity); } }, // lower wins
          { key: 'alltimelow', label: 'All-time low price', icon: Clock,
            raw: (g) => { const d = deals[String(g.appId)]; const low = d && d.historyLow; return low && typeof low.price === 'number' ? low.price : null; },
            get: (g) => {
              const d = deals[String(g.appId)]; const low = d && d.historyLow;
              if (!low || typeof low.price !== 'number') return '—';
              return (
                <span className="inline-flex items-center gap-1.5 flex-wrap">
                  {fmtStorePrice(low.price, low.currency, low.approx)}
                  {low.shop && <span className="text-zinc-500 text-xs">on {low.shop}</span>}
                  {atHistoryLow(deals, g) && <Pill tone="hot">at its low now</Pill>}
                </span>
              );
            } },
        ] : []),
        { key: 'value', label: '$ / hour', get: (g) => <ValueBar v={dollarsPerHour(g)} max={maxDph} best={bestDph} />, raw: (g) => dollarsPerHour(g), tol: 0.05, cmp: (a,b) => dollarsPerHour(b) - dollarsPerHour(a), icon: TrendingUp }, // lower wins
        { key: 'hours', label: 'Hours to beat', get: (g) => `${g.displayInfo.hoursToBeat}h`, raw: (g) => g.displayInfo.hoursToBeat, tol: 2, cmp: (a,b) => a.displayInfo.hoursToBeat - b.displayInfo.hoursToBeat, icon: Clock },
        // No cmp: "newer" is not a win. Leaving it comparable meant the award
        // icons outnumbered the scoreline, and a 2019 classic lost a row to a
        // worse 2024 game for existing later.
        { key: 'year', label: 'Released', get: (g) => g.year, raw: (g) => g.year },
        { key: 'combat', label: 'Combat depth', get: (g) => g.specs.combat, raw: (g) => g.specs.combat, tol: 5, cmp: (a,b) => a.specs.combat - b.specs.combat, icon: Skull },
        { key: 'story', label: 'Story depth', get: (g) => g.specs.story, raw: (g) => g.specs.story, tol: 5, cmp: (a,b) => a.specs.story - b.specs.story, icon: BookOpen },
        { key: 'replay', label: 'Replayability', get: (g) => g.specs.replay, raw: (g) => g.specs.replay, tol: 5, cmp: (a,b) => a.specs.replay - b.specs.replay, icon: Repeat },
        { key: 'players', label: 'Players', get: (g) => g.displayInfo.players, raw: (g) => g.displayInfo.players, icon: Users },
        { key: 'earlyAccess', label: 'Early Access', get: (g) => g.displayInfo.earlyAccess ? 'Yes' : 'No, 1.0 release', raw: (g) => !!g.displayInfo.earlyAccess },
      ];

      const verdict = buildVerdict(picked, specRows, deals);

      // A row is "the same" when every picked game lands inside its tolerance
      // (numbers) or renders the identical value (everything else).
      const isTied = (row) => {
        const vals = picked.map(g => (row.raw ? row.raw(g) : row.get(g)));
        if (vals.every(v => typeof v === 'number')) {
          return Math.max(...vals) - Math.min(...vals) <= (row.tol || 0);
        }
        return vals.every(v => String(v) === String(vals[0]));
      };
      const shownRows = diffOnly ? specRows.filter(r => !isTied(r)) : specRows;
      const hiddenCount = specRows.length - shownRows.length;

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Compare" icon={Layers}
            title="Side-by-side comparison"
            subtitle="The verdict first — the table underneath is the evidence for it." />

          {/* ---- Verdict ----
              Deliberately the loudest thing on the page: the site's promise is
              "verdict first, specs second", and a spec matrix on its own is
              still homework. Reasons are deltas against the runner-up, and the
              caveat names where the runner-up genuinely wins — a verdict you
              can argue with is a verdict worth trusting. */}
          <Card className="relative overflow-hidden mb-5 ring-ember/30">
            <div className="absolute inset-0 bg-gradient-to-r from-ember/15 via-ember/5 to-transparent pointer-events-none" />
            <div className="relative flex flex-col sm:flex-row gap-4 p-4 sm:p-5">
              <div className="w-full sm:w-44 shrink-0 rounded-xl overflow-hidden ring-1 ring-ink-700">
                <GameArt game={verdict.top} />
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-[11px] uppercase tracking-widest text-orange-300/90 flex items-center gap-1.5 mb-1.5">
                  <Sparkles className="w-3.5 h-3.5" />
                  {verdict.close ? "It's close" : 'The verdict'}
                </div>
                <h3 className="font-serif text-2xl md:text-3xl font-medium text-zinc-50 leading-tight">
                  {verdict.close
                    ? <React.Fragment>Either works — {verdict.top.title} edges it.</React.Fragment>
                    : <React.Fragment>Get {verdict.top.title}.</React.Fragment>}
                </h3>
                {verdict.reasons.length > 0 && (
                  <p className="text-sm text-zinc-300 mt-2">
                    Against {verdict.next.title}: {verdict.reasons.join(' · ')}.
                  </p>
                )}
                {verdict.caveat && (
                  <p className="text-sm text-zinc-400 mt-1.5">
                    Pick <span className="text-zinc-200">{verdict.next.title}</span> instead if you want {verdict.caveat}.
                  </p>
                )}
                <div className="mt-3 flex items-center gap-2 flex-wrap">
                  <Pill tone="hot"><Award className="w-3 h-3" /> wins {verdict.wins[verdict.top.id]} of {verdict.counted} rows that matter</Pill>
                  <PriceTag g={verdict.top} size="lg" />
                  {steamStoreUrl(verdict.top) && (
                    <a href={steamStoreUrl(verdict.top)} target="_blank" rel="noopener noreferrer"
                       className="inline-flex items-center gap-1.5 text-xs font-semibold rounded-lg px-3 py-1.5 bg-ember hover:bg-ember-soft text-white transition">
                      Open on Steam <ExternalLink className="w-3.5 h-3.5" />
                    </a>
                  )}
                </div>
              </div>
            </div>
          </Card>

          <div className="flex items-center justify-between gap-2 flex-wrap mb-4">
            {/* Hiding rows the games agree on is the difference between reading
                a table and reading an answer. */}
            <button onClick={() => setDiffOnly(v => !v)}
              aria-pressed={diffOnly}
              className={cx('inline-flex items-center gap-1.5 text-xs rounded-lg px-3 py-1.5 ring-1 transition',
                            diffOnly
                              ? 'bg-accent/15 text-accent-soft ring-accent/40'
                              : 'ring-ink-700 bg-ink-900 text-zinc-300 hover:text-zinc-100 hover:ring-ink-600')}
              title="Hide rows where these games are effectively the same">
              <Zap className="w-3.5 h-3.5" />
              Only show differences
              {diffOnly && hiddenCount > 0 && <span className="text-[10px] text-zinc-400">({hiddenCount} hidden)</span>}
            </button>
            <button onClick={copyShareLink}
              className="inline-flex items-center gap-1.5 text-xs rounded-lg px-3 py-1.5 ring-1 ring-ink-700 bg-ink-900 text-zinc-300 hover:text-zinc-100 hover:ring-ink-600 transition"
              title="Copy a link that opens this comparison">
              {copied
                ? <React.Fragment><Check className="w-3.5 h-3.5 text-teal-300" /> Link copied</React.Fragment>
                : <React.Fragment><ExternalLink className="w-3.5 h-3.5" /> Copy share link</React.Fragment>}
            </button>
          </div>

          {/* Game chips row */}
          <div className={cx('grid gap-3 mb-6', picked.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3')}>
            {picked.map(g => (
              <Card key={g.id} className="relative overflow-hidden">
                <GameArt game={g} />
                {/* Sits over the artwork, so it carries its own scrim rather
                    than relying on whatever happens to be behind it. */}
                <button onClick={() => setShortlist(shortlist.filter(id => id !== g.id))}
                        className="absolute top-2 right-2 p-1 rounded-full bg-ink-950/70 backdrop-blur-sm text-zinc-300 hover:text-rose-400 transition" title="Remove">
                  <X className="w-4 h-4" />
                </button>
                <div className="p-4 pt-3">
                  <div className="min-w-0">
                    <div className="text-xs text-zinc-400 truncate">{g.studio}</div>
                    <div className="text-zinc-100 font-semibold truncate" title={g.title}>{g.title}</div>
                    <div className="text-xs text-zinc-400 flex items-center gap-1.5 mt-0.5">
                      <PriceTag g={g} /> <span className="text-zinc-600">·</span> {g.year}
                    </div>
                    {steamStoreUrl(g) && (
                      <a href={steamStoreUrl(g)} target="_blank" rel="noopener noreferrer"
                         className="mt-1 inline-flex items-center gap-1 text-[10px] text-zinc-500 hover:text-accent-soft transition">
                        View on Steam <ExternalLink className="w-3 h-3" />
                      </a>
                    )}
                  </div>
                  {/* On phones these bars duplicate the spec-matrix rows below and
                      triple the scroll distance, so they're desktop-only. */}
                  <div className="hidden md:block mt-3 space-y-1.5">
                    <StatBar label="Combat" value={g.specs.combat} color={g.accent} sub={g.specs.combat} />
                    <StatBar label="Story" value={g.specs.story} color={g.accent} sub={g.specs.story} />
                    <StatBar label="Co-op" value={g.specs.coop} color={g.accent} sub={g.specs.coop} />
                    <StatBar label="Replay" value={g.specs.replay} color={g.accent} sub={g.specs.replay} />
                  </div>
                </div>
              </Card>
            ))}
            {canAddMore && (
              <Card className="p-4 border-2 border-dashed border-ink-700 flex items-center justify-center text-zinc-500 hover:text-accent-soft hover:border-accent/50 cursor-pointer"
                    onClick={onGoBrowse}>
                <div className="text-center">
                  <Plus className="w-6 h-6 mx-auto mb-1" />
                  <div className="text-sm">Add another game</div>
                </div>
              </Card>
            )}
          </div>

          {/* Spec matrix */}
          <Card className="overflow-hidden">
            <div className="overflow-x-auto">
              {/* Fixed layout so game columns stay equal-width (see Stores table). */}
              <table className="w-full table-fixed min-w-[560px] text-sm">
                <thead className="bg-ink-800/60 text-zinc-400 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="w-40 text-left px-4 py-3 font-medium">Spec</th>
                    {picked.map(g => (
                      <th key={g.id} className="text-left px-4 py-3 font-medium text-zinc-200 align-bottom">
                        <span className="block truncate" title={g.title}>{g.title}</span>
                        {/* the scoreline — the table's own running tally, from
                            the same count the verdict banner quotes */}
                        <span className={cx('mt-1 block text-[10px] normal-case tracking-normal font-semibold tabular-nums',
                                            g.id === verdict.top.id ? 'text-orange-300' : 'text-zinc-500')}>
                          {verdict.wins[g.id]} / {verdict.counted} wins
                        </span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {shownRows.map((row, i) => {
                    let winnerId = null;
                    if (row.cmp) {
                      const sorted = [...picked].sort(row.cmp);
                      const best = sorted[sorted.length - 1];
                      // ties award nobody — same rule the verdict tally uses,
                      // so the award icons always add up to the scoreline
                      if (row.cmp(sorted[sorted.length - 2], best) !== 0) winnerId = best.id;
                    }
                    const I = row.icon;
                    return (
                      <tr key={row.key} className={cx(i % 2 === 0 ? 'bg-ink-850' : 'bg-ink-900/60')}>
                        <td className="px-4 py-3 text-zinc-400 whitespace-nowrap">
                          <span className="inline-flex items-center gap-2">
                            {I && <I className="w-4 h-4 text-zinc-500" />}
                            {row.label}
                          </span>
                        </td>
                        {picked.map(g => (
                          <td key={g.id}
                              className={cx('px-4 py-3 relative', winnerId === g.id &&
                                            'text-emerald-300 font-medium bg-emerald-400/[.06] shadow-[inset_2px_0_0_0_rgba(52,211,153,.5)]')}>
                            <span className="inline-flex items-center gap-2">
                              {row.get(g)}
                              {winnerId === g.id && <Award className="w-3.5 h-3.5" />}
                            </span>
                          </td>
                        ))}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {!shownRows.length && (
                <div className="px-4 py-8 text-center text-sm text-zinc-400">
                  These games are near-identical on every tracked spec — which is
                  itself the answer: buy whichever is cheaper today.
                </div>
              )}
            </div>
          </Card>

          {/* Pros/cons columns */}
          <div className={cx('grid gap-3 mt-6', picked.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3')}>
            {picked.map(g => (
              <Card key={g.id} className="p-4">
                <div className="text-zinc-200 font-semibold mb-3">{g.title}</div>
                <div className="mb-3">
                  <div className="text-xs uppercase tracking-wider text-emerald-400/80 mb-2 flex items-center gap-1"><Check className="w-3 h-3" /> Pros</div>
                  <ul className="space-y-1.5">
                    {g.pros.map((s, i) => <li key={i} className="text-sm text-zinc-300 flex gap-2"><span className="text-emerald-400 mt-0.5">+</span>{s}</li>)}
                  </ul>
                </div>
                <div>
                  <div className="text-xs uppercase tracking-wider text-rose-400/80 mb-2 flex items-center gap-1"><X className="w-3 h-3" /> Cons</div>
                  <ul className="space-y-1.5">
                    {g.cons.map((s, i) => <li key={i} className="text-sm text-zinc-300 flex gap-2"><span className="text-rose-400 mt-0.5">−</span>{s}</li>)}
                  </ul>
                </div>
              </Card>
            ))}
          </div>
        </div>
      );
    };

    /* ---------------- Advisor view ---------------- */
    const PRIORITY_LABELS = { combat: 'Combat depth', story: 'Story / writing', coop: 'Co-op support', replay: 'Replayability' };
    const PRIORITY_ICONS = { combat: Skull, story: BookOpen, coop: Users, replay: Repeat };
    const DEFAULT_PRIORITIES = { combat: 60, story: 60, coop: 60, replay: 60 };

    const AdvisorView = () => {
      const { games: GAMES } = useGames();
      // Sliders survive reloads; merging with the defaults keeps a stored
      // object valid if priority keys are ever added or renamed.
      const [storedPriorities, setPriorities] = usePersistedState('lc-games-priorities', DEFAULT_PRIORITIES);
      const [budget, setBudget] = usePersistedState('lc-games-budget', 50);
      const priorities = { ...DEFAULT_PRIORITIES, ...storedPriorities };

      const results = useMemo(() => {
        const candidates = GAMES
          .filter(g => g.price <= budget)
          .map(g => {
            const { score, contributions } = scoreGame(g, priorities);
            return { game: g, score, contributions, top: topPrioritiesForGame(contributions) };
          })
          .sort((a, b) => b.score - a.score);
        return { candidates };
      }, [GAMES, priorities, budget]);

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Advisor" icon={Sparkles}
            title="What should I buy on sale?"
            subtitle="Set your budget and how much you care about each dimension — the advisor weighs every game in the catalog and ranks what fits." />

          <div className="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
            <Card className="p-5 h-fit">
              <div className="text-sm text-zinc-300 font-medium mb-4">Your priorities</div>
              <div className="space-y-5">
                {Object.keys(priorities).map((k) => {
                  const I = PRIORITY_ICONS[k];
                  return (
                    <div key={k}>
                      <div className="flex items-center justify-between text-xs mb-1.5">
                        <span className="text-zinc-300 inline-flex items-center gap-1.5"><I className="w-3.5 h-3.5 text-accent-soft" /> {PRIORITY_LABELS[k]}</span>
                        <span className="text-zinc-400">{priorities[k]}</span>
                      </div>
                      <input type="range" min="0" max="100" value={priorities[k]}
                        onChange={e => setPriorities(p => ({ ...p, [k]: Number(e.target.value) }))}
                        className="w-full" />
                    </div>
                  );
                })}
              </div>

              <div className="mt-6 pt-5 border-t border-ink-700">
                <div className="flex items-center justify-between text-xs mb-1.5">
                  <span className="text-zinc-300 inline-flex items-center gap-1.5"><DollarSign className="w-3.5 h-3.5 text-accent-soft" /> Budget</span>
                  <span className="text-zinc-400">S${budget}</span>
                </div>
                <input type="range" min="10" max="70" step="5" value={budget}
                  onChange={e => setBudget(Number(e.target.value))} className="w-full" />
              </div>
            </Card>

            <div className="space-y-3">
              {results.candidates.slice(0, 6).map(({ game: g, score, top }, i) => (
                <Card key={g.id} className={cx('p-4', i === 0 && 'ring-2 ring-accent')}>
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
                         style={{ background: `${g.accent}22`, border: `1px solid ${g.accent}66` }}>
                      <Gamepad className="w-4 h-4" style={{ color: g.accent }} />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center gap-2">
                        <span className="text-zinc-100 font-semibold">{g.title}</span>
                        {i === 0 && <Pill tone="accent">Top pick</Pill>}
                      </div>
                      <div className="text-xs text-zinc-400 mt-0.5 flex items-center gap-1.5">{g.genre} <span className="text-zinc-600">·</span> <PriceTag g={g} /> <span className="text-zinc-600">·</span> {g.displayInfo.hoursToBeat}h to beat</div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="text-lg font-bold text-zinc-100">{score.toFixed(1)}</div>
                      <div className="text-[10px] uppercase tracking-wider text-zinc-500">match score</div>
                    </div>
                  </div>
                  <div className="mt-2 text-xs text-zinc-500">
                    Strongest on: {top.map(k => PRIORITY_LABELS[k]).join(', ')}
                  </div>
                </Card>
              ))}
              {results.candidates.length === 0 && (
                <Card className="p-8 text-center text-zinc-400">
                  No games fit under S${budget}. Try raising your budget.
                </Card>
              )}
            </div>
          </div>
        </div>
      );
    };

    /* ---------------- Value view ---------------- */
    /* ---------------- Best value ----------------
       This tab used to open with a hundred bars and then repeat all hundred as
       a table — two hundred rows before the reader could ask it anything, and
       the only control (genre) sat BELOW the chart. A ranked list is the right
       answer to "what's the best value", but only once you've been told what
       the field looks like; leading with all of it is a data dump.

       So it now reads top-down at decreasing altitude: the shape of the field,
       then a way to narrow it, then the leaderboard, then the full ranking.
       Every level drives the same filter state, so the table is always the
       expansion of whatever the bands and search say. */
    const VALUE_TOP_N = 10;

    const ValueView = () => {
      const { games: GAMES } = useGames();
      const [genre, setGenre] = useState('All');
      const [query, setQuery] = useState('');
      const [band, setBand] = useState(null);      // null = all bands
      const [showAllBars, setShowAllBars] = useState(false);
      const genres = bucketOptions(GAMES);

      /* Rank is over the WHOLE catalog, deliberately — "#3 of 100" has to keep
         meaning the same thing after you filter to one genre, or the number is
         just a row counter with extra steps. */
      const ranked = useMemo(() => {
        return GAMES
          .map(g => ({ game: g, perHour: dollarsPerHour(g) }))
          .sort((a, b) => a.perHour - b.perHour)
          .map((r, i) => ({ ...r, rank: i + 1 }));
      }, [GAMES]);

      // Genre + search applied, but NOT the band — the distribution has to
      // describe the set the bands are offering to cut, or the counts lie.
      const scoped = useMemo(() => {
        const q = query.trim().toLowerCase();
        return ranked.filter(r =>
          (genre === 'All' || genreBucket(r.game) === genre) &&
          (q === '' || (r.game.title + ' ' + r.game.studio + ' ' + r.game.genre).toLowerCase().includes(q))
        );
      }, [ranked, genre, query]);

      const bandStats = useMemo(() => VALUE_BANDS.map(b => {
        const inBand = scoped.filter(r => valueBand(r.perHour).id === b.id);
        return { ...b, count: inBand.length, top: inBand.length ? inBand[0].game.title : null };
      }), [scoped]);

      const rows = useMemo(
        () => band ? scoped.filter(r => valueBand(r.perHour).id === band) : scoped,
        [scoped, band]
      );

      const bars = showAllBars ? rows : rows.slice(0, VALUE_TOP_N);
      /* Bar scale is the widest row SHOWN, not the catalog maximum. Scaled
         against the catalog the ten best games are all sub-pixel stubs against
         a 100x longer worst case — the chart spent its whole width saying
         "these are cheap", which the heading already said. */
      const barMax = Math.max(...bars.map(r => r.perHour), 0.05);
      const filtered = genre !== 'All' || query.trim() !== '' || band !== null;
      const clear = () => { setGenre('All'); setQuery(''); setBand(null); setShowAllBars(false); };

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Best value" icon={TrendingUp}
            title="Which games give you the most hours per dollar?"
            subtitle="Price ÷ hours-to-beat, cheapest per hour first. Start from the bands, narrow with search, then open the full ranking." />

          {/* ---- altitude 1: the shape of the field, and the way in ---- */}
          <Card className="p-5 mb-3">
            <div className="flex items-baseline justify-between gap-3 flex-wrap mb-3">
              <div className="text-sm text-zinc-300 font-medium">
                How {scoped.length} game{scoped.length === 1 ? '' : 's'} split by value
              </div>
              <div className="text-xs text-zinc-500">Pick a band to narrow everything below</div>
            </div>
            <div className="flex h-4 rounded-full overflow-hidden bg-ink-800 ring-1 ring-ink-700"
                 role="img" aria-label={bandStats.map(b => `${b.count} ${b.label}`).join(', ')}>
              {bandStats.filter(b => b.count > 0).map(b => (
                <div key={b.id} style={{ width: `${(b.count / scoped.length) * 100}%` }}
                     className={cx('h-full transition-opacity duration-300', b.bar,
                                   band && band !== b.id ? 'opacity-25' : 'opacity-90')} />
              ))}
            </div>

            <div className="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-2">
              {bandStats.map(b => (
                <button key={b.id} type="button" disabled={!b.count}
                        aria-pressed={band === b.id}
                        onClick={() => { setBand(band === b.id ? null : b.id); setShowAllBars(false); }}
                        className={cx('text-left rounded-xl px-3 py-2.5 ring-1 transition',
                                      !b.count ? 'bg-ink-900 ring-ink-800 opacity-40 cursor-not-allowed'
                                      : band === b.id ? cx(b.tint, b.ring)
                                      : 'bg-ink-900 ring-ink-700 hover:ring-ink-600')}>
                  <div className="flex items-baseline gap-1.5">
                    <span className={cx('text-xl font-semibold tabular-nums', b.text)}>{b.count}</span>
                    <span className="text-xs text-zinc-500">game{b.count === 1 ? '' : 's'}</span>
                  </div>
                  <div className="text-xs text-zinc-300 mt-0.5">{b.label}</div>
                  <div className="text-[11px] text-zinc-500 truncate">
                    {b.top ? <>{b.hint} · best: {b.top}</> : b.hint}
                  </div>
                </button>
              ))}
            </div>
          </Card>

          {/* ---- altitude 2: narrow it ---- */}
          <Card className="p-3 mb-6">
            <div className="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-2">
              <div className="relative">
                <Search className="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2" />
                <input value={query} onChange={e => { setQuery(e.target.value); setShowAllBars(false); }}
                  placeholder="Search a game, studio or genre..." aria-label="Search games by title, studio or genre"
                  className="w-full bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-500" />
              </div>
              <Selector value={genre} onChange={v => { setGenre(v); setShowAllBars(false); }} options={genres} label="Genre" />
            </div>
            <div className="mt-3 flex items-center gap-3 flex-wrap text-xs">
              <span className="text-zinc-500">
                {rows.length} of {GAMES.length} shown
                {band && <span className="text-zinc-400"> · {VALUE_BANDS.find(b => b.id === band).label}</span>}
              </span>
              {filtered && (
                <button type="button" onClick={clear}
                        className="text-zinc-400 hover:text-accent-soft transition inline-flex items-center gap-1">
                  <X className="w-3 h-3" /> Clear filters
                </button>
              )}
            </div>
          </Card>

          {/* ---- altitude 3: the leaderboard, capped ---- */}
          {rows.length > 0 && (
            <Card className="p-5 mb-6">
              <div className="flex items-baseline justify-between gap-3 flex-wrap mb-4">
                <div className="text-sm text-zinc-300 font-medium">
                  {showAllBars || rows.length <= VALUE_TOP_N
                    ? 'S$ per hour of playtime (lower = better value)'
                    : `Top ${VALUE_TOP_N} by S$ per hour of playtime`}
                </div>
                {rows.length > VALUE_TOP_N && (
                  <button type="button" onClick={() => setShowAllBars(v => !v)}
                          className="text-xs text-zinc-400 hover:text-accent-soft transition inline-flex items-center gap-1">
                    {showAllBars ? 'Show top 10' : `Show all ${rows.length}`}
                    <ChevronDown className={cx('w-3.5 h-3.5 transition-transform', showAllBars && 'rotate-180')} />
                  </button>
                )}
              </div>
              <div className="space-y-3">
                {bars.map(({ game: g, perHour, rank }) => (
                  <div key={g.id}>
                    <div className="flex items-baseline justify-between gap-3 text-xs mb-1">
                      <span className="text-zinc-300 font-medium truncate">
                        <span className="text-zinc-600 tabular-nums mr-1.5">#{rank}</span>{g.title}
                      </span>
                      <span className={cx('shrink-0 tabular-nums', valueBand(perHour).text)}>S${perHour}/hr</span>
                    </div>
                    <div className="h-2.5 rounded-full bg-ink-800 overflow-hidden">
                      <div className="h-full rounded-full transition-all duration-500"
                           style={{ width: `${Math.max((perHour / barMax) * 100, 3)}%`, background: `linear-gradient(90deg, ${g.accent}80, ${g.accent})` }} />
                    </div>
                  </div>
                ))}
              </div>
              <div className="mt-4 text-xs text-zinc-500 flex items-start gap-2">
                <Info className="w-3.5 h-3.5 shrink-0 mt-0.5" />
                <div>"Hours to beat" is main-content playtime, not 100%-completion — sandbox/live-service games (Terraria, Deep Rock Galactic) will keep paying off well past this number. Bars are scaled against the longest bar shown, so they compare the games in view, not the whole catalogue.</div>
              </div>
            </Card>
          )}

          {/* ---- altitude 4: the full ranking ---- */}
          <Card className="overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-ink-800/60 text-zinc-400 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="text-left px-4 py-3 font-medium">#</th>
                    <th className="text-left px-4 py-3 font-medium">Game</th>
                    <th className="text-left px-4 py-3 font-medium">Price</th>
                    <th className="text-left px-4 py-3 font-medium">Hours to beat</th>
                    <th className="text-left px-4 py-3 font-medium">$ / hour</th>
                    <th className="text-left px-4 py-3 font-medium">Rating</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(({ game: g, perHour, rank }, i) => (
                    <tr key={g.id} className={cx(i % 2 === 0 ? 'bg-ink-850' : 'bg-ink-900/60')}>
                      <td className="px-4 py-3 text-zinc-500 tabular-nums">{rank}</td>
                      <td className="px-4 py-3 text-zinc-200 whitespace-nowrap">{g.title} <span className="text-zinc-500">· {g.year}</span></td>
                      <td className="px-4 py-3 text-zinc-400"><PriceTag g={g} /></td>
                      <td className="px-4 py-3 text-zinc-200">{g.displayInfo.hoursToBeat}h</td>
                      <td className="px-4 py-3">
                        <span className={cx('tabular-nums', valueBand(perHour).text)}>S${perHour}</span>
                      </td>
                      <td className="px-4 py-3 text-zinc-300">{g.displayInfo.rating}%</td>
                    </tr>
                  ))}
                  {rows.length === 0 && (
                    <tr><td colSpan="6" className="px-4 py-8 text-center text-zinc-500">
                      No games match your filters.{' '}
                      <button type="button" onClick={clear} className="text-accent-soft hover:underline">Clear them</button>.
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      );
    };

    /* ---------------- Free Games Alert bar (Steam + Epic) ---------------- */
    // Compact strip under the header; full detail lives in the Free Games tab.
    const FreeGamesBar = ({ onSeeAll }) => {
      const { nowFree, status } = useFreebiesCtx();
      // Expanded on desktop; collapsed on phones where the strip eats too much
      // of the viewport (full detail lives in the Free Games tab anyway).
      const [open, setOpen] = useState(() => window.matchMedia('(min-width: 768px)').matches);

      return (
        <div className="relative border-b border-ink-800 bg-ink-900/40">
          <div className="max-w-7xl mx-auto px-4 md:px-6 py-2">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 shrink-0">
                <Gift className="w-4 h-4 text-accent-soft" />
                <span className="text-xs font-semibold text-zinc-200 uppercase tracking-wider">Free game alerts</span>
                <span className="hidden sm:inline text-[10px] text-zinc-500">Steam &amp; Epic</span>
                {status === 'live' && (
                  <span className="inline-flex items-center gap-1 text-[10px] text-teal-300">
                    <span className="w-1.5 h-1.5 rounded-full bg-teal-400 animate-pulse" />live
                  </span>
                )}
                {status === 'sample' && <span className="text-[10px] text-zinc-500">sample — live feed unreachable</span>}
              </div>
              {!open && nowFree.length > 0 && (
                <span className="text-xs text-zinc-400 truncate">{nowFree.length} free right now</span>
              )}
              <button onClick={onSeeAll}
                      className="ml-auto shrink-0 inline-flex items-center gap-1 text-xs text-accent-soft hover:text-accent transition">
                See all <ArrowRight className="w-3 h-3" />
              </button>
              <button onClick={() => setOpen(o => !o)}
                      className="shrink-0 text-zinc-500 hover:text-zinc-300 transition"
                      aria-label={open ? 'Collapse free games' : 'Expand free games'}>
                <ChevronDown className={cx('w-4 h-4 transition-transform', open && 'rotate-180')} />
              </button>
            </div>

            {open && (
              <div className="mt-2 flex gap-2 overflow-x-auto no-scrollbar pb-1 animate-fade-in">
                {status === 'loading' && (
                  <div className="text-xs text-zinc-500 py-1.5">Checking Steam &amp; Epic for freebies…</div>
                )}
                {nowFree.map(g => (
                  <a key={g.id} href={g.url} target="_blank" rel="noopener noreferrer"
                     className="shrink-0 flex items-center gap-2.5 bg-ink-850 hover:bg-ink-800 ring-1 ring-ink-700 hover:ring-ink-600 rounded-lg pl-2 pr-3 py-1.5 transition group">
                    <span className={cx('text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ring-1', STORE_STYLES[g.store] || STORE_STYLES.Steam)}>{g.store}</span>
                    <span className="min-w-0">
                      <span className="block text-xs font-medium text-zinc-200 group-hover:text-white truncate max-w-[180px]">{g.title}</span>
                      <span className="block text-[10px] text-zinc-500">
                        {g.worth && <s className="mr-1">{g.worth}</s>}
                        <span className="text-teal-300 font-semibold">FREE</span>
                        {endsIn(g.end) && <span> · {endsIn(g.end)}</span>}
                      </span>
                    </span>
                    <ArrowRight className="w-3.5 h-3.5 text-zinc-600 group-hover:text-accent-soft transition" />
                  </a>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    /* ---------------- Free Games view ---------------- */
    const StoreChip = ({ store }) => (
      <span className={cx('text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ring-1', STORE_STYLES[store] || STORE_STYLES.Steam)}>{store}</span>
    );

    const FreeView = () => {
      const { epicCurrent, epicUpcoming, epicStatus, giveaways, status } = useFreebiesCtx();

      // Epic's own feed is authoritative; if it's unreachable (e.g. local
      // dev), fall back to whatever GamerPower flagged as Epic.
      const epicNow = epicStatus === 'live'
        ? epicCurrent
        : giveaways.filter(g => g.store === 'Epic').map(g => ({ id: g.id, title: g.title, url: g.url, image: null, worth: g.worth, end: g.end }));
      const steamNow = giveaways.filter(g => g.store === 'Steam');

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Free games" icon={Gift}
            title="Free right now on Epic & Steam"
            subtitle="Epic gives away 1–2 PC games every Thursday (~11pm Singapore time) — claim them once and they're yours forever, even if you never install them. Steam giveaways are rarer but show up here too." />

          {/* Epic — free now */}
          <div className="mb-8">
            <div className="flex items-center gap-2 mb-3">
              <StoreChip store="Epic" />
              <h3 className="text-lg font-semibold text-zinc-100">Free to claim now</h3>
              {epicStatus === 'live' && (
                <span className="inline-flex items-center gap-1 text-[10px] text-teal-300">
                  <span className="w-1.5 h-1.5 rounded-full bg-teal-400 animate-pulse" />live from Epic
                </span>
              )}
            </div>
            {epicNow.length === 0 ? (
              <Card className="p-6 text-sm text-zinc-400">
                {status === 'loading'
                  ? 'Checking Epic for this week’s drop…'
                  : <span>Couldn{'’'}t reach the Epic feed from here — check the store directly: <a className="text-accent-soft hover:underline" href="https://store.epicgames.com/en-US/free-games" target="_blank" rel="noopener noreferrer">Epic free games page <ExternalLink className="w-3 h-3 inline" /></a></span>}
              </Card>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {epicNow.map(f => (
                  <Card key={f.id} className="overflow-hidden">
                    {f.image && <img src={f.image} alt={f.title} loading="lazy" className="w-full h-36 object-cover" />}
                    <div className="p-4">
                      <div className="text-zinc-100 font-semibold">{f.title}</div>
                      <div className="text-xs text-zinc-500 mt-1">
                        {f.worth && <s className="mr-1.5">{f.worth}</s>}
                        <span className="text-teal-300 font-semibold">FREE</span>
                        {endsIn(f.end) && <span className="text-amber-300"> · {endsIn(f.end)}</span>}
                      </div>
                      <a href={f.url} target="_blank" rel="noopener noreferrer"
                         className="mt-3 inline-flex items-center gap-2 bg-ember hover:bg-ember-soft text-white text-sm font-semibold rounded-lg px-3 py-1.5 transition">
                        Claim on Epic <ExternalLink className="w-3.5 h-3.5" />
                      </a>
                    </div>
                  </Card>
                ))}
              </div>
            )}
          </div>

          {/* Epic — coming next */}
          {epicUpcoming.length > 0 && (
            <div className="mb-8">
              <div className="flex items-center gap-2 mb-3">
                <Calendar className="w-4 h-4 text-accent-soft" />
                <h3 className="text-lg font-semibold text-zinc-100">Coming next on Epic</h3>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {epicUpcoming.map(f => (
                  <Card key={f.id} className="overflow-hidden opacity-90">
                    {f.image && <img src={f.image} alt={f.title} loading="lazy" className="w-full h-36 object-cover" />}
                    <div className="p-4">
                      <div className="text-zinc-100 font-semibold">{f.title}</div>
                      <div className="text-xs text-zinc-500 mt-1">
                        {f.worth && <span className="mr-1.5">{f.worth}</span>}
                        <span className="text-accent-soft font-semibold">free from {fmtDay(f.start)}</span>
                      </div>
                    </div>
                  </Card>
                ))}
              </div>
            </div>
          )}

          {/* Steam giveaways */}
          <div>
            <div className="flex items-center gap-2 mb-3">
              <StoreChip store="Steam" />
              <h3 className="text-lg font-semibold text-zinc-100">Steam giveaways</h3>
              {status === 'sample' && <span className="text-[10px] text-zinc-500">sample — live feed unreachable</span>}
            </div>
            {steamNow.length === 0 ? (
              <Card className="p-6 text-sm text-zinc-400">
                No Steam giveaways running right now — Epic is the reliable weekly source. <a className="text-accent-soft hover:underline" href="https://store.steampowered.com/search/?maxprice=free&specials=1" target="_blank" rel="noopener noreferrer">Check Steam{'’'}s free specials <ExternalLink className="w-3 h-3 inline" /></a>
              </Card>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                {steamNow.map(f => (
                  <Card key={f.id} className="p-4">
                    <div className="text-zinc-100 font-semibold">{f.title}</div>
                    <div className="text-xs text-zinc-500 mt-1">
                      {f.worth && <s className="mr-1.5">{f.worth}</s>}
                      <span className="text-teal-300 font-semibold">FREE</span>
                      {endsIn(f.end) && <span> · {endsIn(f.end)}</span>}
                    </div>
                    <a href={f.url} target="_blank" rel="noopener noreferrer"
                       className="mt-3 inline-flex items-center gap-2 bg-ink-700 hover:bg-ink-600 text-zinc-100 text-sm font-semibold rounded-lg px-3 py-1.5 transition">
                      Claim on Steam <ExternalLink className="w-3.5 h-3.5" />
                    </a>
                  </Card>

          <div className="mt-8 text-xs text-zinc-500 flex items-start gap-2">
            <Info className="w-3.5 h-3.5 shrink-0 mt-0.5" />
            <div>Claimed games stay in your library forever — you don{'’'}t need to install or play them right away. Epic{'’'}s lineup rotates every Thursday around 11pm SGT.</div>
          </div>
        </div>
      );
    };

    /* ---------------- Stores view (Steam vs Epic vs GOG editorial) ---------------- */
    const STORE_MATRIX = [
      { label: 'Free games', win: 'Epic',
        steam: 'Occasional giveaways + free weekends', epic: '1–2 free games every single week', gog: 'Occasional giveaways' },
      { label: 'Refund policy', win: 'GOG',
        steam: '14 days, under 2 hours played', epic: '14 days, under 2 hours played', gog: '30 days, even after downloading' },
      { label: 'DRM', win: 'GOG',
        steam: 'Steamworks DRM on most games', epic: 'Varies per game', gog: '100% DRM-free — the installer is yours' },
      { label: 'User reviews', win: 'Steam',
        steam: 'Full review system with rating %', epic: 'No written reviews — polls + critic scores', gog: 'User reviews with star ratings' },

        steam: 'Steam Workshop — one-click mods', epic: 'Rare, per-game only', gog: 'Manual installation' },

        steam: 'Steam Families — share your library', epic: 'None', gog: 'None' },

        steam: 'Seasonal sales (Summer / Autumn / Winter)', epic: 'Mega Sale + stacking coupons', gog: 'Very frequent themed sales' },
      { label: 'Client features', win: 'Steam',
        steam: 'Remote Play, cloud saves, Steam Deck, controller remapping', epic: 'Lightweight launcher, cloud saves', gog: 'GOG Galaxy can import all your other libraries' },
      { label: 'Achievements', steam: 'Yes', epic: 'Yes', gog: 'Yes, via Galaxy' },
      { label: 'SGD regional pricing', steam: 'Yes', epic: 'Yes', gog: 'Mostly USD with regional discounts' },
    ];

          <Card className="p-4">

            <div className="text-zinc-100 font-semibold mt-2">Buy on Epic if…</div>
            <p className="text-sm text-zinc-400 mt-1.5">it{'’'}s cheaper there with a coupon — and claim the weekly free games either way, even if you never launch them. A free library builds up surprisingly fast.</p>

            <div className="text-zinc-100 font-semibold mt-2">Buy on GOG if…</div>

        <Card className="overflow-hidden">
          <div className="overflow-x-auto">
            {/* Fixed layout: the three store columns split the width equally
                instead of auto-sizing to whoever has the longest sentence. */}
            <table className="w-full table-fixed min-w-[640px] text-sm">
              <thead className="bg-ink-800/60 text-zinc-400 text-xs uppercase tracking-wider">
                <tr>
                  <th className="w-40 text-left px-4 py-3 font-medium">What you get</th>
                  <th className="text-left px-4 py-3 font-medium text-sky-300">Steam</th>
                  <th className="text-left px-4 py-3 font-medium text-zinc-200">Epic</th>
