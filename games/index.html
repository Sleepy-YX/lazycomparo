    // effect; the 6s timer is a safety net so a failed CDN script never
    // leaves the page stuck on the splash — worst case the SEO content shows.
    window.__reveal = function () {
      document.documentElement.classList.add('app-ready');
      // Remove the node after the fade — background tabs freeze CSS
      // transitions, so don't rely on opacity alone to clear the overlay.
      setTimeout(function () {
        var s = document.getElementById('boot-splash');
        if (s) s.remove();
      }, 400);
    };
    setTimeout(window.__reveal, 6000);

    /* ---------------- Genre buckets ----------------
       `genre` on each game stays specific ("Roguelike Deckbuilder", "Metroidvania")
       because that's the useful label to READ on a card. But filtering by it was
       useless: 100 games spread over 50-odd genres left most of them holding a
       single game, so picking one emptied the grid. The filter therefore works on
       these ~9 buckets while the card still shows the specific genre.

       Every genre string in GAMES must appear here — anything unmapped falls into
       'Other', which is only offered as a filter option if something lands in it. */
    const GENRE_BUCKETS = {
      'Action RPG': 'RPG', 'Open-World RPG': 'RPG', 'Soulslike': 'RPG',
      'Soulslike RPG': 'RPG', 'Turn-based RPG': 'RPG', 'CRPG': 'RPG',
      'Co-op Action RPG': 'RPG',

      'Roguelike': 'Roguelike', 'Roguelike Deckbuilder': 'Roguelike',
      'Roguevania': 'Roguelike', 'Survivors-like': 'Roguelike',
      'Co-op Roguelike': 'Roguelike',

      'Co-op Shooter': 'Shooter', 'Soulslike Co-op Shooter': 'Shooter',
      'Co-op Extraction Shooter': 'Shooter', 'FPS': 'Shooter',
      'Mech Action': 'Shooter',

      'Survival Crafting': 'Survival', 'Sandbox Survival': 'Survival',
      'Survival Driving': 'Survival', 'Survival Vampire': 'Survival',
      'Survival Extraction': 'Survival', 'Zombie Survival': 'Survival',
      'Co-op Survival': 'Survival',

      'City Builder': 'Builders & Sims', 'City Survival': 'Builders & Sims',
      'Factory Building': 'Builders & Sims', 'Colony Sim': 'Builders & Sims',
      'Farming Sim': 'Builders & Sims', 'Business Sim': 'Builders & Sims',

      '4X Strategy': 'Strategy', 'Grand Strategy': 'Strategy', 'RTS': 'Strategy',
      'Turn-based Tactics': 'Strategy',

      'Adventure': 'Adventure', 'Co-op Adventure': 'Adventure',
      'Open-World Action': 'Adventure', 'Metroidvania': 'Adventure',
      'Mystery Adventure': 'Adventure', 'Puzzle': 'Adventure',
      'Co-op Puzzle': 'Adventure', 'Action Adventure': 'Adventure',

      // Fighting, racing and arcade-action genres arrived with the 60 -> 100
      // batch. They share one bucket instead of getting one each: 'Racing' on
      // its own would hold two games, which is exactly the near-empty-filter
      // problem these buckets exist to avoid. 'Precision Platformer' moved
      // here from Adventure for the same reason — Adventure was the largest
      // bucket by a wide margin.
      'Fighting': 'Action & Arcade', 'Beat-em-up': 'Action & Arcade',
      'Racing': 'Action & Arcade', 'Driving Sim': 'Action & Arcade',
      'Run and Gun': 'Action & Arcade', 'Precision Platformer': 'Action & Arcade',

      'Co-op Horror': 'Horror', 'Survival Horror': 'Horror',
    };

    // Display order for the filter dropdown; 'Other' is appended only if used.
    const BUCKET_ORDER = ['RPG', 'Roguelike', 'Shooter', 'Survival',
                          'Builders & Sims', 'Strategy', 'Adventure',
                          'Action & Arcade', 'Horror'];

    const genreBucket = (game) => GENRE_BUCKETS[game.genre] || 'Other';

    // Buckets actually represented in the catalog, in display order.
    function bucketOptions(games) {
      const present = new Set(games.map(genreBucket));
      const ordered = BUCKET_ORDER.filter(b => present.has(b));
      if (present.has('Other')) ordered.push('Other');
      return ['All', ...ordered];
    }

    /* ---------------- Store availability (editorial fallback) ---------------- */

    // Store list for a game: live deals data (with prices/links) when we have
    // it, otherwise Steam + the editorial extras above (names only). The Steam
    // entry prefers the exact SGD price from our own Steam feed over ITAD's
    // FX-converted approximation whenever the live feed has landed.
    function gameStores(game, deals) {
      const d = deals && game.appId && deals[String(game.appId)];
      if (d && d.stores && d.stores.length) {
        return d.stores.map(s =>
          s.store === 'Steam' && game.live && typeof game.price === 'number'
            ? { ...s, price: game.price, currency: 'SGD', approx: false, url: s.url || steamStoreUrl(game) }
            : s);
      }
      return ['Steam', ...(EXTRA_STORES[game.id] || [])].map(s => ({ store: s }));
    }

    // Is the game's cheapest CURRENT store price at (or below) its all-time
    // low? Compared strictly within ITAD data (/api/deals now converts
    // everything to SGD server-side, but if the FX step ever fails prices can
    // arrive in mixed currencies — so only stores sharing the low's currency
    // count, and the Steam feed's game.price stays out of this comparison).
    function atHistoryLow(deals, game) {
      const d = deals && game.appId && deals[String(game.appId)];
      const low = d && d.historyLow;
      if (!d || !low || typeof low.price !== 'number') return false;
      const priced = (d.stores || []).filter(s =>
        typeof s.price === 'number' && (!low.currency || !s.currency || s.currency === low.currency));
      if (!priced.length) return false;
      const cheapest = priced.reduce((a, b) => (b.price < a.price ? b : a));
      return cheapest.price <= low.price + 0.01;
    }

    /* ---------------- Scoring Algorithm ---------------- */
    /*
     * scoreGame(game, priorities)
     *   priorities = { combat, story, coop, replay } each 0-100.
     *   Returns a single weighted score 0-100 plus per-dimension contributions,
     *   so the Advisor can explain *why* a game ranked where it did.
     */
    function scoreGame(game, priorities) {
      const keys = ['combat', 'story', 'coop', 'replay'];
      const totalWeight = keys.reduce((s, k) => s + priorities[k], 0);
      if (totalWeight === 0) return { score: 0, contributions: {} };

      let score = 0;
      const contributions = {};
      keys.forEach((k) => {
        const c = (priorities[k] * game.specs[k]) / totalWeight;
        contributions[k] = c;
        score += c;
      });

      return { score: Math.round(score * 10) / 10, contributions };
    }

    function topPrioritiesForGame(contributions) {
      return Object.entries(contributions)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 2)
        .map(([k]) => k);
    }

    /* ---------------- Value math ---------------- */
    function dollarsPerHour(game) {
      return Math.round((game.price / game.displayInfo.hoursToBeat) * 100) / 100;
    }

    /* ---------------- Deal heat ----------------
       One semantic scale for "how good is this price, right now", used by every
       surface that shows a price — cards, compare table, value tab — and mirrored
       on the landing page's ticker, so a hot badge means the same thing on both
       sites instead of every discount looking identical.

       An all-time low outranks the raw percentage on purpose: 20% off a game
       that has never been cheaper is a better moment to buy than a routine 50%
       sale that comes round every quarter.

       The class strings are spelled out in full because the Tailwind Play CDN
       generates rules by scanning the document for literal class names —
       anything assembled by string concatenation would never get a rule. */
    const HEAT_ORDER = ['none', 'mild', 'warm', 'hot'];
    const HEAT = {
      hot: {
        badge: 'bg-ember/25 text-orange-200 ring-ember/60',
        text: 'text-orange-200',
        ring: 'ring-ember/50',
        dot: 'bg-ember',
        glow: 'shadow-[0_0_16px_-3px_rgba(217,72,43,.85)]',
      },
      warm: {
        badge: 'bg-amber-500/20 text-amber-200 ring-amber-500/40',
        text: 'text-amber-200', ring: 'ring-amber-500/30', dot: 'bg-amber-400', glow: '',
      },
      mild: {
        badge: 'bg-emerald-500/20 text-emerald-300 ring-emerald-500/30',
        text: 'text-emerald-300', ring: 'ring-emerald-500/25', dot: 'bg-emerald-400', glow: '',
      },
      none: {
        badge: 'bg-ink-700 text-zinc-300 ring-ink-600',
        text: 'text-zinc-300', ring: 'ring-ink-700', dot: 'bg-zinc-500', glow: '',
      },
    };

    function dealHeat(game, deals) {
      if (game.isFree || game.price === 0) return 'hot';
      if (atHistoryLow(deals, game)) return 'hot';
      const d = game.discount || 0;
      if (d >= 60) return 'hot';
      if (d >= 30) return 'warm';
      if (d > 0) return 'mild';
      return 'none';
    }

    /* ---------------- Live Steam data ---------------- */
    // Pulls real SGD prices (incl. current sale) + review scores from our own
    // /api/steam Pages Function, which proxies Steam server-side. Ids are sent in
    // chunks of 15 so each function call stays under Cloudflare's 50-subrequest
    // cap (2 subrequests per game). Falls back silently to the static data above
    // when the endpoint is unreachable — e.g. local dev, which has no Functions.
    const STEAM_ENDPOINT = '/api/steam';
    const STEAM_CHUNK = 15;

    function steamStoreUrl(game) {
      return game.appId ? `https://store.steampowered.com/app/${game.appId}/` : null;
    }

    // Official Steam store artwork, served free from Valve's CDN and keyed only
    // off the AppID we already store. 'header' is the 460x215 banner used on the
    // cards; 'capsule' is the 231x87 version for tighter rows.
    const STEAM_ART_BASE = 'https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps';
    function steamArtUrl(game, kind = 'header') {
      if (!game.appId) return null;
      const file = kind === 'capsule' ? 'capsule_231x87.jpg' : 'header.jpg';
      return `${STEAM_ART_BASE}/${game.appId}/${file}`;
    }

    function useSteamLive(baseGames) {
      const [live, setLive] = useState(null);            // { [appId]: liveData }
      const [status, setStatus] = useState('loading');   // loading | live | offline
      const [updatedAt, setUpdatedAt] = useState(null);

      useEffect(() => {
        let cancelled = false;
        const ids = baseGames.map(g => g.appId).filter(Boolean).map(String);
        const chunks = [];
        for (let i = 0; i < ids.length; i += STEAM_CHUNK) chunks.push(ids.slice(i, i + STEAM_CHUNK));

        (async () => {
          try {
            const parts = await Promise.all(chunks.map(async (c) => {
              const res = await fetch(`${STEAM_ENDPOINT}?ids=${c.join(',')}`);
              if (!res.ok) throw new Error('bad status ' + res.status);
              return res.json();
            }));
            if (cancelled) return;
            const map = {};
            let stamp = null;
            parts.forEach(p => { Object.assign(map, (p && p.games) || {}); stamp = (p && p.updated) || stamp; });
            if (Object.keys(map).length === 0) throw new Error('empty');
            setLive(map);
            setUpdatedAt(stamp);
            setStatus('live');
          } catch (e) {
            if (!cancelled) setStatus('offline');
          }
        })();

        return () => { cancelled = true; };
      }, []);

      const games = useMemo(() => {
        if (!live) return baseGames;
        return baseGames.map(g => {
          const d = g.appId && live[String(g.appId)];
          if (!d || d.error) return g;
          const merged = { ...g, displayInfo: { ...g.displayInfo } };
          if (d.isFree) { merged.price = 0; merged.isFree = true; }
          else if (typeof d.price === 'number') merged.price = d.price;
          if (typeof d.initial === 'number') merged.initialPrice = d.initial;
          if (typeof d.discount === 'number') merged.discount = d.discount;
          if (d.priceFormatted) merged.priceFormatted = d.priceFormatted;
          if (typeof d.ratingPct === 'number') merged.displayInfo.rating = d.ratingPct;
          if (d.ratingDesc) merged.displayInfo.ratingDesc = d.ratingDesc;
          if (typeof d.totalReviews === 'number') merged.displayInfo.totalReviews = d.totalReviews;
          merged.live = true;
          return merged;
        });
      }, [live, baseGames]);

      return { games, status, updatedAt };
    }

    const GamesContext = React.createContext({ games: GAMES, status: 'loading', updatedAt: null });
    const useGames = () => React.useContext(GamesContext);

    // Human-readable "how long ago" for the live-price timestamp.
    function timeAgo(iso) {
      if (!iso) return null;
      const diff = Date.now() - new Date(iso).getTime();
      if (diff < 0) return 'just now';
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      return `${h}h ago`;
    }

    /* ---------------- Persistence helpers ---------------- */
    // localStorage-backed useState. Storage can be unavailable (private mode,
    // blocked cookies) — every touch is wrapped, degrading to plain state.
    function usePersistedState(key, initial) {
      const [value, setValue] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          if (raw !== null) return JSON.parse(raw);
        } catch (e) {}
        return typeof initial === 'function' ? initial() : initial;
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }, [key, value]);
      return [value, setValue];
    }

    // Clipboard copy with a hidden-textarea fallback for browsers/contexts
    // where navigator.clipboard is unavailable.
    function copyText(text, done) {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else fallback();
    }

    /* ---------------- Live cross-store deals (IsThereAnyDeal) ---------------- */
    // Steam vs Epic vs GOG prices + all-time historical lows via our
    // /api/deals Pages Function (an ITAD proxy — needs ITAD_API_KEY set on the
    // Cloudflare Pages project). One request covers the whole catalog; the
    // function batches server-side. When unreachable or keyless the UI falls
    // back to Steam-only pricing + the editorial EXTRA_STORES lists.
    const DEALS_ENDPOINT = '/api/deals';
    // Must stay <= MAX_IDS in functions/api/deals.js, which silently truncates
    // anything beyond it — an over-long request drops games with no error.
    const DEALS_CHUNK = 30;

    function useDeals(baseGames) {
      const [deals, setDeals] = useState(null); // { [appId]: { stores:[...], historyLow } }
      const [status, setStatus] = useState('loading'); // loading | live | offline

      useEffect(() => {
        let cancelled = false;
        const ids = baseGames.map(g => g.appId).filter(Boolean).map(String);
        const chunks = [];
        for (let i = 0; i < ids.length; i += DEALS_CHUNK) chunks.push(ids.slice(i, i + DEALS_CHUNK));

        (async () => {
          try {
            // Chunks are independent: one failing (ITAD hiccup, cold cache
            // timeout) shouldn't throw away the games the others resolved.
            const parts = await Promise.all(chunks.map(async (c) => {
              try {
                const res = await fetch(`${DEALS_ENDPOINT}?ids=${c.join(',')}`);
                if (!res.ok) throw new Error('bad status ' + res.status);
                const data = await res.json();
                return (data && data.games) || {};
              } catch (e) {
                return {};
              }
            }));
            if (cancelled) return;
            const games = Object.assign({}, ...parts);
            if (Object.keys(games).length === 0) throw new Error('empty');
            setDeals(games);
            setStatus('live');
          } catch (e) {
            if (!cancelled) setStatus('offline');
          }
        })();
        return () => { cancelled = true; };
      }, []);

      return { deals, status };
    }

    const DealsContext = React.createContext({ deals: null, status: 'loading' });
    const useDealsCtx = () => React.useContext(DealsContext);

    /* ---------------- Free games (Epic official feed + GamerPower) ---------------- */
    // Two live sources: /api/epic-free (Epic's own promo feed via our proxy —
    // exact end dates, next week's drops, artwork) and the GamerPower API for
    // Steam giveaways. GamerPower retries through a CORS proxy, then falls
    // back to a static sample so the alert bar never breaks.
    const EPICFREE_ENDPOINT = '/api/epic-free';
    const FREEGAMES_API = 'https://www.gamerpower.com/api/filter?platform=epic-games-store.steam&type=game&sort-by=date';
    const FALLBACK_FREEBIES = [
      { id: 'f1', store: 'Epic',  title: 'Ghostwire: Tokyo',           worth: 'US$59.99', end: null, url: 'https://store.epicgames.com/en-US/free-games' },
      { id: 'f2', store: 'Epic',  title: 'Escape Academy',             worth: 'US$19.99', end: null, url: 'https://store.epicgames.com/en-US/free-games' },
      { id: 'f3', store: 'Steam', title: 'Warhammer 40,000: Gladius',  worth: 'US$39.99', end: null, url: 'https://store.steampowered.com/search/?maxprice=free&specials=1' },
      { id: 'f4', store: 'Steam', title: 'Killing Floor 2',            worth: 'US$29.99', end: null, url: 'https://store.steampowered.com/search/?maxprice=free&specials=1' },
    ];

    // Title normalizer for matching freebies against the catalog / dedupe.
    const normTitle = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

    function useFreebies() {
      const [epic, setEpic] = useState({ current: [], upcoming: [], status: 'loading' });
      const [gw, setGw] = useState({ items: [], status: 'loading' });

      useEffect(() => {
        let cancelled = false;

        // 1) Epic's own feed via our Pages Function
        (async () => {
          try {
            const res = await fetch(EPICFREE_ENDPOINT);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const current = (data && data.current) || [];
            const upcoming = (data && data.upcoming) || [];
            if (current.length + upcoming.length === 0) throw new Error();
            if (!cancelled) setEpic({ current, upcoming, status: 'live' });
          } catch (e) {
            if (!cancelled) setEpic(s => ({ ...s, status: 'offline' }));
          }
        })();

        // 2) GamerPower giveaways (Steam + Epic)
        const clean = (t) => t.replace(/\s*\((Epic Games|Steam)[^)]*\)/i, '').replace(/\s*Giveaway!?$/i, '').trim();
        const parse = (data) => (Array.isArray(data) ? data : [])
          .filter(g => g.status === 'Active')
          .slice(0, 8)
          .map(g => ({
            id: g.id,
            title: clean(g.title || ''),
            worth: g.worth && g.worth !== 'N/A' ? g.worth : null,
            end: g.end_date && g.end_date !== 'N/A' ? g.end_date : null,
            url: g.open_giveaway_url,
            store: /epic/i.test(g.platforms || '') ? 'Epic' : 'Steam',
          }));
        (async () => {
          const apply = (items) => {
            if (!cancelled && items.length) { setGw({ items, status: 'live' }); return true; }
            return false;
          };
          try {
            const res = await fetch(FREEGAMES_API);
            if (!res.ok || !apply(parse(await res.json()))) throw new Error();
          } catch {
            try {
              const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(FREEGAMES_API));
              if (!res.ok || !apply(parse(await res.json()))) throw new Error();
            } catch {
              if (!cancelled) setGw({ items: FALLBACK_FREEBIES, status: 'sample' });
            }
          }
        })();

        return () => { cancelled = true; };
      }, []);

      // Merged "free right now" list for the alert bar: Epic's official feed
      // is the source of truth for Epic when live; GamerPower fills in Steam.
      const nowFree = useMemo(() => {
        const items = epic.current.map(f => ({ id: 'epic-' + f.id, store: 'Epic', title: f.title, worth: f.worth, end: f.end, url: f.url }));
        gw.items.forEach(g => {
          if (epic.status === 'live' && g.store === 'Epic') return;
          if (items.some(i => normTitle(i.title) === normTitle(g.title))) return;
          items.push(g);
        });
        return items.slice(0, 8);
      }, [epic, gw]);

      const status = (epic.status === 'live' || gw.status === 'live') ? 'live'
        : (epic.status === 'loading' || gw.status === 'loading') ? 'loading' : 'sample';

      return { epicCurrent: epic.current, epicUpcoming: epic.upcoming, epicStatus: epic.status, giveaways: gw.items, nowFree, status };
    }

    const FreebiesContext = React.createContext({ epicCurrent: [], epicUpcoming: [], epicStatus: 'loading', giveaways: [], nowFree: [], status: 'loading' });
    const useFreebiesCtx = () => React.useContext(FreebiesContext);

    // "ends in 2d" countdown; accepts ISO or GamerPower's "YYYY-MM-DD HH:mm:ss".
    function endsIn(end) {
      if (!end) return null;
      const diff = new Date(String(end).replace(' ', 'T')) - Date.now();
      if (diff <= 0) return null;
      const d = Math.floor(diff / 86400000);
      if (d >= 1) return `ends in ${d}d`;
      const h = Math.floor(diff / 3600000);
      return h >= 1 ? `ends in ${h}h` : 'ending soon';
    }

    // "16 Jul" — short date for upcoming freebies.
    function fmtDay(iso) {
      if (!iso) return null;
      try { return new Date(iso).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }); }
      catch (e) { return null; }
    }

    /* ---------------- Small UI primitives ---------------- */
    const cx = (...xs) => xs.filter(Boolean).join(' ');

    const StatBar = ({ value, max = 100, color = '#22d3ee', label, sub, showValue = true }) => {
      const pct = Math.max(0, Math.min(100, (value / max) * 100));
      return (
        <div>
          <div className="flex items-baseline justify-between text-xs mb-1">
            <span className="text-zinc-400">{label}</span>
            {showValue && <span className="text-zinc-200 font-medium">{sub ?? value}</span>}
          </div>
          <div className="h-2 rounded-full bg-ink-800 overflow-hidden">
            <div className="h-full rounded-full transition-all duration-500"
                 style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${color}80, ${color})` }} />
          </div>
        </div>
      );
    };

    const Pill = ({ children, tone = 'default' }) => {
      const tones = {
        default: 'bg-ink-700 text-zinc-300 ring-ink-600',
        good:    'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        meh:     'bg-amber-500/15 text-amber-300 ring-amber-500/30',
        bad:     'bg-rose-500/15 text-rose-300 ring-rose-500/30',
        accent:  'bg-accent/15 text-accent-soft ring-accent/40',
        hot:     'bg-ember/20 text-orange-200 ring-ember/50',   // deal heat — see HEAT
      };
      return <span className={cx('inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ring-1', tones[tone])}>{children}</span>;
    };

    // Formats a price string from either live data (priceFormatted, e.g. "S$44.90")
    // or the static fallback integer. Whole numbers stay clean (S$14, not S$14.00).
    const fmtPrice = (n) => `S$${Number.isInteger(n) ? n : n.toFixed(2)}`;
    const priceLabel = (g) => (g.isFree || g.price === 0) ? 'Free' : (g.priceFormatted || fmtPrice(g.price));

    // Price with an on-sale treatment: -X% badge + struck original when discounted.
    // The badge is coloured by deal heat, so the size of the cut is readable
    // before the number is — and an all-time low gets its own marker, because
    // that is the one signal worth interrupting someone for.
    const PriceTag = ({ g, size = 'sm' }) => {
      const { deals } = useDealsCtx();
      if (g.isFree || g.price === 0)
        return <span className="text-xs font-semibold text-teal-300">Free</span>;
      const onSale = g.discount > 0 && g.initialPrice;
      const atLow = atHistoryLow(deals, g);
      const main = size === 'lg' ? 'text-sm font-semibold text-zinc-100' : 'text-xs font-semibold text-zinc-100';
      if (!onSale && !atLow) return <span className={cx(size === 'lg' ? 'text-sm' : 'text-xs', 'text-zinc-300')}>{priceLabel(g)}</span>;
      const h = HEAT[dealHeat(g, deals)];
      return (
        <span className="inline-flex items-center gap-1.5 whitespace-nowrap">
          {onSale && (
            <span className={cx('text-[10px] font-bold px-1 py-0.5 rounded ring-1 tabular-nums', h.badge, h.glow)}>-{g.discount}%</span>
          )}
          {atLow && (
            <span className="text-[9px] font-bold uppercase tracking-wider px-1 py-0.5 rounded ring-1 bg-ember/25 text-orange-200 ring-ember/60"
                  title="Cheapest this game has ever been, across tracked stores">Low</span>
          )}
          {onSale && <s className="text-[11px] text-zinc-500">{fmtPrice(g.initialPrice)}</s>}
          <span className={main}>{priceLabel(g)}</span>
        </span>
      );
    };

    /* ---------------- Store badges (Steam / Epic / GOG) ---------------- */
    const STORE_STYLES = {
      Steam: 'bg-sky-500/15 text-sky-300 ring-sky-500/30',
      Epic:  'bg-zinc-100/10 text-zinc-200 ring-zinc-400/30',
      GOG:   'bg-purple-500/15 text-purple-300 ring-purple-500/30',
    };

    // /api/deals converts ITAD's prices (USD for several SG stores) to SGD
    // server-side, flagging converted amounts `approx` — shown with a "~".
    // If the FX step fails upstream, prices arrive in their original currency
    // and are labeled honestly instead of being passed off as SGD.
    const CURRENCY_PREFIX = { SGD: 'S$', USD: 'US$', EUR: '€', GBP: '£' };
    const fmtStorePrice = (p, currency, approx) => {
      if (p === 0) return 'Free';
      const tilde = approx ? '~' : '';
      const pre = CURRENCY_PREFIX[currency];
      if (pre) return `${tilde}${pre}${p.toFixed(2)}`;
      return currency ? `${tilde}${currency} ${p.toFixed(2)}` : `${tilde}S$${p.toFixed(2)}`;
    };

    // Which stores sell this game. With live /api/deals data each badge shows
    // that store's current price and links to it; the cheapest store gets an
    // emerald ring. Without live data, plain availability badges.
    const StoreBadges = ({ game }) => {
      const { deals } = useDealsCtx();
      const stores = gameStores(game, deals);
      const priced = stores.filter(s => typeof s.price === 'number');
      const cheapest = priced.length > 1 ? priced.reduce((a, b) => (b.price < a.price ? b : a)).store : null;
      return (
        <span className="inline-flex items-center gap-1 flex-wrap">
          {stores.map(s => {
            const inner = (
              <span className={cx('inline-flex items-center gap-1 text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ring-1 whitespace-nowrap',
                                  STORE_STYLES[s.store] || STORE_STYLES.Steam,
                                  cheapest === s.store && 'ring-emerald-400/70')}
                    title={cheapest === s.store ? `Cheapest right now on ${s.store}` : `Available on ${s.store}`}>
                {s.store}
                {typeof s.price === 'number' && <span className="normal-case font-semibold text-zinc-100">{fmtStorePrice(s.price, s.currency, s.approx)}</span>}
              </span>
            );
            return s.url
              ? <a key={s.store} href={s.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="hover:opacity-80 transition">{inner}</a>
              : <span key={s.store}>{inner}</span>;
          })}
        </span>
      );
    };

    const Card = ({ className = '', children, onClick }) => (
      <div onClick={onClick}
           className={cx('bg-ink-850 ring-1 ring-ink-700 rounded-2xl', onClick && 'cursor-pointer hover:ring-accent/50 transition tilt-card', className)}>
        {children}
      </div>
    );

    /* ---------------- Game artwork ----------------
       Steam's own header banner, lazy-loaded (a full Browse grid is 60 images,
       so they must not all fetch up front). Any game without an AppID — or whose
       art 404s / is blocked — falls back to the accent-tinted gamepad tile the
       cards used before, so a missing image never leaves a blank hole.
       The image is decorative: the title is right below it as real text, and
       alt text here would just make screen readers read every card twice. */
    const GameArt = ({ game, selected, className = '' }) => {
      const [failed, setFailed] = useState(false);
      const src = steamArtUrl(game);
      return (
        <div className={cx('relative aspect-[460/215] overflow-hidden bg-ink-900', className)}>
          {src && !failed ? (
            <img src={src} alt="" aria-hidden="true" loading="lazy" decoding="async"
                 onError={() => setFailed(true)}
                 className="w-full h-full object-cover" />
          ) : (
            <div className="w-full h-full flex items-center justify-center"
                 style={{ background: `linear-gradient(135deg, ${game.accent}33, ${game.accent}0d)` }}>
              <Gamepad className="w-8 h-8" style={{ color: game.accent }} />
            </div>
          )}
          {/* Feather the art into the card body so the studio line never sits
              against a hard horizontal edge. */}
          <div className="absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-ink-850 to-transparent pointer-events-none" />
          {selected && (
            <div className="absolute top-2 right-2 w-6 h-6 rounded-full bg-accent flex items-center justify-center shadow-lg shadow-black/50 tilt-float">
              <Check className="w-3.5 h-3.5 text-ink-950" />
            </div>
          )}
        </div>
      );
    };

    const SectionTitle = ({ eyebrow, title, subtitle, icon: I }) => (
      <div className="mb-6">
        {eyebrow && <div className="text-[11px] uppercase tracking-widest text-accent-soft/80 mb-2 flex items-center gap-2">
          {I && <I className="w-3.5 h-3.5" />}{eyebrow}
        </div>}
        <h2 className="font-serif text-2xl md:text-4xl font-medium text-zinc-50">{title}</h2>
        {subtitle && <p className="hidden sm:block text-zinc-400 mt-1 max-w-2xl">{subtitle}</p>}
      </div>
    );

    const Selector = ({ value, onChange, options, labels, label }) => (
      <div className="relative">
        <label className="absolute -top-2 left-2 px-1 text-[10px] uppercase tracking-wider text-zinc-500 bg-ink-850">{label}</label>
        <select value={value} onChange={e=>onChange(e.target.value)}
                className="bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-3 pr-8 py-2 text-sm text-zinc-100 appearance-none">
          {options.map(o => <option key={o} value={o}>{labels?.[o] ?? o}</option>)}
        </select>
        <ChevronDown className="w-4 h-4 text-zinc-500 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
      </div>
    );

    /* ---------------- Game card (used in Browse + Compare picker) ---------------- */
    const GameCard = ({ game, selected, onClick, showPrice = true }) => {
      const { deals } = useDealsCtx();
      const { epicCurrent, giveaways } = useFreebiesCtx();
      const d = deals && game.appId && deals[String(game.appId)];
      const low = d && d.historyLow;
      // Cheapest current store price matches the best price ever recorded.
      const atLow = atHistoryLow(deals, game);
      const freeOnEpic =
        epicCurrent.some(f => normTitle(f.title) === normTitle(game.title)) ||
        giveaways.some(f => f.store === 'Epic' && normTitle(f.title) === normTitle(game.title));
      // Deal heat also warms the card edge — scanning a 60-card grid, the
      // hot ones should be findable without reading a single price.
      const heat = dealHeat(game, deals);
      return (
      <Card className={cx('relative animate-fade-in overflow-hidden',
                          selected ? 'ring-2 ring-accent'
                                   : heat === 'hot' ? cx('ring-1', HEAT.hot.ring, HEAT.hot.glow)
                                   : heat === 'warm' ? cx('ring-1', HEAT.warm.ring) : null)}
            onClick={onClick}>
        <GameArt game={game} selected={selected} />
        <div className="p-4 pt-3">
          <div className="min-w-0">
            <div className="text-xs text-zinc-400 truncate">{game.studio}</div>
            <div className="text-zinc-100 font-semibold truncate" title={game.title}>{game.title}</div>
            <div className="flex items-center gap-2 mt-1">
              <Pill>{game.genre}</Pill>
              {showPrice && <PriceTag g={game} />}
            </div>
          </div>
          <div className="mt-3 space-y-1">
            <StatBar label={game.displayInfo.ratingDesc ? `Steam · ${game.displayInfo.ratingDesc}` : 'Steam rating'}
                     value={game.displayInfo.rating} sub={`${game.displayInfo.rating}%`} color={game.accent} />
          </div>
          <div className="mt-2.5 flex items-center gap-1.5 flex-wrap">
            <StoreBadges game={game} />
            {freeOnEpic && <Pill tone="good"><Gift className="w-3 h-3" /> FREE on Epic now</Pill>}
            {atLow && <Pill tone="hot"><Tag className="w-3 h-3" /> lowest price ever</Pill>}
          </div>
          {steamStoreUrl(game) && (
            <a href={steamStoreUrl(game)} target="_blank" rel="noopener noreferrer"
               onClick={(e) => e.stopPropagation()}
               className="mt-2 inline-flex items-center gap-1 text-[10px] text-zinc-500 hover:text-accent-soft transition">
              View on Steam <ExternalLink className="w-3 h-3" />
            </a>
          )}
        </div>
      </Card>
      );
    };

    /* ---------------- Browse view ---------------- */
    const BrowseView = ({ shortlist, onToggle, initialQuery = '' }) => {
      const { games: GAMES } = useGames();
      const [query, setQuery] = useState(initialQuery);
      const [genre, setGenre] = useState('All');
      const [coop, setCoop] = useState('All');
      const [sort, setSort] = useState('year');
      const [saleOnly, setSaleOnly] = useState(false);

      const genres = bucketOptions(GAMES);
      // How many are discounted right now — 0 until the live Steam feed lands,
      // which is also when the toggle would filter everything out, so it's
      // disabled until there's something to show.
      const saleCount = GAMES.filter(g => g.discount > 0).length;

      const list = useMemo(() => {
        let out = GAMES.filter(g =>
          (genre === 'All' || genreBucket(g) === genre) &&
          (coop === 'All' || (coop === 'Co-op' ? g.maxPlayers > 1 : g.maxPlayers === 1)) &&
          (!saleOnly || g.discount > 0) &&
          (query.trim() === '' || (g.studio + ' ' + g.title + ' ' + g.genre).toLowerCase().includes(query.toLowerCase()))
        );
        if (sort === 'rating') out = out.sort((a,b)=>b.displayInfo.rating-a.displayInfo.rating);
        if (sort === 'price-asc') out = out.sort((a,b)=>a.price-b.price);
        if (sort === 'price-desc') out = out.sort((a,b)=>b.price-a.price);
        if (sort === 'year') out = out.sort((a,b)=>b.year-a.year);
        if (sort === 'value') out = out.sort((a,b)=>dollarsPerHour(a)-dollarsPerHour(b));
        if (sort === 'discount') out = out.sort((a,b)=>(b.discount||0)-(a.discount||0));
        return out;
      }, [GAMES, query, genre, coop, sort, saleOnly]);

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Catalog" icon={Layers}
            title="Browse games"
            subtitle={`${GAMES.length} PC games, newest first. Steam prices and ratings are live from the Singapore store — with Epic and GOG prices on the store badges when the cross-store feed is up. Tap a card to add it to your comparison shortlist.`} />

          <Card className="p-3 mb-4">
            <div className="grid grid-cols-1 md:grid-cols-[1fr_auto_auto_auto_auto] gap-2">
              <div className="relative">
                <Search className="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2" />
                <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search title, studio or genre..."
                  className="w-full bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-9 pr-3 py-2 text-sm text-zinc-100 placeholder:text-zinc-500" />
              </div>
              <Selector value={genre} onChange={setGenre} options={genres} label="Genre" />
              <Selector value={coop} onChange={setCoop} options={['All','Co-op','Singleplayer']} label="Mode" />
              <Selector value={sort} onChange={setSort}
                options={['year','rating','discount','price-asc','price-desc','value']}
                labels={{year:'Newest', rating:'Top rated', discount:'On sale', 'price-asc':'Price ↑','price-desc':'Price ↓', value:'Best $/hour'}}
                label="Sort" />
              {/* Filter, not a sort — "show me only what's discounted right now". */}
              <button type="button" onClick={() => setSaleOnly(v => !v)}
                      disabled={saleCount === 0}
                      aria-pressed={saleOnly}
                      title={saleCount === 0 ? 'Waiting for live Steam prices' : `${saleCount} of ${GAMES.length} games are discounted right now`}
                      className={cx('rounded-lg px-3 py-2 text-sm inline-flex items-center gap-1.5 ring-1 transition whitespace-nowrap',
                        saleCount === 0 && 'opacity-40 cursor-not-allowed',
                        saleOnly
                          ? 'bg-emerald-500/20 text-emerald-200 ring-emerald-500/50'
                          : 'bg-ink-900 text-zinc-400 ring-ink-700 hover:text-zinc-200')}>
                <Tag className="w-3.5 h-3.5" />
                On sale
                {saleCount > 0 && <span className={cx('text-[10px] rounded-full px-1.5 leading-4 font-semibold',
                                                      saleOnly ? 'bg-emerald-400 text-ink-950' : 'bg-ink-700 text-zinc-300')}>{saleCount}</span>}
              </button>
            </div>
          </Card>

          <div className="mb-4 flex items-center justify-between gap-3 text-xs text-zinc-500">
            <span>Showing {list.length} of {GAMES.length} games</span>
            {(genre !== 'All' || coop !== 'All' || saleOnly || query.trim() !== '') && (
              <button onClick={() => { setGenre('All'); setCoop('All'); setSaleOnly(false); setQuery(''); }}
                      className="inline-flex items-center gap-1 hover:text-zinc-300 transition">
                <X className="w-3 h-3" /> Clear filters
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {list.map(g => (
              <GameCard key={g.id} game={g} selected={shortlist.includes(g.id)} onClick={() => onToggle(g.id)} />
            ))}
            {list.length === 0 && (
              <div className="col-span-full text-center text-zinc-500 py-12">No games match your filters.</div>
            )}
          </div>
        </div>
      );
    };

    /* ---------------- Compare view ---------------- */
    /* ---------------- Compare: verdict machinery ----------------
       The landing page promises "verdict first, specs second"; this is the
       verdict. It is computed from the SAME rows the table renders, so the
       banner and the little award icons can never disagree with each other —
       one source of truth, exactly like the landing page's stopProgress().

       Weights say which rows actually decide a purchase. Release year and
       Early Access are context, not merit: at weight 0 a 2024 game can't
       out-argue a cheaper, better-reviewed 2019 one just for being new. */
    const ROW_WEIGHT = {
      rating: 2, value: 2, price: 1.5, cheapest: 1, hours: 1,
      combat: 0.5, story: 0.5, replay: 0.5,
      year: 0, stores: 0, alltimelow: 0, players: 0, earlyAccess: 0,
    };
    const SPEC_CAVEAT = {
      combat: 'deeper combat',
      story: 'a stronger story',
      coop: 'proper co-op',
      replay: 'more replay value',
    };

    function buildVerdict(picked, rows, deals) {
      const score = {}, wins = {};
      picked.forEach(g => { score[g.id] = 0; wins[g.id] = 0; });

      let counted = 0, totalWeight = 0;
      rows.forEach(row => {
        const w = ROW_WEIGHT[row.key] || 0;
        if (!row.cmp || !w) return;
        counted++; totalWeight += w;
        const sorted = [...picked].sort(row.cmp);        // worst → best
        const best = sorted[sorted.length - 1];
        // a dead heat shouldn't hand anyone the row
        if (row.cmp(sorted[sorted.length - 2], best) === 0) return;
        score[best.id] += w;
        wins[best.id] += 1;
      });

      const ranked = [...picked].sort((a, b) =>
        (score[b.id] - score[a.id]) || (b.displayInfo.rating - a.displayInfo.rating));
      const top = ranked[0], next = ranked[1];
      const margin = totalWeight ? (score[top.id] - score[next.id]) / totalWeight : 0;

      // Reasons are concrete deltas against the runner-up, never adjectives.
      const reasons = [];
      if (atHistoryLow(deals, top)) reasons.push('it is at its all-time low right now');
      const dTop = dollarsPerHour(top), dNext = dollarsPerHour(next);
      if (dTop < dNext) reasons.push(`S$${dTop.toFixed(2)} an hour against S$${dNext.toFixed(2)}`);
      const rd = top.displayInfo.rating - next.displayInfo.rating;
      if (rd >= 3) reasons.push(`${rd} points better reviewed on Steam`);
      const pd = Math.round((next.price - top.price) * 100) / 100;
      const hourRatio = next.displayInfo.hoursToBeat
        ? top.displayInfo.hoursToBeat / next.displayInfo.hoursToBeat : 1;
      if (pd >= 3) reasons.push(`S$${pd.toFixed(2)} cheaper`);
      else if (pd <= -3 && hourRatio >= 1.3) reasons.push(`S$${Math.abs(pd).toFixed(2)} more for ${hourRatio.toFixed(1)}× the playtime`);
      const hd = top.displayInfo.hoursToBeat - next.displayInfo.hoursToBeat;
      if (hd >= 5 && reasons.length < 3) reasons.push(`${hd} more hours in it`);

      // The honest counterweight: where the runner-up genuinely wins.
      let caveat = null, gapNeeded = 12;
      Object.keys(SPEC_CAVEAT).forEach(k => {
        const gap = (next.specs[k] || 0) - (top.specs[k] || 0);
        if (gap > gapNeeded) { gapNeeded = gap; caveat = SPEC_CAVEAT[k]; }
      });

      return {
        top, next, wins, counted,
        close: margin < 0.12,
        reasons: reasons.slice(0, 3),
        caveat,
      };
    }

    /* $/hour is the whole thesis of this site, so in the matrix it gets a
       shape rather than being the smallest number on the row. Shorter bar =
       cheaper fun; the best of the picked games is the only one in colour. */
    const ValueBar = ({ v, max, best }) => {
      const pct = Math.max(8, Math.min(100, (v / (max || 1)) * 100));
      const isBest = v <= best + 0.001;
      return (
        <span className="block w-full min-w-[92px]">
          <span className={cx('block text-sm font-semibold tabular-nums', isBest ? 'text-emerald-300' : 'text-zinc-200')}>
            S${v.toFixed(2)}<span className="text-[10px] font-normal text-zinc-500"> /hr</span>
          </span>
          <span className="mt-1 block h-1.5 rounded-full bg-ink-800 overflow-hidden">
            <span className={cx('block h-full rounded-full transition-all duration-500', isBest ? 'bg-emerald-400' : 'bg-zinc-600')}
                  style={{ width: pct + '%' }} />
          </span>
        </span>
      );
    };

    const CompareView = ({ shortlist, setShortlist, onGoBrowse }) => {
      const { games: GAMES } = useGames();
      const { deals } = useDealsCtx();
      const picked = shortlist.map(id => GAMES.find(g => g.id === id)).filter(Boolean);
      const canAddMore = picked.length < 3;
      const [copied, setCopied] = useState(false);
      // declared above the "fewer than 2 games" early return — hooks can't
      // live behind a conditional
      const [diffOnly, setDiffOnly] = useState(false);

      // Shareable link that re-opens Compare with this exact shortlist —
      // parseHash() understands the #compare=<ids> format on load.
      const copyShareLink = () => {
        const url = location.origin + location.pathname + '#compare=' + picked.map(g => g.id).join(',');
        copyText(url, () => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
      };

      // Cheapest store listing for a game (live deals data only).
      const minStore = (g) => {
        const priced = gameStores(g, deals).filter(s => typeof s.price === 'number');
        if (!priced.length) return null;
        return priced.reduce((a, b) => (b.price < a.price ? b : a));
      };

      if (picked.length < 2) {
        return (
          <div className="animate-fade-in">
            <SectionTitle eyebrow="Compare" icon={Layers}
              title="Side-by-side game matrix"
              subtitle="Pick 2 or 3 games from the catalog to compare price, rating, hours-to-beat, and co-op support." />
            <Card className="p-8 text-center">
              <div className="text-zinc-400 mb-4">You have {picked.length} game{picked.length === 1 ? '' : 's'} selected. Add {2 - picked.length} more to start comparing.</div>
              <button onClick={onGoBrowse}
                className="inline-flex items-center gap-2 bg-ember hover:bg-ember-soft text-white font-semibold rounded-lg px-4 py-2 transition">
                Browse games <ArrowRight className="w-4 h-4" />
              </button>
            </Card>
          </div>
        );
      }

      // `raw` + `tol` exist for the "only differences" filter: raw gives the
      // comparable value behind a cell that renders as JSX, tol is how close
      // two games have to be before the row is noise rather than a difference
      // (a 96% and a 95% rating is not a reason to pick one over the other).
      const dphs = picked.map(dollarsPerHour);
      const maxDph = Math.max(...dphs), bestDph = Math.min(...dphs);

      const specRows = [
        { key: 'rating', label: 'Steam rating', get: (g) => `${g.displayInfo.rating}%`, raw: (g) => g.displayInfo.rating, tol: 2, cmp: (a,b) => a.displayInfo.rating - b.displayInfo.rating, icon: Star },
        { key: 'price', label: 'Price on Steam', get: (g) => <PriceTag g={g} />, raw: (g) => g.price, tol: 0.5, cmp: (a,b) => b.price - a.price, icon: DollarSign }, // lower price wins
        { key: 'stores', label: 'Available on', get: (g) => <StoreBadges game={g} />, raw: (g) => gameStores(g, deals).map(s => s.store).sort().join('/'), icon: Store },
        // Cross-store rows only make sense once live deals data has landed.
        ...(deals ? [
          { key: 'cheapest', label: 'Cheapest store', icon: Tag,
            get: (g) => { const m = minStore(g); return m ? `${m.store} · ${fmtStorePrice(m.price, m.currency, m.approx)}` : '—'; },
            raw: (g) => { const m = minStore(g); return m ? `${m.store} ${m.price.toFixed(2)}` : '—'; },
            cmp: (a, b) => { const pa = minStore(a), pb = minStore(b); return (pb ? pb.price : Infinity) - (pa ? pa.price : Infinity); } }, // lower wins
          { key: 'alltimelow', label: 'All-time low price', icon: Clock,
            raw: (g) => { const d = deals[String(g.appId)]; const low = d && d.historyLow; return low && typeof low.price === 'number' ? low.price : null; },
            get: (g) => {
              const d = deals[String(g.appId)]; const low = d && d.historyLow;
              if (!low || typeof low.price !== 'number') return '—';
              return (
                <span className="inline-flex items-center gap-1.5 flex-wrap">
                  {fmtStorePrice(low.price, low.currency, low.approx)}
                  {low.shop && <span className="text-zinc-500 text-xs">on {low.shop}</span>}
                  {atHistoryLow(deals, g) && <Pill tone="hot">at its low now</Pill>}
                </span>
              );
            } },
        ] : []),
        { key: 'value', label: '$ / hour', get: (g) => <ValueBar v={dollarsPerHour(g)} max={maxDph} best={bestDph} />, raw: (g) => dollarsPerHour(g), tol: 0.05, cmp: (a,b) => dollarsPerHour(b) - dollarsPerHour(a), icon: TrendingUp }, // lower wins
        { key: 'hours', label: 'Hours to beat', get: (g) => `${g.displayInfo.hoursToBeat}h`, raw: (g) => g.displayInfo.hoursToBeat, tol: 2, cmp: (a,b) => a.displayInfo.hoursToBeat - b.displayInfo.hoursToBeat, icon: Clock },
        // No cmp: "newer" is not a win. Leaving it comparable meant the award
        // icons outnumbered the scoreline, and a 2019 classic lost a row to a
        // worse 2024 game for existing later.
        { key: 'year', label: 'Released', get: (g) => g.year, raw: (g) => g.year },
        { key: 'combat', label: 'Combat depth', get: (g) => g.specs.combat, raw: (g) => g.specs.combat, tol: 5, cmp: (a,b) => a.specs.combat - b.specs.combat, icon: Skull },
        { key: 'story', label: 'Story depth', get: (g) => g.specs.story, raw: (g) => g.specs.story, tol: 5, cmp: (a,b) => a.specs.story - b.specs.story, icon: BookOpen },
        { key: 'replay', label: 'Replayability', get: (g) => g.specs.replay, raw: (g) => g.specs.replay, tol: 5, cmp: (a,b) => a.specs.replay - b.specs.replay, icon: Repeat },
        { key: 'players', label: 'Players', get: (g) => g.displayInfo.players, raw: (g) => g.displayInfo.players, icon: Users },
        { key: 'earlyAccess', label: 'Early Access', get: (g) => g.displayInfo.earlyAccess ? 'Yes' : 'No, 1.0 release', raw: (g) => !!g.displayInfo.earlyAccess },
      ];

      const verdict = buildVerdict(picked, specRows, deals);

      // A row is "the same" when every picked game lands inside its tolerance
      // (numbers) or renders the identical value (everything else).
      const isTied = (row) => {
        const vals = picked.map(g => (row.raw ? row.raw(g) : row.get(g)));
        if (vals.every(v => typeof v === 'number')) {
          return Math.max(...vals) - Math.min(...vals) <= (row.tol || 0);
        }
        return vals.every(v => String(v) === String(vals[0]));
      };
      const shownRows = diffOnly ? specRows.filter(r => !isTied(r)) : specRows;
      const hiddenCount = specRows.length - shownRows.length;

      return (
        <div className="animate-fade-in">
          <SectionTitle eyebrow="Compare" icon={Layers}
            title="Side-by-side comparison"
            subtitle="The verdict first — the table underneath is the evidence for it." />

          {/* ---- Verdict ----
              Deliberately the loudest thing on the page: the site's promise is
              "verdict first, specs second", and a spec matrix on its own is
              still homework. Reasons are deltas against the runner-up, and the
              caveat names where the runner-up genuinely wins — a verdict you
              can argue with is a verdict worth trusting. */}
          <Card className="relative overflow-hidden mb-5 ring-ember/30">
            <div className="absolute inset-0 bg-gradient-to-r from-ember/15 via-ember/5 to-transparent pointer-events-none" />
            <div className="relative flex flex-col sm:flex-row gap-4 p-4 sm:p-5">
              <div className="w-full sm:w-44 shrink-0 rounded-xl overflow-hidden ring-1 ring-ink-700">
                <GameArt game={verdict.top} />
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-[11px] uppercase tracking-widest text-orange-300/90 flex items-center gap-1.5 mb-1.5">
                  <Sparkles className="w-3.5 h-3.5" />
                  {verdict.close ? "It's close" : 'The verdict'}
                </div>
                <h3 className="font-serif text-2xl md:text-3xl font-medium text-zinc-50 leading-tight">
                  {verdict.close
                    ? <React.Fragment>Either works — {verdict.top.title} edges it.</React.Fragment>
                    : <React.Fragment>Get {verdict.top.title}.</React.Fragment>}
                </h3>
                {verdict.reasons.length > 0 && (
                  <p className="text-sm text-zinc-300 mt-2">
                    Against {verdict.next.title}: {verdict.reasons.join(' · ')}.
                  </p>
                )}
                {verdict.caveat && (
                  <p className="text-sm text-zinc-400 mt-1.5">
                    Pick <span className="text-zinc-200">{verdict.next.title}</span> instead if you want {verdict.caveat}.
                  </p>
                )}
                <div className="mt-3 flex items-center gap-2 flex-wrap">
                  <Pill tone="hot"><Award className="w-3 h-3" /> wins {verdict.wins[verdict.top.id]} of {verdict.counted} rows that matter</Pill>
                  <PriceTag g={verdict.top} size="lg" />
                  {steamStoreUrl(verdict.top) && (
                    <a href={steamStoreUrl(verdict.top)} target="_blank" rel="noopener noreferrer"
                       className="inline-flex items-center gap-1.5 text-xs font-semibold rounded-lg px-3 py-1.5 bg-ember hover:bg-ember-soft text-white transition">
                      Open on Steam <ExternalLink className="w-3.5 h-3.5" />
                    </a>
                  )}
                </div>
              </div>
            </div>
          </Card>

          <div className="flex items-center justify-between gap-2 flex-wrap mb-4">
            {/* Hiding rows the games agree on is the difference between reading
                a table and reading an answer. */}
            <button onClick={() => setDiffOnly(v => !v)}
              aria-pressed={diffOnly}
              className={cx('inline-flex items-center gap-1.5 text-xs rounded-lg px-3 py-1.5 ring-1 transition',
                            diffOnly
                              ? 'bg-accent/15 text-accent-soft ring-accent/40'
                              : 'ring-ink-700 bg-ink-900 text-zinc-300 hover:text-zinc-100 hover:ring-ink-600')}
              title="Hide rows where these games are effectively the same">
              <Zap className="w-3.5 h-3.5" />
              Only show differences
              {diffOnly && hiddenCount > 0 && <span className="text-[10px] text-zinc-400">({hiddenCount} hidden)</span>}
            </button>
            <button onClick={copyShareLink}
              className="inline-flex items-center gap-1.5 text-xs rounded-lg px-3 py-1.5 ring-1 ring-ink-700 bg-ink-900 text-zinc-300 hover:text-zinc-100 hover:ring-ink-600 transition"
              title="Copy a link that opens this comparison">
              {copied
                ? <React.Fragment><Check className="w-3.5 h-3.5 text-teal-300" /> Link copied</React.Fragment>
                : <React.Fragment><ExternalLink className="w-3.5 h-3.5" /> Copy share link</React.Fragment>}
            </button>
          </div>

          {/* Game chips row */}
          <div className={cx('grid gap-3 mb-6', picked.length === 2 ? 'md:grid-cols-2' : 'md:grid-cols-3')}>
            {picked.map(g => (
              <Card key={g.id} className="relative overflow-hidden">
                <GameArt game={g} />
                {/* Sits over the artwork, so it carries its own scrim rather
                    than relying on whatever happens to be behind it. */}
                <button onClick={() => setShortlist(shortlist.filter(id => id !== g.id))}
                        className="absolute top-2 right-2 p-1 rounded-full bg-ink-950/70 backdrop-blur-sm text-zinc-300 hover:text-rose-400 transition" title="Remove">
                  <X className="w-4 h-4" />
                </button>
                <div className="p-4 pt-3">
                  <div className="min-w-0">
                    <div className="text-xs text-zinc-400 truncate">{g.studio}</div>
                    <div className="text-zinc-100 font-semibold truncate" title={g.title}>{g.title}</div>
                    <div className="text-xs text-zinc-400 flex items-center gap-1.5 mt-0.5">
                      <PriceTag g={g} /> <span className="text-zinc-600">·</span> {g.year}
                    </div>
                    {steamStoreUrl(g) && (
                      <a href={steamStoreUrl(g)} target="_blank" rel="noopener noreferrer"
                         className="mt-1 inline-flex items-center gap-1 text-[10px] text-zinc-500 hover:text-accent-soft transition">
                        View on Steam <ExternalLink className="w-3 h-3" />
                      </a>
                    )}
                  </div>
                  {/* On phones these bars duplicate the spec-matrix rows below and
                      triple the scroll distance, so they're desktop-only. */}
                  <div className="hidden md:block mt-3 space-y-1.5">
                    <StatBar label="Combat" value={g.specs.combat} color={g.accent} sub={g.specs.combat} />
                    <StatBar label="Story" value={g.specs.story} color={g.accent} sub={g.specs.story} />
                    <StatBar label="Co-op" value={g.specs.coop} color={g.accent} sub={g.specs.coop} />
                    <StatBar label="Replay" value={g.specs.replay} color={g.accent} sub={g.specs.replay} />
                  </div>
                </div>
              </Card>
            ))}
            {canAddMore && (
              <Card className="p-4 border-2 border-dashed border-ink-700 flex items-center justify-center text-zinc-500 hover:text-accent-soft hover:border-accent/50 cursor-pointer"
                    onClick={onGoBrowse}>
                <div className="text-center">
                  <Plus className="w-6 h-6 mx-auto mb-1" />
                  <div className="text-sm">Add another game</div>
                </div>
              </Card>
            )}
          </div>

          {/* Spec matrix */}
          <Card className="overflow-hidden">
            <div className="overflow-x-auto">
              {/* Fixed layout so game columns stay equal-width (see Stores table). */}
              <table className="w-full table-fixed min-w-[560px] text-sm">
                <thead className="bg-ink-800/60 text-zinc-400 text-xs uppercase tracking-wider">
                  <tr>
                    <th className="w-40 text-left px-4 py-3 font-medium">Spec</th>
                    {picked.map(g => (
                      <th key={g.id} className="text-left px-4 py-3 font-medium text-zinc-200 align-bottom">

    /* ---------------- Advisor view ---------------- */
    const PRIORITY_LABELS = { combat: 'Combat depth', story: 'Story / writing', coop: 'Co-op support', replay: 'Replayability' };

        </div>
      </div>
    );

    /* ---------------- App shell ---------------- */
    // `short` is the label used on the mobile bottom tab bar, where six
    // columns leave ~60px each.
    const TABS = [
      { id: 'browse',  label: 'Browse',  icon: Layers },
      { id: 'compare', label: 'Compare', icon: Package },
      { id: 'advisor', label: 'Advisor', icon: Sparkles },
      { id: 'value',   label: 'Best Value', short: 'Value', icon: TrendingUp },
      { id: 'free',    label: 'Free Games', short: 'Free', icon: Gift },
      { id: 'stores',  label: 'Stores', icon: Store },
    ];

    const TAB_IDS = TABS.map(t => t.id);

    // The URL hash carries shareable state: "#<tab>" opens that tab, and
    // "#compare=id1,id2" opens Compare pre-loaded with those games (this is
    // the format CompareView's "Copy share link" button emits). Hash state
    // always wins over anything restored from localStorage.
    function parseHash() {
      const h = decodeURIComponent(window.location.hash.replace(/^#/, ''));
      if (h.indexOf('compare=') === 0) {
        const ids = h.slice('compare='.length).split(',')
          .filter(id => GAMES.some(g => g.id === id)).slice(0, 3);
        return { tab: 'compare', ids };
      }
      return TAB_IDS.includes(h) ? { tab: h, ids: null } : null;
    }
    const initialHash = parseHash();

    // Per-game landing pages (/game/<slug>): the SEO middleware pre-renders the
    // matching game's HTML for crawlers; here we make a real visitor land on
    // Browse with that game's title pre-searched so they see it front-and-centre.
    const deepLinkGame = (() => {
      const m = window.location.pathname.match(/^\/game\/([^/]+)\/?$/);
      return m ? GAMES.find(g => g.id === decodeURIComponent(m[1])) : null;
    })();

    const App = () => {
      const [tab, setTabState] = useState(initialHash ? initialHash.tab : 'browse');
      const [shortlist, setShortlist] = usePersistedState('lc-games-shortlist',
