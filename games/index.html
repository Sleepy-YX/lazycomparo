  <!-- Exact versions, not floating ranges. Unpinned, @babel/standalone had
       already rolled this site onto Babel 8 without a single commit here —
       a live site should not be able to change under you like that. -->
  <script defer crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- @babel/standalone is deliberately NOT loaded here. It is 2.4 MB — bigger
       than everything else on the page combined — and as a blocking <head>
       script it made the browser download and parse a compiler before it was
       allowed to paint anything. The bootstrap at the end of <body> fetches it
       on demand, and only when its compile cache misses. -->
  <style>
    html, body { background: #0a0a0b; color: #e7e7ea; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #111113; }
    ::-webkit-scrollbar-thumb { background: #37373d; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b4b53; }
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px; background: #28282c; border-radius: 999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      height: 18px; width: 18px; margin-top: -6px;
      background: #22d3ee; border-radius: 999px;
      box-shadow: 0 0 0 4px rgba(34,211,238,0.15);
      cursor: pointer;
    }

    /* ---- 3D tilt cards (driven by the pointermove delegate at the bottom of the page,
       which sets --rx/--ry/--mx/--my/--fx/--fy on the hovered .tilt-card) ---- */
    .tilt-card {
      position: relative;
      transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--tz, 1));
      transition: transform .18s ease-out, box-shadow .25s ease-out;
      will-change: transform;
    }
    .tilt-card:hover {
      --tz: 1.015;
      box-shadow: 0 20px 44px -20px rgba(0,0,0,.75), 0 0 30px -14px rgba(34,211,238,.35);
      z-index: 1;
    }
    /* moving glare that follows the cursor */
    .tilt-card::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: radial-gradient(460px circle at var(--mx, 50%) var(--my, 50%), rgba(160,225,255,.09), transparent 45%);
      opacity: 0; transition: opacity .25s ease-out;
    }
    .tilt-card:hover::after { opacity: 1; }
    /* inner elements that "float" above the card surface (counter-parallax) */
    .tilt-float {
      transform: translate3d(calc(var(--fx, 0) * 1px), calc(var(--fy, 0) * 1px), 0);
      transition: transform .18s ease-out;
      will-change: transform;
    }
    @media (hover: none), (prefers-reduced-motion: reduce) {
      .tilt-card { transform: none !important; }
      .tilt-card::after { display: none; }
      .tilt-float { transform: none !important; }
    }

    /* ---- Boot splash ----
       The edge middleware injects plain SEO HTML into #root for crawlers;
       without this it flashes unstyled before React mounts. Keep the content
       in the DOM but hidden until the app reveals itself (html.app-ready,
       set from App's mount effect, the bootstrap catch, or a safety timer). */
    #root { visibility: hidden; }
    html.app-ready #root { visibility: visible; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0b;
      transition: opacity .3s ease-out;
    }
    html.app-ready #boot-splash { opacity: 0; pointer-events: none; }
    #boot-splash .wordmark {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.5rem; color: #e7e7ea; letter-spacing: .01em;
      animation: bootPulse 1.2s ease-in-out infinite;
    }
    #boot-splash .wordmark em { font-style: normal; color: #e05a3a; }
    @keyframes bootPulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .wordmark { animation: none; }
      #boot-splash { transition: none; }
    }

    /* ---- Sticky compare bar ----
       Lives in real CSS rather than Tailwind classes because it has to clear
       the fixed mobile tab bar, and Tailwind arbitrary values cannot express
       env() inside calc() reliably. The tab bar is ~52px plus the safe area;
       on md+ there is no tab bar, so the compare bar sits on the floor.
       z-index stays UNDER the tab bar (z-30) so navigation always wins. */
    .compare-bar {
      position: fixed; left: 0; right: 0; z-index: 25;
      bottom: calc(52px + env(safe-area-inset-bottom));
    }
    @media (min-width: 768px) {
      .compare-bar { bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
    }
    /* Slides up the first time it appears. Keyed on the count in React, so it
       replays when you go 0 -> 1 but not on every add. */
    .compare-bar-in { animation: cbarIn .3s cubic-bezier(.16, 1, .3, 1) both; }
    @keyframes cbarIn { from { transform: translateY(115%); } to { transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .compare-bar-in { animation: none; }
    }
  </style>
  <noscript>
    <style>
      /* No JS: show the server-injected SEO content instead of the splash. */
      #root { visibility: visible; }
      #boot-splash { display: none; }

<body class="dark">
  <div id="root"></div>
  <div id="boot-splash" aria-hidden="true">
    <div class="wordmark">Lazy<em>Comparo</em></div>
  </div>
  <script>
    // Reveal the app (hide the splash, show #root). Called from App's mount
    // effect; the 6s timer is a safety net so a failed CDN script never
    // leaves the page stuck on the splash — worst case the SEO content shows.
    window.__reveal = function () {
      document.documentElement.classList.add('app-ready');
      // Remove the node after the fade — background tabs freeze CSS
      // transitions, so don't rely on opacity alone to clear the overlay.
      setTimeout(function () {
        var s = document.getElementById('boot-splash');
        if (s) s.remove();
      }, 400);
    };
    setTimeout(window.__reveal, 6000);
  </script>

  <script id="app-source" type="text/plain">
    const { useState, useMemo, useEffect, useRef } = React;

    /* ---------------- Icons (inline SVG, Lucide-style) ---------------- */
    const Icon = ({ children, className = 'w-4 h-4', ...rest }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"

    );
    const Gamepad = (p) => <Icon {...p}><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/><rect x="2" y="6" width="20" height="12" rx="6"/></Icon>;
    const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
    const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
    const Skull = (p) => <Icon {...p}><circle cx="12" cy="11" r="8"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><circle cx="9" cy="11" r="1.2"/><circle cx="15" cy="11" r="1.2"/></Icon>;
    const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></Icon>;
    const Repeat = (p) => <Icon {...p}><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></Icon>;
    const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
    const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
    const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
    const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
    const TrendingUp = (p) => <Icon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>;
    const DollarSign = (p) => <Icon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></Icon>;
    const Award = (p) => <Icon {...p}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></Icon>;
    const Info = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></Icon>;
    const Layers = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></Icon>;
    const Package = (p) => <Icon {...p}><path d="M16.5 9.4l-9-5.19"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Icon>;
    const Sparkles = (p) => <Icon {...p}><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></Icon>;
    const ArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
    const Star = (p) => <Icon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></Icon>;
    const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
    const Zap = (p) => <Icon {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></Icon>;

    /* The brand mark — same geometry as /favicon.svg and the landing page's
       inline header logo. Deliberately NOT an <Icon>: it carries its own brand
       fills instead of currentColor strokes, and it must not drift from the
       favicon, so change all three together. */
    const BrandMark = ({ className = 'w-8 h-8' }) => (
      <svg viewBox="0 0 64 64" className={className} aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#d9482b" />
        <g fill="#f6f1e7">
          <rect x="14" y="17" width="36" height="7.5" rx="3.75" />
          <rect x="14" y="28.25" width="26" height="7.5" rx="3.75" opacity=".62" />
          <rect x="14" y="39.5" width="16" height="7.5" rx="3.75" opacity=".38" />
        </g>
      </svg>
    );
    const Gift = (p) => <Icon {...p}><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></Icon>;
    // Filled, not stroked: a play triangle drawn with a 2px stroke reads as a
    // hollow arrow at 24px.
    const Play = (p) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3" fill="currentColor" stroke="none"/></Icon>;
    const Youtube = (p) => <Icon {...p}><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-2C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.41 19c1.71.46 8.59.46 8.59.46s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></Icon>;
    const ExternalLink = (p) => <Icon {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></Icon>;
    const Store = (p) => <Icon {...p}><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 21v-6h6v6"/><path d="M3 9h18"/></Icon>;
    const Calendar = (p) => <Icon {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Icon>;
    const Tag = (p) => <Icon {...p}><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></Icon>;

    /* ---------------- Game catalog ----------------
       The catalog lives in games.json and is fetched by the bootstrap at the
       bottom of this file, the same way mobile/ loads phones.json. It used to
       be 712 lines of literal here AND a trimmed second copy inside
       functions/_middleware.js, kept in step by hand and by a pre-push check;
       the two had already drifted. Now both read the one file.

       `appId` is the Steam AppID used to pull LIVE price + review data at
       runtime (see useSteamLive + /api/steam). The price/rating fields are sane
       fallbacks used before the live fetch lands or when it's unreachable
       (e.g. local dev, which has no Pages Functions). specs are normalized
       0-100 and drive the Advisor's weighted scoring. `stores` lists the
       non-Steam stores a game is sold on. Ordered newest-first. */
    const GAMES = window.__LC_GAMES;

    /* ---------------- Genre buckets ----------------
       `genre` on each game stays specific ("Roguelike Deckbuilder", "Metroidvania")
       because that's the useful label to READ on a card. But filtering by it was
       useless: 100 games spread over 50-odd genres left most of them holding a
       single game, so picking one emptied the grid. The filter therefore works on
       these ~9 buckets while the card still shows the specific genre.

       Every genre string in GAMES must appear here — anything unmapped falls into
       'Other', which is only offered as a filter option if something lands in it. */
    const GENRE_BUCKETS = {
      'Action RPG': 'RPG', 'Open-World RPG': 'RPG', 'Soulslike': 'RPG',
      'Soulslike RPG': 'RPG', 'Turn-based RPG': 'RPG', 'CRPG': 'RPG',
      'Co-op Action RPG': 'RPG',

      'Roguelike': 'Roguelike', 'Roguelike Deckbuilder': 'Roguelike',
      'Roguevania': 'Roguelike', 'Survivors-like': 'Roguelike',
      'Co-op Roguelike': 'Roguelike',

      'Co-op Shooter': 'Shooter', 'Soulslike Co-op Shooter': 'Shooter',
      'Co-op Extraction Shooter': 'Shooter', 'FPS': 'Shooter',
      'Mech Action': 'Shooter',

      'Survival Crafting': 'Survival', 'Sandbox Survival': 'Survival',
      'Survival Driving': 'Survival', 'Survival Vampire': 'Survival',
      'Survival Extraction': 'Survival', 'Zombie Survival': 'Survival',
      'Co-op Survival': 'Survival',

      'City Builder': 'Builders & Sims', 'City Survival': 'Builders & Sims',
      'Factory Building': 'Builders & Sims', 'Colony Sim': 'Builders & Sims',
      'Farming Sim': 'Builders & Sims', 'Business Sim': 'Builders & Sims',

      '4X Strategy': 'Strategy', 'Grand Strategy': 'Strategy', 'RTS': 'Strategy',
      'Turn-based Tactics': 'Strategy',

      'Adventure': 'Adventure', 'Co-op Adventure': 'Adventure',
      'Open-World Action': 'Adventure', 'Metroidvania': 'Adventure',
      'Mystery Adventure': 'Adventure', 'Puzzle': 'Adventure',
      'Co-op Puzzle': 'Adventure', 'Action Adventure': 'Adventure',

      // Fighting, racing and arcade-action genres arrived with the 60 -> 100
      // batch. They share one bucket instead of getting one each: 'Racing' on
      // its own would hold two games, which is exactly the near-empty-filter
      // problem these buckets exist to avoid. 'Precision Platformer' moved
      // here from Adventure for the same reason — Adventure was the largest
      // bucket by a wide margin.
      'Fighting': 'Action & Arcade', 'Beat-em-up': 'Action & Arcade',
      'Racing': 'Action & Arcade', 'Driving Sim': 'Action & Arcade',
      'Run and Gun': 'Action & Arcade', 'Precision Platformer': 'Action & Arcade',

      'Co-op Horror': 'Horror', 'Survival Horror': 'Horror',
    };

    // Display order for the filter dropdown; 'Other' is appended only if used.
    const BUCKET_ORDER = ['RPG', 'Roguelike', 'Shooter', 'Survival',
                          'Builders & Sims', 'Strategy', 'Adventure',
                          'Action & Arcade', 'Horror'];

    const genreBucket = (game) => GENRE_BUCKETS[game.genre] || 'Other';

    // Buckets actually represented in the catalog, in display order.
    function bucketOptions(games) {
      const present = new Set(games.map(genreBucket));
      const ordered = BUCKET_ORDER.filter(b => present.has(b));
      if (present.has('Other')) ordered.push('Other');
      return ['All', ...ordered];
    }

    /* ---------------- Store availability (editorial fallback) ---------------- */
    // Stores each game is sold on BESIDES Steam. Only used until live
    // cross-store prices from /api/deals (IsThereAnyDeal) arrive — the live
    // data overrides this list, including prices and store links.
    //
    // This used to be a second map keyed by game id, sitting next to the
    // catalog and mirrored again in the middleware: three places to edit for
    // one fact about one game. It is now a field on the game itself.
    const extraStores = (game) => game.stores || [];

    // Store list for a game: live deals data (with prices/links) when we have
    // it, otherwise Steam + the editorial extras above (names only). The Steam
    // entry prefers the exact SGD price from our own Steam feed over ITAD's
    // FX-converted approximation whenever the live feed has landed.
    function gameStores(game, deals) {
      const d = deals && game.appId && deals[String(game.appId)];
      if (d && d.stores && d.stores.length) {
        return d.stores.map(s =>
          s.store === 'Steam' && game.live && typeof game.price === 'number'
            ? { ...s, price: game.price, currency: 'SGD', approx: false, url: s.url || steamStoreUrl(game) }
            : s);
      }
      return ['Steam', ...extraStores(game)].map(s => ({ store: s }));
    }

    // Is the game's cheapest CURRENT store price at (or below) its all-time
    // low? Compared strictly within ITAD data (/api/deals now converts
    // everything to SGD server-side, but if the FX step ever fails prices can
    // arrive in mixed currencies — so only stores sharing the low's currency
    // count, and the Steam feed's game.price stays out of this comparison).
    function atHistoryLow(deals, game) {
      const d = deals && game.appId && deals[String(game.appId)];
      const low = d && d.historyLow;
      if (!d || !low || typeof low.price !== 'number') return false;
      const priced = (d.stores || []).filter(s =>
        typeof s.price === 'number' && (!low.currency || !s.currency || s.currency === low.currency));
      if (!priced.length) return false;
      const cheapest = priced.reduce((a, b) => (b.price < a.price ? b : a));
      return cheapest.price <= low.price + 0.01;
    }

    /* ---------------- Scoring Algorithm ---------------- */
    /*
     * scoreGame(game, priorities)
     *   priorities = { combat, story, coop, replay } each 0-100.
     *   Returns a single weighted score 0-100 plus per-dimension contributions,
     *   so the Advisor can explain *why* a game ranked where it did.
     */
    function scoreGame(game, priorities) {
      const keys = ['combat', 'story', 'coop', 'replay'];
      const totalWeight = keys.reduce((s, k) => s + priorities[k], 0);
      if (totalWeight === 0) return { score: 0, contributions: {} };

      let score = 0;
      const contributions = {};
      keys.forEach((k) => {
        const c = (priorities[k] * game.specs[k]) / totalWeight;
        contributions[k] = c;
        score += c;
      });

      return { score: Math.round(score * 10) / 10, contributions };
    }

    function topPrioritiesForGame(contributions) {
      return Object.entries(contributions)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 2)
        .map(([k]) => k);
    }

    /* ---------------- Value math ---------------- */
    function dollarsPerHour(game) {
      return Math.round((game.price / game.displayInfo.hoursToBeat) * 100) / 100;
    }

    /* Three value bands, and they are the SINGLE source of truth for the Best
       Value tab: the distribution graph, the band filter chips and the $/hour
       colour in the table all read from here. They used to be an inline
       ternary in one table cell, which meant the only way to know where the
       boundaries were was to read that cell.

       The 0.50 / 1.50 boundaries are unchanged — this is a refactor of where
       they live, not a change to what they say.

       Class strings spelled out in full, per the note on HEAT below: the
       Tailwind Play CDN scans the document for literal class names, so
       anything concatenated never gets a rule. */
    const VALUE_BANDS = [
      { id: 'best', max: 0.5, label: 'Under S$0.50/hr', hint: 'exceptional value',
        text: 'text-emerald-300', bar: 'bg-emerald-400', ring: 'ring-emerald-500/40', tint: 'bg-emerald-500/10' },
      { id: 'good', max: 1.5, label: 'S$0.50 – S$1.50/hr', hint: 'solid value',
        text: 'text-amber-300', bar: 'bg-amber-400', ring: 'ring-amber-500/40', tint: 'bg-amber-500/10' },
      { id: 'rich', max: Infinity, label: 'Over S$1.50/hr', hint: 'short, or priced as a premium',
        text: 'text-rose-300', bar: 'bg-rose-400', ring: 'ring-rose-500/40', tint: 'bg-rose-500/10' },
    ];
    function valueBand(perHour) {
      return VALUE_BANDS.find(b => perHour <= b.max) || VALUE_BANDS[VALUE_BANDS.length - 1];
    }

    /* ---------------- Deal heat ----------------
       One semantic scale for "how good is this price, right now", used by every
       surface that shows a price — cards, compare table, value tab — and mirrored
       on the landing page's ticker, so a hot badge means the same thing on both
       sites instead of every discount looking identical.

       An all-time low outranks the raw percentage on purpose: 20% off a game
       that has never been cheaper is a better moment to buy than a routine 50%
       sale that comes round every quarter.

       The class strings are spelled out in full because the Tailwind Play CDN
       generates rules by scanning the document for literal class names —
       anything assembled by string concatenation would never get a rule. */
    const HEAT_ORDER = ['none', 'mild', 'warm', 'hot'];
    const HEAT = {
      hot: {
        badge: 'bg-ember/25 text-orange-200 ring-ember/60',
        text: 'text-orange-200',
        ring: 'ring-ember/50',
        dot: 'bg-ember',
        glow: 'shadow-[0_0_16px_-3px_rgba(217,72,43,.85)]',
      },
      warm: {
        badge: 'bg-amber-500/20 text-amber-200 ring-amber-500/40',
        text: 'text-amber-200', ring: 'ring-amber-500/30', dot: 'bg-amber-400', glow: '',
      },
      mild: {
        badge: 'bg-emerald-500/20 text-emerald-300 ring-emerald-500/30',
        text: 'text-emerald-300', ring: 'ring-emerald-500/25', dot: 'bg-emerald-400', glow: '',
      },
      none: {
        badge: 'bg-ink-700 text-zinc-300 ring-ink-600',
        text: 'text-zinc-300', ring: 'ring-ink-700', dot: 'bg-zinc-500', glow: '',
      },
    };

    function dealHeat(game, deals) {
      if (game.isFree || game.price === 0) return 'hot';
      if (atHistoryLow(deals, game)) return 'hot';
      const d = game.discount || 0;
      if (d >= 60) return 'hot';
      if (d >= 30) return 'warm';
      if (d > 0) return 'mild';
      return 'none';
    }

    /* ---------------- Live Steam data ---------------- */
    // Pulls real SGD prices (incl. current sale) + review scores from our own
    // /api/steam Pages Function, which proxies Steam server-side. Ids are sent in
    // chunks of 15 so each function call stays under Cloudflare's 50-subrequest
    // cap (2 subrequests per game). Falls back silently to the static data above
    // when the endpoint is unreachable — e.g. local dev, which has no Functions.
    const STEAM_ENDPOINT = '/api/steam';
    const STEAM_CHUNK = 15;

    function steamStoreUrl(game) {
      return game.appId ? `https://store.steampowered.com/app/${game.appId}/` : null;
    }

    // Official Steam store artwork, served free from Valve's CDN and keyed only
    // off the AppID we already store. 'header' is the 460x215 banner used on the
    // cards; 'capsule' is the 231x87 version for tighter rows.
    const STEAM_ART_BASE = 'https://shared.cloudflare.steamstatic.com/store_item_assets/steam/apps';
    function steamArtUrl(game, kind = 'header') {
      if (!game.appId) return null;
      const file = kind === 'capsule' ? 'capsule_231x87.jpg' : 'header.jpg';
      return `${STEAM_ART_BASE}/${game.appId}/${file}`;
    }

    function useSteamLive(baseGames) {
      const [live, setLive] = useState(null);            // { [appId]: liveData }
      const [status, setStatus] = useState('loading');   // loading | live | offline
      const [updatedAt, setUpdatedAt] = useState(null);

      useEffect(() => {
        let cancelled = false;
        const ids = baseGames.map(g => g.appId).filter(Boolean).map(String);
        const chunks = [];
        for (let i = 0; i < ids.length; i += STEAM_CHUNK) chunks.push(ids.slice(i, i + STEAM_CHUNK));

        (async () => {
          try {
            const parts = await Promise.all(chunks.map(async (c) => {
              const res = await fetch(`${STEAM_ENDPOINT}?ids=${c.join(',')}`);
              if (!res.ok) throw new Error('bad status ' + res.status);
              return res.json();
            }));
            if (cancelled) return;
            const map = {};
            let stamp = null;
            parts.forEach(p => { Object.assign(map, (p && p.games) || {}); stamp = (p && p.updated) || stamp; });
            if (Object.keys(map).length === 0) throw new Error('empty');
            setLive(map);
            setUpdatedAt(stamp);
            setStatus('live');
          } catch (e) {
            if (!cancelled) setStatus('offline');
          }
        })();

        return () => { cancelled = true; };
      }, []);

      const games = useMemo(() => {
        if (!live) return baseGames;
        return baseGames.map(g => {
          const d = g.appId && live[String(g.appId)];
          if (!d || d.error) return g;
          const merged = { ...g, displayInfo: { ...g.displayInfo } };
          if (d.isFree) { merged.price = 0; merged.isFree = true; }
          else if (typeof d.price === 'number') merged.price = d.price;
          if (typeof d.initial === 'number') merged.initialPrice = d.initial;
          if (typeof d.discount === 'number') merged.discount = d.discount;
          if (d.priceFormatted) merged.priceFormatted = d.priceFormatted;
          if (typeof d.ratingPct === 'number') merged.displayInfo.rating = d.ratingPct;
          if (d.ratingDesc) merged.displayInfo.ratingDesc = d.ratingDesc;
          if (typeof d.totalReviews === 'number') merged.displayInfo.totalReviews = d.totalReviews;
          merged.live = true;
          return merged;
        });
      }, [live, baseGames]);

      return { games, status, updatedAt };
    }

    const GamesContext = React.createContext({ games: GAMES, status: 'loading', updatedAt: null });
    const useGames = () => React.useContext(GamesContext);

    // Human-readable "how long ago" for the live-price timestamp.
    function timeAgo(iso) {
      if (!iso) return null;
      const diff = Date.now() - new Date(iso).getTime();
      if (diff < 0) return 'just now';
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      return `${h}h ago`;
    }

    /* ---------------- Persistence helpers ---------------- */
    // localStorage-backed useState. Storage can be unavailable (private mode,
    // blocked cookies) — every touch is wrapped, degrading to plain state.
    function usePersistedState(key, initial) {
      const [value, setValue] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          if (raw !== null) return JSON.parse(raw);
        } catch (e) {}
        return typeof initial === 'function' ? initial() : initial;
      });
      useEffect(() => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }, [key, value]);
      return [value, setValue];
    }

    // Clipboard copy with a hidden-textarea fallback for browsers/contexts
    // where navigator.clipboard is unavailable.
    function copyText(text, done) {
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else fallback();
    }

    /* ---------------- Live cross-store deals (IsThereAnyDeal) ---------------- */
    // Steam vs Epic vs GOG prices + all-time historical lows via our
    // /api/deals Pages Function (an ITAD proxy — needs ITAD_API_KEY set on the
    // Cloudflare Pages project). One request covers the whole catalog; the
    // function batches server-side. When unreachable or keyless the UI falls
    // back to Steam-only pricing + each game's editorial `stores` list.
    const DEALS_ENDPOINT = '/api/deals';
    // Must stay <= MAX_IDS in functions/api/deals.js, which silently truncates
    // anything beyond it — an over-long request drops games with no error.
    const DEALS_CHUNK = 30;

    function useDeals(baseGames) {
      const [deals, setDeals] = useState(null); // { [appId]: { stores:[...], historyLow } }
      const [status, setStatus] = useState('loading'); // loading | live | offline

      useEffect(() => {
        let cancelled = false;
        const ids = baseGames.map(g => g.appId).filter(Boolean).map(String);
        const chunks = [];
        for (let i = 0; i < ids.length; i += DEALS_CHUNK) chunks.push(ids.slice(i, i + DEALS_CHUNK));

        (async () => {
          try {
            // Chunks are independent: one failing (ITAD hiccup, cold cache
            // timeout) shouldn't throw away the games the others resolved.
            const parts = await Promise.all(chunks.map(async (c) => {
              try {
                const res = await fetch(`${DEALS_ENDPOINT}?ids=${c.join(',')}`);
                if (!res.ok) throw new Error('bad status ' + res.status);
                const data = await res.json();
                return (data && data.games) || {};
              } catch (e) {
                return {};
              }
            }));
            if (cancelled) return;
            const games = Object.assign({}, ...parts);
            if (Object.keys(games).length === 0) throw new Error('empty');
            setDeals(games);
            setStatus('live');
          } catch (e) {
            if (!cancelled) setStatus('offline');
          }
        })();
        return () => { cancelled = true; };
      }, []);

      return { deals, status };
    }

    const DealsContext = React.createContext({ deals: null, status: 'loading' });
    const useDealsCtx = () => React.useContext(DealsContext);

    /* ---------------- Free games (Epic official feed + GamerPower) ---------------- */
    // Two live sources: /api/epic-free (Epic's own promo feed via our proxy —
    // exact end dates, next week's drops, artwork) and the GamerPower API for
    // Steam giveaways. GamerPower retries through a CORS proxy, then falls
    // back to a static sample so the alert bar never breaks.
    const EPICFREE_ENDPOINT = '/api/epic-free';
    const FREEGAMES_API = 'https://www.gamerpower.com/api/filter?platform=epic-games-store.steam&type=game&sort-by=date';
    const FALLBACK_FREEBIES = [
      { id: 'f1', store: 'Epic',  title: 'Ghostwire: Tokyo',           worth: 'US$59.99', end: null, url: 'https://store.epicgames.com/en-US/free-games' },
      { id: 'f2', store: 'Epic',  title: 'Escape Academy',             worth: 'US$19.99', end: null, url: 'https://store.epicgames.com/en-US/free-games' },
      { id: 'f3', store: 'Steam', title: 'Warhammer 40,000: Gladius',  worth: 'US$39.99', end: null, url: 'https://store.steampowered.com/search/?maxprice=free&specials=1' },
      { id: 'f4', store: 'Steam', title: 'Killing Floor 2',            worth: 'US$29.99', end: null, url: 'https://store.steampowered.com/search/?maxprice=free&specials=1' },
    ];

    // Title normalizer for matching freebies against the catalog / dedupe.
    const normTitle = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

    /* The featured Short, from games/video.json — the same file the SEO
       middleware reads, so the page and the VideoObject markup can never
       advertise different videos. Absolute path: a relative one resolves to
       /game/video.json on a per-game page. A missing or empty file is not an
       error, it just means no video is featured this week. */
    function useFeaturedVideo() {
      const [video, setVideo] = useState(null);
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const res = await fetch('/video.json');
            if (!res.ok) return;
            const v = await res.json();
            if (!cancelled && v && v.id) setVideo(v);
          } catch (e) { /* no video section, site is unaffected */ }
        })();
        return () => { cancelled = true; };
      }, []);
      return video;
    }

    function useFreebies() {
      const [epic, setEpic] = useState({ current: [], upcoming: [], status: 'loading' });
      const [gw, setGw] = useState({ items: [], status: 'loading' });

      useEffect(() => {
        let cancelled = false;

        // 1) Epic's own feed via our Pages Function
        (async () => {
          try {
            const res = await fetch(EPICFREE_ENDPOINT);
            if (!res.ok) throw new Error();
            const data = await res.json();
            const current = (data && data.current) || [];
            const upcoming = (data && data.upcoming) || [];
            if (current.length + upcoming.length === 0) throw new Error();
            if (!cancelled) setEpic({ current, upcoming, status: 'live' });
          } catch (e) {
            if (!cancelled) setEpic(s => ({ ...s, status: 'offline' }));
          }
        })();

        // 2) GamerPower giveaways (Steam + Epic)
        const clean = (t) => t.replace(/\s*\((Epic Games|Steam)[^)]*\)/i, '').replace(/\s*Giveaway!?$/i, '').trim();
        const parse = (data) => (Array.isArray(data) ? data : [])
          .filter(g => g.status === 'Active')
          .slice(0, 8)
          .map(g => ({
            id: g.id,
            title: clean(g.title || ''),
            worth: g.worth && g.worth !== 'N/A' ? g.worth : null,
            end: g.end_date && g.end_date !== 'N/A' ? g.end_date : null,
            url: g.open_giveaway_url,
            store: /epic/i.test(g.platforms || '') ? 'Epic' : 'Steam',
          }));
        (async () => {
          const apply = (items) => {
            if (!cancelled && items.length) { setGw({ items, status: 'live' }); return true; }
            return false;
          };
          try {
            const res = await fetch(FREEGAMES_API);
            if (!res.ok || !apply(parse(await res.json()))) throw new Error();
          } catch {
            try {
              const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(FREEGAMES_API));
              if (!res.ok || !apply(parse(await res.json()))) throw new Error();
            } catch {
              if (!cancelled) setGw({ items: FALLBACK_FREEBIES, status: 'sample' });
            }
          }
        })();

        return () => { cancelled = true; };
      }, []);

      // Merged "free right now" list for the alert bar: Epic's official feed
      // is the source of truth for Epic when live; GamerPower fills in Steam.
      const nowFree = useMemo(() => {
        const items = epic.current.map(f => ({ id: 'epic-' + f.id, store: 'Epic', title: f.title, worth: f.worth, end: f.end, url: f.url }));
        gw.items.forEach(g => {
          if (epic.status === 'live' && g.store === 'Epic') return;
          if (items.some(i => normTitle(i.title) === normTitle(g.title))) return;
          items.push(g);
        });
        return items.slice(0, 8);
      }, [epic, gw]);

      const status = (epic.status === 'live' || gw.status === 'live') ? 'live'
        : (epic.status === 'loading' || gw.status === 'loading') ? 'loading' : 'sample';

      return { epicCurrent: epic.current, epicUpcoming: epic.upcoming, epicStatus: epic.status, giveaways: gw.items, nowFree, status };
    }

    const FreebiesContext = React.createContext({ epicCurrent: [], epicUpcoming: [], epicStatus: 'loading', giveaways: [], nowFree: [], status: 'loading' });
    const useFreebiesCtx = () => React.useContext(FreebiesContext);

    // "ends in 2d" countdown; accepts ISO or GamerPower's "YYYY-MM-DD HH:mm:ss".
    function endsIn(end) {
      if (!end) return null;
      const diff = new Date(String(end).replace(' ', 'T')) - Date.now();
      if (diff <= 0) return null;
      const d = Math.floor(diff / 86400000);
      if (d >= 1) return `ends in ${d}d`;
      const h = Math.floor(diff / 3600000);
      return h >= 1 ? `ends in ${h}h` : 'ending soon';
    }

    // "16 Jul" — short date for upcoming freebies.
    function fmtDay(iso) {
      if (!iso) return null;
      try { return new Date(iso).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' }); }
      catch (e) { return null; }
    }

    /* ---------------- Small UI primitives ---------------- */
    const cx = (...xs) => xs.filter(Boolean).join(' ');

    const StatBar = ({ value, max = 100, color = '#22d3ee', label, sub, showValue = true }) => {
      const pct = Math.max(0, Math.min(100, (value / max) * 100));
      return (
        <div>
          <div className="flex items-baseline justify-between text-xs mb-1">
            <span className="text-zinc-400">{label}</span>
            {showValue && <span className="text-zinc-200 font-medium">{sub ?? value}</span>}
          </div>
          <div className="h-2 rounded-full bg-ink-800 overflow-hidden">
            <div className="h-full rounded-full transition-all duration-500"
                 style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${color}80, ${color})` }} />
          </div>
        </div>
      );
    };

    const Pill = ({ children, tone = 'default' }) => {
      const tones = {
        default: 'bg-ink-700 text-zinc-300 ring-ink-600',
        good:    'bg-emerald-500/15 text-emerald-300 ring-emerald-500/30',
        meh:     'bg-amber-500/15 text-amber-300 ring-amber-500/30',
        bad:     'bg-rose-500/15 text-rose-300 ring-rose-500/30',
        accent:  'bg-accent/15 text-accent-soft ring-accent/40',
        hot:     'bg-ember/20 text-orange-200 ring-ember/50',   // deal heat — see HEAT
      };
      return <span className={cx('inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full ring-1', tones[tone])}>{children}</span>;
    };

    // Formats a price string from either live data (priceFormatted, e.g. "S$44.90")
    // or the static fallback integer. Whole numbers stay clean (S$14, not S$14.00).
    const fmtPrice = (n) => `S$${Number.isInteger(n) ? n : n.toFixed(2)}`;
    const priceLabel = (g) => (g.isFree || g.price === 0) ? 'Free' : (g.priceFormatted || fmtPrice(g.price));

    // Price with an on-sale treatment: -X% badge + struck original when discounted.
    // The badge is coloured by deal heat, so the size of the cut is readable
    // before the number is — and an all-time low gets its own marker, because
    // that is the one signal worth interrupting someone for.
    const PriceTag = ({ g, size = 'sm' }) => {
      const { deals } = useDealsCtx();
      if (g.isFree || g.price === 0)
        return <span className="text-xs font-semibold text-teal-300">Free</span>;
      const onSale = g.discount > 0 && g.initialPrice;
      const atLow = atHistoryLow(deals, g);
      const main = size === 'lg' ? 'text-sm font-semibold text-zinc-100' : 'text-xs font-semibold text-zinc-100';
      if (!onSale && !atLow) return <span className={cx(size === 'lg' ? 'text-sm' : 'text-xs', 'text-zinc-300')}>{priceLabel(g)}</span>;
      const h = HEAT[dealHeat(g, deals)];
      return (
        <span className="inline-flex items-center gap-1.5 whitespace-nowrap">
          {onSale && (
            <span className={cx('text-[10px] font-bold px-1 py-0.5 rounded ring-1 tabular-nums', h.badge, h.glow)}>-{g.discount}%</span>
          )}
          {atLow && (
            <span className="text-[9px] font-bold uppercase tracking-wider px-1 py-0.5 rounded ring-1 bg-ember/25 text-orange-200 ring-ember/60"
                  title="Cheapest this game has ever been, across tracked stores">Low</span>
          )}
          {onSale && <s className="text-[11px] text-zinc-500">{fmtPrice(g.initialPrice)}</s>}
          <span className={main}>{priceLabel(g)}</span>
        </span>
      );
    };

    /* ---------------- Store badges (Steam / Epic / GOG) ---------------- */
    const STORE_STYLES = {
      Steam: 'bg-sky-500/15 text-sky-300 ring-sky-500/30',
      Epic:  'bg-zinc-100/10 text-zinc-200 ring-zinc-400/30',
      GOG:   'bg-purple-500/15 text-purple-300 ring-purple-500/30',
    };

    // /api/deals converts ITAD's prices (USD for several SG stores) to SGD
    // server-side, flagging converted amounts `approx` — shown with a "~".
    // If the FX step fails upstream, prices arrive in their original currency
    // and are labeled honestly instead of being passed off as SGD.
    const CURRENCY_PREFIX = { SGD: 'S$', USD: 'US$', EUR: '€', GBP: '£' };
    const fmtStorePrice = (p, currency, approx) => {
      if (p === 0) return 'Free';
      const tilde = approx ? '~' : '';
      const pre = CURRENCY_PREFIX[currency];
      if (pre) return `${tilde}${pre}${p.toFixed(2)}`;
      return currency ? `${tilde}${currency} ${p.toFixed(2)}` : `${tilde}S$${p.toFixed(2)}`;
    };

    // Which stores sell this game. With live /api/deals data each badge shows
    // that store's current price and links to it; the cheapest store gets an
    // emerald ring. Without live data, plain availability badges.
    const StoreBadges = ({ game }) => {
      const { deals } = useDealsCtx();
      const stores = gameStores(game, deals);
      const priced = stores.filter(s => typeof s.price === 'number');
      const cheapest = priced.length > 1 ? priced.reduce((a, b) => (b.price < a.price ? b : a)).store : null;
      return (
        <span className="inline-flex items-center gap-1 flex-wrap">
          {stores.map(s => {
            const inner = (
              <span className={cx('inline-flex items-center gap-1 text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ring-1 whitespace-nowrap',
                                  STORE_STYLES[s.store] || STORE_STYLES.Steam,
                                  cheapest === s.store && 'ring-emerald-400/70')}
                    title={cheapest === s.store ? `Cheapest right now on ${s.store}` : `Available on ${s.store}`}>
                {s.store}
                {typeof s.price === 'number' && <span className="normal-case font-semibold text-zinc-100">{fmtStorePrice(s.price, s.currency, s.approx)}</span>}
              </span>
            );
            return s.url
              ? <a key={s.store} href={s.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} className="hover:opacity-80 transition">{inner}</a>
              : <span key={s.store}>{inner}</span>;

    const Card = ({ className = '', children, onClick }) => (
      <div onClick={onClick}
           className={cx('bg-ink-850 ring-1 ring-ink-700 rounded-2xl', onClick && 'cursor-pointer hover:ring-accent/50 transition tilt-card', className)}>
        {children}
      </div>

    /* ---------------- Game artwork ----------------
       Steam's own header banner, lazy-loaded (a full Browse grid is 60 images,
       so they must not all fetch up front). Any game without an AppID — or whose
       art 404s / is blocked — falls back to the accent-tinted gamepad tile the
       cards used before, so a missing image never leaves a blank hole.
       The image is decorative: the title is right below it as real text, and
       alt text here would just make screen readers read every card twice. */
    const GameArt = ({ game, selected, className = '' }) => {

      return (
        <div className={cx('relative aspect-[460/215] overflow-hidden bg-ink-900', className)}>

              <Gamepad className="w-8 h-8" style={{ color: game.accent }} />
            </div>
          )}
          {/* Feather the art into the card body so the studio line never sits
              against a hard horizontal edge. */}
          <div className="absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-ink-850 to-transparent pointer-events-none" />
          {selected && (
            <div className="absolute top-2 right-2 w-6 h-6 rounded-full bg-accent flex items-center justify-center shadow-lg shadow-black/50 tilt-float">
              <Check className="w-3.5 h-3.5 text-ink-950" />

    /* ---------------- Featured Short ----------------
       WHY IT IS A FACADE, NOT AN IFRAME
       /privacy says loading this site contacts a listed set of third parties
       and sets no cookies. A normal YouTube embed breaks that on page load,
       before anyone has asked to watch anything — and even the thumbnail would
       do it, which is why the poster is OUR file (games/video-poster.jpg,
       rendered from the video itself) and not i.ytimg.com. Nothing goes to
       YouTube until the visitor clicks; then it is the -nocookie host.

       The whole block renders NOTHING when video.json has no id, so an empty
       config is the safe state: publish the Short, paste the id, done. */
    const FeaturedVideo = ({ video }) => {
      const [playing, setPlaying] = useState(false);
      if (!video || !video.id) return null;
      const watchUrl = `https://www.youtube.com/watch?v=${video.id}`;
      return (
        <Card className="mb-4 overflow-hidden">
          <div className="flex flex-col sm:flex-row">
            {playing ? (
              /* 9:16, capped so a vertical video cannot eat the whole page. */
              <div className="w-full sm:w-[320px] shrink-0 bg-black">
                <iframe
                  src={`https://www.youtube-nocookie.com/embed/${video.id}?autoplay=1&rel=0&modestbranding=1`}
                  title={video.title}
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                  referrerPolicy="strict-origin-when-cross-origin"
                  allowFullScreen
                  className="w-full aspect-[9/16] max-h-[70vh] border-0" />
              </div>
            ) : (
              <button type="button" onClick={() => setPlaying(true)}
                      aria-label={`Play: ${video.title}`}
                      className="group relative w-full sm:w-[180px] shrink-0 overflow-hidden focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent">
                {/* eager, not lazy: this card is the first thing in Browse, so
                    the poster is in the initial viewport and deferring it just
                    leaves a hole where the play button should be. 50 KB. */}
                <img src={video.poster || '/video-poster.jpg'} alt=""
                     width="540" height="960" loading="eager" decoding="async"
                     className="w-full h-40 sm:h-full object-cover object-top opacity-90 group-hover:opacity-100 transition" />
                <span className="absolute inset-0 flex items-center justify-center">
                  <span className="w-14 h-14 rounded-full bg-ember/90 group-hover:bg-ember flex items-center justify-center shadow-lg shadow-black/50 transition">
                    <Play className="w-6 h-6 text-white translate-x-0.5" />
                  </span>
                </span>
              </button>
            )}

            <div className="p-4 md:p-5 min-w-0 flex-1">
              <div className="text-[11px] uppercase tracking-widest text-accent-soft/80 flex items-center gap-2">
                <Youtube className="w-3.5 h-3.5" /> This week on YouTube
              </div>
              <h3 className="font-serif text-lg md:text-xl text-zinc-50 mt-1.5">{video.title}</h3>
              {video.blurb && <p className="text-sm text-zinc-400 mt-1.5">{video.blurb}</p>}
              {video.picks && video.picks.length > 0 && (
                <div className="mt-2.5 flex flex-wrap gap-1.5">
                  {video.picks.map(p => <Pill key={p}>{p}</Pill>)}
                </div>
              )}
              <div className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs">
                {!playing && (
                  <button type="button" onClick={() => setPlaying(true)}
                          className="inline-flex items-center gap-1.5 text-accent-soft hover:text-accent transition font-medium">
                    <Play className="w-3.5 h-3.5" /> Play here
                  </button>
                )}
                <a href={watchUrl} target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 transition">
                  Watch on YouTube <ExternalLink className="w-3 h-3" />
                </a>
                <a href={video.channelUrl || 'https://www.youtube.com/@LazyComparo'}
                   target="_blank" rel="noopener noreferrer"
                   className="inline-flex items-center gap-1.5 text-zinc-400 hover:text-zinc-200 transition">
                  Subscribe <ExternalLink className="w-3 h-3" />
                </a>
                {/* The prices in the video are a snapshot; the grid below is
                    live. Say so rather than letting a stale clip look current. */}
                {video.published && (
                  <span className="text-zinc-600">Filmed {video.published} — prices below are live</span>
                )}
              </div>
            </div>
          </div>
        </Card>
      );
    };

    const SectionTitle = ({ eyebrow, title, subtitle, icon: I }) => (
      <div className="mb-6">
        {eyebrow && <div className="text-[11px] uppercase tracking-widest text-accent-soft/80 mb-2 flex items-center gap-2">
          {I && <I className="w-3.5 h-3.5" />}{eyebrow}
        </div>}
        <h2 className="font-serif text-2xl md:text-4xl font-medium text-zinc-50">{title}</h2>
        {subtitle && <p className="hidden sm:block text-zinc-400 mt-1 max-w-2xl">{subtitle}</p>}
      </div>
    );

    const Selector = ({ value, onChange, options, labels, label }) => (
      <div className="relative">
        <label className="absolute -top-2 left-2 px-1 text-[10px] uppercase tracking-wider text-zinc-500 bg-ink-850">{label}</label>
        <select value={value} onChange={e=>onChange(e.target.value)}
                className="bg-ink-900 ring-1 ring-ink-700 focus:ring-accent focus:outline-none rounded-lg pl-3 pr-8 py-2 text-sm text-zinc-100 appearance-none">
          {options.map(o => <option key={o} value={o}>{labels?.[o] ?? o}</option>)}

    /* ---------------- Game card (used in Browse + Compare picker) ---------------- */
    const GameCard = ({ game, selected, onClick, showPrice = true, full = false }) => {
      const { deals } = useDealsCtx();
      const { epicCurrent, giveaways } = useFreebiesCtx();
      const d = deals && game.appId && deals[String(game.appId)];
      const low = d && d.historyLow;
      // Cheapest current store price matches the best price ever recorded.
      const atLow = atHistoryLow(deals, game);
      const freeOnEpic =
        epicCurrent.some(f => normTitle(f.title) === normTitle(game.title)) ||
        giveaways.some(f => f.store === 'Epic' && normTitle(f.title) === normTitle(game.title));
      // Deal heat also warms the card edge — scanning a 60-card grid, the
      // hot ones should be findable without reading a single price.
      const heat = dealHeat(game, deals);
      return (
      <Card className={cx('relative animate-fade-in overflow-hidden',
                          selected ? 'ring-2 ring-accent'
                                   : heat === 'hot' ? cx('ring-1', HEAT.hot.ring, HEAT.hot.glow)
                                   : heat === 'warm' ? cx('ring-1', HEAT.warm.ring) : null)}

        <GameArt game={game} selected={selected} />
        <div className="p-4 pt-3">
          <div className="min-w-0">
            <div className="text-xs text-zinc-400 truncate">{game.studio}</div>
            <div className="text-zinc-100 font-semibold truncate" title={game.title}>{game.title}</div>
            <div className="flex items-center gap-2 mt-1">
              <Pill>{game.genre}</Pill>
              {showPrice && <PriceTag g={game} />}
            </div>
          </div>
          <div className="mt-3 space-y-1">
            <StatBar label={game.displayInfo.ratingDesc ? `Steam · ${game.displayInfo.ratingDesc}` : 'Steam rating'}
                     value={game.displayInfo.rating} sub={`${game.displayInfo.rating}%`} color={game.accent} />
          </div>
          <div className="mt-2.5 flex items-center gap-1.5 flex-wrap">
            <StoreBadges game={game} />
            {freeOnEpic && <Pill tone="good"><Gift className="w-3 h-3" /> FREE on Epic now</Pill>}
            {atLow && <Pill tone="hot"><Tag className="w-3 h-3" /> lowest price ever</Pill>}
          </div>
          {/* Actions.
              The card is still clickable for mouse users who have learned it,
              but that used to be the ONLY way to select a game and it was
              invisible: a <div> with no role, no keyboard focus, containing a
              "View on Steam" link that made the whole thing read as navigation
              — and the one sentence explaining it was in an element hidden on
              phones. This button is the real control. It is what a keyboard
              reaches, what a screen reader announces (as a toggle, via
              aria-pressed), and what tells a first-time visitor that the card
              does anything at all.

              The card is deliberately NOT given role="button" — it contains a
              link and now this button, and a button nesting other interactive
              elements is invalid and unusable with a screen reader. The div's
              onClick stays a mouse-only convenience that duplicates a control
              which IS exposed.

              stopPropagation is load-bearing: without it the card's own
              onClick fires too and the toggle immediately cancels itself. */}
          <div className="mt-3 flex items-center gap-2">
            <button type="button"
                    onClick={(e) => { e.stopPropagation(); if (onClick) onClick(); }}
                    aria-pressed={!!selected}
                    aria-label={selected
                      ? `Remove ${game.title} from the comparison`
                      : `Add ${game.title} to the comparison`}
                    title={full ? 'Comparison is full — remove one first' : undefined}
                    /* min-h on phones because text-xs + py-2 came out 32px
                       tall, well under the 44px touch minimum — and this is
                       now the primary action on every card. Desktop keeps the
                       tighter box, where the pointer is precise. */
                    className={cx('flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold transition',
                      'min-h-[44px] md:min-h-[36px]',
                      'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent',
                      selected ? 'bg-accent text-ink-950'
                        /* Full but not selected: dimmed, yet still clickable —
                           the click is what surfaces the "compare holds 3"
                           explanation, so disabling it would hide the reason. */
                        : full ? 'bg-ink-800 text-zinc-500 ring-1 ring-ink-700'
                               : 'bg-ink-800 text-zinc-200 ring-1 ring-ink-700 hover:bg-ink-700 hover:text-white')}>
              {selected
                ? <React.Fragment><Check className="w-3.5 h-3.5" /> Added</React.Fragment>
                : <React.Fragment><Plus className="w-3.5 h-3.5" /> Compare</React.Fragment>}
            </button>
            {steamStoreUrl(game) && (
              <a href={steamStoreUrl(game)} target="_blank" rel="noopener noreferrer"
                 onClick={(e) => e.stopPropagation()}
                 aria-label={`View ${game.title} on Steam — opens in a new tab`}
                 className="shrink-0 inline-flex items-center justify-center gap-1 rounded-lg px-2.5 py-2 min-h-[44px] md:min-h-[36px] text-[11px] text-zinc-500 ring-1 ring-ink-700 hover:text-accent-soft hover:ring-ink-600 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent">
                Steam <ExternalLink className="w-3 h-3" />
              </a>
            )}
          </div>
        </div>
      </Card>
      );
    };

    /* ---------------- Sticky compare bar ----------------
       Browse had no bridge to Compare. After picking games the only signal was
       a small count badge in the header you had already scrolled past, so the
       selection went nowhere and the shortlist was invisible while you were
       still choosing. This is that bridge, and it doubles as the one place the
       shortlist can be seen and edited without leaving the grid.

       It renders NOTHING at zero picks, so a visitor who is only browsing pays
       nothing for it — no bar, no spacer, no layout shift. */
    const CompareBar = ({ picked, max, notice, onRemove, onClear, onCompare }) => {
      if (!picked.length) return null;
      const ready = picked.length >= 2;
      return (
        <div className="compare-bar compare-bar-in" role="region" aria-label="Comparison shortlist">
          <div className="bg-ink-950/95 backdrop-blur-md border-t border-ink-700 shadow-2xl shadow-black/60">
            {/* The "compare is full" message from toggleShortlist. aria-live so
                a screen reader hears the refusal instead of silence. */}
            {notice && (
              <div role="status" aria-live="polite"
                   className="bg-amber-500/10 border-b border-amber-500/25 text-amber-200 text-xs px-4 md:px-6 py-2 text-center">
                {notice}
              </div>
            )}
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-2.5 flex flex-col md:flex-row md:items-center gap-2.5 md:gap-4">

              <div className="flex items-center gap-2 min-w-0 flex-1">
                <span className="hidden lg:block text-[10px] uppercase tracking-widest text-zinc-500 shrink-0">
                  Comparing
                </span>
                <div className="flex items-center gap-2 min-w-0 overflow-x-auto no-scrollbar py-1">
                  {picked.map(g => (
                    <div key={g.id} className="relative shrink-0">
                      <div className="w-[74px] md:w-[88px] rounded-md overflow-hidden ring-1 ring-ink-700">
                        <GameArt game={g} />
