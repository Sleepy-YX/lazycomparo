<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Every tag below is overwritten by functions/_middleware.js at the edge.
       The values here are only what a visitor sees if that rewrite is skipped. -->
  <title>PC games at their all-time low price right now | LazyComparo</title>
  <meta name="description" content="Live list of PC games currently at the cheapest price they have ever been on Steam, Epic or GOG." />
  <link rel="canonical" href="https://pcgames.lazycomparo.com/deals/all-time-low" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PC games at their all-time low price right now" />
  <meta property="og:description" content="These games have hit or beaten the lowest price ever recorded for them across Steam, Epic and GOG." />
  <meta property="og:url" content="https://pcgames.lazycomparo.com/deals/all-time-low" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Shared card, generated by .claude/make-og-images.ps1. Hub pages are
       re-sorted every 30 min from live pricing, so there is no one game whose
       art would honestly represent them. -->
  <meta property="og:site_name" content="LazyComparo" />
  <meta property="og:image" content="https://pcgames.lazycomparo.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="LazyComparo - compare PC game prices across Steam, Epic and GOG" />
  <!-- No React here on purpose — see the matching note in gog/index.html. -->
  <link rel="stylesheet" href="/hub.css" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <meta name="theme-color" content="#0a0a0b" />
</head>
<body>
  <div id="root">
    <p>Loading today's record-low prices&hellip;</p>
  </div>
</body>
</html>
